/* ---------------------------------------------------------------------------
   EDITOR RICETTA (nuova/modifica) — validazioni unità/quantità, righe dinamiche
--------------------------------------------------------------------------- */
function ingNamesDatalist(known){ return `<datalist id="ing-names">${known.map(n=>`<option value="${escapeAttr(n)}"></option>`).join("")}</datalist>`; }
function openRecipeEditor(existing, onSaved){
  const s=Store.get().settings;
  const base={nome:"",porzioniBase:s.defaultServings,categoria:"",tempo:"",tag:[],ingredienti:[],istruzioni:[],note:"",useCount:0};
  const r=Object.assign(base, existing?JSON.parse(JSON.stringify(existing)):{});
  const isNew=!existing || !existing.id;
  const units=s.unitPrefs.concat(["qb"]);
  const depts=s.departments;
  // nomi già usati (ricette + lista base), uno per chiave: così "patate" e "patata" non si moltiplicano
  const known=(()=>{ const m=new Map(); (Store.get().recipes||[]).forEach(r=>(r.ingredienti||[]).forEach(i=>{ const k=IngKey.key(i.nome); if(k&&!m.has(k)) m.set(k,i.nome); })); (s.favorites||[]).forEach(f=>{ const k=IngKey.key(f.nome); if(k&&!m.has(k)) m.set(k,f.nome); }); return [...m.values()].sort((a,b)=>a.localeCompare(b)); })();
  function ingRow(ing, idx){
    ing=ing||{nome:"",qty:null,unita:"g",reparto:""};
    return `<div class="ing-ed" data-row="${idx}">
      <input type="text" class="ie-nome" placeholder="ingrediente" list="ing-names" autocomplete="off" value="${escapeAttr(ing.nome||"")}">
      <input type="text" class="ie-qty" placeholder="qb" value="${ing.qty==null?'':ing.qty}">
      <select class="ie-unita" aria-label="Unità">${units.map(u=>`<option ${((ing.unita||'g')===u)?'selected':''}>${u}</option>`).join("")}</select>
      <select class="ie-rep" aria-label="Reparto"><option value="">(auto)</option>${depts.map(d=>`<option ${ing.reparto===d?'selected':''}>${escapeHtml(d)}</option>`).join("")}</select>
      <button type="button" class="btn btn-ghost btn-icon ie-del" aria-label="Rimuovi ingrediente">✕</button>
    </div>`;
  }
  const body=`
    <div class="field-row">
      ${ingNamesDatalist(known)}
      <div class="field"><label for="re-nome">Nome *</label><input id="re-nome" type="text" value="${escapeAttr(r.nome)}" autofocus></div>
      <div class="field"><label for="re-porz">Porzioni base *</label><input id="re-porz" type="number" min="1" max="30" value="${r.porzioniBase}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="re-cat">Categoria</label><input id="re-cat" type="text" value="${escapeAttr(r.categoria||'')}" placeholder="Primi, Secondi…"></div>
      <div class="field"><label for="re-tempo">Tempo</label><input id="re-tempo" type="text" value="${escapeAttr(r.tempo||'')}" placeholder="25 min"></div>
    </div>
    <div class="field"><label for="re-tag">Tag (separati da virgola)</label><input id="re-tag" type="text" value="${escapeAttr((r.tag||[]).join(', '))}" placeholder="vegetariano, veloce"></div>
    <div class="field">
      <label>Ingredienti</label>
      <div class="ed-head"><span>Nome</span><span>Q.tà</span><span>Unità</span><span>Reparto</span><span></span></div>
      <div id="re-ings">${(r.ingredienti.length?r.ingredienti:[null]).map(ingRow).join("")}</div>
      <button type="button" class="btn btn-sm mt-2" id="re-add-ing">+ Ingrediente</button>
    </div>
    <div class="field"><label for="re-ist">Istruzioni (una per riga)</label>
      <textarea id="re-ist" rows="5" placeholder="1) Metti a bollire l'acqua…">${escapeHtml((r.istruzioni||[]).map((x,i)=>`${i+1}) ${x}`).join("\n"))}</textarea></div>
    <div class="field"><label for="re-note">Note</label><textarea id="re-note" rows="2">${escapeHtml(r.note||'')}</textarea></div>
    <p id="re-err" class="help" style="color:var(--danger)" role="alert"></p>`;
  Modal.open({
    title:isNew?"Nuova ricetta":"Modifica ricetta", size:"lg", bodyHTML:body,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-save>Salva</button>`,
    onMount(dialog, close){
      const ingsWrap=dialog.querySelector("#re-ings");
      function wireDel(row){ row.querySelector(".ie-del").addEventListener("click",()=>row.remove()); }
      ingsWrap.querySelectorAll(".ing-ed").forEach(wireDel);
      dialog.querySelector("#re-add-ing").addEventListener("click",()=>{
        const wrap=document.createElement("div"); wrap.innerHTML=ingRow(null, "n"+ingsWrap.children.length);
        const row=wrap.firstElementChild; ingsWrap.appendChild(row); wireDel(row); row.querySelector(".ie-nome").focus();
      });
      dialog.querySelector("[data-save]").addEventListener("click",()=>{
        const err=dialog.querySelector("#re-err");
        const nome=dialog.querySelector("#re-nome").value.trim();
        const porz=clampInt(dialog.querySelector("#re-porz").value,1,30,0);
        if(!nome){ err.textContent="Il nome è obbligatorio."; return; }
        if(!porz){ err.textContent="Le porzioni base devono essere un numero ≥ 1."; return; }
        const ings=[]; let bad=null;
        ingsWrap.querySelectorAll(".ing-ed").forEach(row=>{
          const nm=row.querySelector(".ie-nome").value.trim(); if(!nm) return;
          let unita=row.querySelector(".ie-unita").value;
          const qtyRaw=row.querySelector(".ie-qty").value.trim();
          let qty=null;
          if(unita==="qb" || qtyRaw==="" || /^qb$/i.test(qtyRaw)){ qty=null; unita="qb"; }
          else { qty=parseFloat(qtyRaw.replace(",",".")); if(isNaN(qty)){ bad=nm; return; } }
          const rep=row.querySelector(".ie-rep").value || Reparti.guess(nm);
          ings.push({nome:nm, qty, unita, reparto:rep});
        });
        if(bad){ err.textContent=`Quantità non numerica per "${bad}" (usa un numero o lascia vuoto per “qb”).`; return; }
        const ist=dialog.querySelector("#re-ist").value.split("\n").map(l=>l.trim().replace(/^\d+[\).]\s*/,"")).filter(Boolean);
        const tag=dialog.querySelector("#re-tag").value.split(",").map(x=>x.trim()).filter(Boolean);
        const out={ id:r.id||Recipes.genId(), nome, porzioniBase:porz,
          categoria:dialog.querySelector("#re-cat").value.trim(), tempo:dialog.querySelector("#re-tempo").value.trim(),
          tag, ingredienti:ings, istruzioni:ist, note:dialog.querySelector("#re-note").value.trim(), useCount:r.useCount||0 };
        Store.update(db=>{ const i=db.recipes.findIndex(x=>x.id===out.id); if(i>=0) db.recipes[i]=out; else db.recipes.push(out); });
        close(); Toast.show(isNew?"Ricetta creata":"Ricetta salvata","ok");
        if(onSaved) onSaved(out);
      });
    }
  });
}

/* ---------------------------------------------------------------------------
   IMPORT/EXPORT ricette (.txt + .json)
--------------------------------------------------------------------------- */
function recipeToTxt(r){
  let out=`Nome: ${r.nome}\nPorzioniBase: ${r.porzioniBase}\n`;
  if(r.tempo) out+=`Tempo: ${r.tempo}\n`;
  if(r.categoria) out+=`Categoria: ${r.categoria}\n`;
  if(r.tag&&r.tag.length) out+=`Tag: ${r.tag.join(", ")}\n`;
  out+=`Ingredienti:\n`+(r.ingredienti||[]).map(i=>`- ${i.nome} | ${i.qty==null?'qb':(i.qty+' '+i.unita)}`).join("\n")+"\n";
  out+=`Istruzioni:\n`+(r.istruzioni||[]).map((x,i)=>`${i+1}) ${x}`).join("\n");
  if(r.note) out+=`\nNote: ${r.note}`;
  if(r.fonte) out+=`\nFonte: ${r.fonte}`;
  return out;
}

/* Parsa una riga ingrediente "- nome | qty unità" (tollerante) */
function parseIngredientLine(line){
  let l=(line||"").trim().replace(/^[-*•]\s*/,"");
  if(!l) return null;
  const parts=l.split("|");
  const nome=parts[0].trim();
  if(!nome) return null;
  const q = parts.length>1 ? Units.parseQty(parts.slice(1).join("|")) : {qty:null, unita:"qb"};
  return { nome, qty:q.qty, unita:q.unita, reparto:Reparti.guess(nome) };
}

/* ---------------------------------------------------------------------------
   AUTOCOMPLETE riutilizzabile
--------------------------------------------------------------------------- */
function attachAutocomplete(input, opts){
  const wrap=input.closest(".ac-wrap") || input.parentElement;
  let list=null, active=-1, items=[];
  function close(){ if(list){ list.remove(); list=null; active=-1; } }
  function build(){
    const q=input.value;
    const recs=Recipes.search(q);
    items=recs.map(r=>({type:"recipe", r}));
    if(q.trim() && !recs.some(r=>r.nome.toLowerCase()===q.trim().toLowerCase())) items.push({type:"create", text:q.trim()});
    close();
    if(!items.length) return;
    list=document.createElement("div"); list.className="ac-list"; list.setAttribute("role","listbox");
    items.forEach((it,i)=>{
      const it_el=document.createElement("div");
      it_el.className="ac-item"+(it.type==="create"?" ac-create":"");
      it_el.setAttribute("role","option");
      it_el.innerHTML = it.type==="recipe"
        ? `<span>${escapeHtml(it.r.nome)}</span><span class="ac-meta">${escapeHtml(it.r.categoria||"")}${it.r.porzioniBase?" · "+it.r.porzioniBase+" porz.":""}</span>`
        : `<span>+ Crea ricetta «${escapeHtml(it.text)}»</span>`;
      it_el.addEventListener("mousedown",e=>{ e.preventDefault(); choose(i); });
      list.appendChild(it_el);
    });
    list.style.position="fixed"; list.style.zIndex="300"; list.style.left="0"; list.style.top="0";
    document.body.appendChild(list); place();
  }
  function place(){
    if(!list) return;
    const r=input.getBoundingClientRect(); const vh=window.innerHeight;
    const below=vh-r.bottom-12, above=r.top-12;
    const h=Math.min(list.scrollHeight, 280, Math.max(below, above));
    list.style.width=r.width+"px"; list.style.left=r.left+"px"; list.style.maxHeight=h+"px";
    if(below>=Math.min(list.scrollHeight,200) || below>=above){ list.style.top=(r.bottom+4)+"px"; }
    else { list.style.top=(r.top-4-h)+"px"; }
  }
  window.addEventListener("resize", place); window.addEventListener("scroll", place, true);
  function choose(i){
    const it=items[i]; if(!it) return; close();
    if(it.type==="recipe") opts.onSelect(it.r); else opts.onCreate(it.text);
  }
  function hl(){ if(list)[...list.children].forEach((c,i)=>c.classList.toggle("active",i===active)); }
  const deb=debounce(build,120);
  input.addEventListener("input",()=>{ if(opts.onText) opts.onText(input.value); deb(); });
  input.addEventListener("focus",build);
  input.addEventListener("keydown",e=>{
    if(!list){ if(e.key==="ArrowDown") build(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(items.length-1,active+1); hl(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0,active-1); hl(); }
    else if(e.key==="Enter" && active>=0){ e.preventDefault(); choose(active); }
    else if(e.key==="Escape"){ close(); }
  });
  document.addEventListener("mousedown",e=>{ if(list && !wrap.contains(e.target) && !list.contains(e.target)) close(); }, true);
  input.addEventListener("blur",()=>setTimeout(close,150));
}

/* ---------------------------------------------------------------------------
   POPOVER generico + STAMPA
--------------------------------------------------------------------------- */
let _pop=null, _popOutside=null, _popOnClose=null;
function closePopover(){
  if(_pop){ _pop.remove(); _pop=null; }
  if(_popOutside){ document.removeEventListener("mousedown",_popOutside,true); _popOutside=null; }
  if(_popOnClose){ const f=_popOnClose; _popOnClose=null; try{ f(); }catch(e){} }
}
function openPopover(anchor, html, onMount, onClose){
  closePopover();
  const pop=document.createElement("div"); pop.className="pop"; pop.innerHTML=html;
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  pop.style.top=(window.scrollY+r.bottom+4)+"px";
  let left=window.scrollX+r.right-pop.offsetWidth; if(left<8) left=8;
  pop.style.left=left+"px";
  _pop=pop; _popOnClose=onClose||null;
  _popOutside=e=>{ if(!pop.contains(e.target) && e.target!==anchor) closePopover(); };
  setTimeout(()=>document.addEventListener("mousedown",_popOutside,true),0);
  if(onMount) onMount(pop, closePopover);
}

function printHTML(title, inner){
  const pa=document.getElementById("print-area");
  pa.innerHTML=`<h1>${escapeHtml(title)}</h1>${inner}`;
  document.body.classList.add("printing");
  const cleanup=()=>{ document.body.classList.remove("printing"); pa.innerHTML=""; window.removeEventListener("afterprint",cleanup); };
  window.addEventListener("afterprint",cleanup);
  window.print();
}
function slotPrintText(slot){
  if(!slot) return "—";
  if(slot.recipeId){ const r=Recipes.byId(slot.recipeId); return (r?r.nome:"(ricetta rimossa)"); }
  if(slot.manualText) return slot.manualText;
  return "—";
}
function printWeek(weekKey, monday, days){

function printDay(weekKey, dateStr){

/* Lista spesa montata in un contenitore (vista Spesa e pannello affiancato).
   mode: "edit" (si riempie) | "shop" (modalità supermercato: riga intera toccabile, spunte grandi) */
function mountShoppingList(container, listId, opts){
  opts=opts||{};
  function draw(){
    const l=Shopping.byId(listId); if(!l){ container.innerHTML=""; return; }
    const mode=opts.mode||(l.status==="shopping"?"shop":"edit");
    const v=Shopping.view(l);
    container.innerHTML="";
    if(!v.items.length){
      container.innerHTML=`<div class="empty-state">${opts.emptyText||"Lista vuota. Aggiungi dal Planner con il tastino 🛒 su un pasto, con “Check lista base” o scrivendo qui sopra."}</div>`;
    } else {
      v.orderedReps.forEach(rep=>{
        const items=v.groups[rep];
        const h=document.createElement("div"); h.className="rep-head"+(mode==="shop"?" sticky":"");
        h.innerHTML=`${escapeHtml(rep)} <span class="rep-count">(${items.filter(i=>!i.done).length}/${items.length})</span>${rep==="Altro"&&v.supermercato?` <span class="text-mute" style="font-weight:500;text-transform:none;letter-spacing:0">· sezione non riconosciuta: tocca la quantità per sceglierla</span>`:""}`;
        container.appendChild(h);
        items.forEach(it=>container.appendChild(row(l, it, mode)));
      });
    }
    if(opts.onDraw) opts.onDraw(v, l);
  }
  function row(l, it, mode){
    const shop=mode==="shop";
    const r=document.createElement("div"); r.className="shop-item"+(it.done?" have-it":"")+(shop?" shop-mode":"")+(opts.compact?" compact":"");
    r.innerHTML=`
      <input type="checkbox" class="si-check" ${it.done?'checked':''} aria-label="${shop?'Comprato':'Preso'}: ${escapeAttr(it.nome)}">
      <div class="si-main">
        <div class="si-name truncate" title="${escapeAttr(it.nome)}">${escapeHtml(it.nome)}</div>
        <div class="si-badge">${escapeHtml(Shopping.provSummary(it))}</div>
      </div>
      <button type="button" class="si-qty-btn${it.manual?' manual':''}" data-qty title="Quantità e confezioni">${it.hasQty?`<span class="si-qty">${escapeHtml(it.qtyText)}</span>`:'<span class="si-qty text-mute">q.tà</span>'}${it.confezioni?`<span class="si-conf">${it.confezioni} conf.</span>`:''}${it.nota?`<span class="si-nota">${escapeHtml(it.nota)}</span>`:''}</button>
      ${(!shop && !it.manual && it.altUnits && it.altUnits.length>1)?`<button class="si-unit-toggle" data-toggle title="Cambia unità (${it.altUnits.join('↔')})" aria-label="Cambia unità">⇄</button>`:''}
      ${!shop?`<button class="btn btn-ghost si-del" data-del aria-label="Rimuovi ${escapeAttr(it.nome)}">✕</button>`:''}`;
    const cb=r.querySelector(".si-check");
    cb.addEventListener("change",()=>{ Shopping.setDone(l.id, it.id, cb.checked); draw(); });
    r.querySelector("[data-qty]").addEventListener("click",e=>{ e.stopPropagation(); openItemQty(l, it, draw); });
    if(shop) r.addEventListener("click",e=>{ if(e.target===cb || e.target.closest("[data-qty]")) return; cb.checked=!cb.checked; cb.dispatchEvent(new Event("change")); });
    const tg=r.querySelector("[data-toggle]");
    if(tg) tg.addEventListener("click",()=>{ const alt=it.altUnits.find(u=>u!==it.unita)||it.unita; Shopping.setUnitPref(l.id, it.id, alt); draw(); });
    const del=r.querySelector("[data-del]");
    if(del) del.addEventListener("click",()=>{ Shopping.removeItem(l.id, it.id); draw(); Toast.show("Voce rimossa"); });
    return r;
  }
  draw();
  return { draw };
}

/* Quantità e confezioni di una voce (es. affettato: 200 g e 2 confezioni) */
function openItemQty(l, it, after){
  const units=Store.get().settings.unitPrefs||["g","kg","ml","L","pz"];
  const cur=it.qtyManual||(it.hasQty?{qty:it.qty, unita:it.unita}:{qty:null, unita:"pz"});
  const sup=Shopping.view(l).supermercato;
  Modal.open({ title:it.nome, bodyHTML:`
      <div class="field-row">
        <div class="field"><label for="iq-qty">Quantità</label><input id="iq-qty" type="number" min="0" step="any" inputmode="decimal" value="${cur.qty!=null?cur.qty:''}" placeholder="es. 200"></div>
        <div class="field"><label for="iq-unit">Unità</label><select id="iq-unit">${units.map(u=>`<option ${u===cur.unita?'selected':''}>${u}</option>`).join("")}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="iq-conf">Confezioni</label><input id="iq-conf" type="number" min="0" step="1" inputmode="numeric" value="${it.confezioni||''}" placeholder="es. 2"></div>
        <div class="field"><label for="iq-nota">Nota</label><input id="iq-nota" type="text" value="${escapeAttr(it.nota||'')}" placeholder="es. a fette sottili"></div>
      </div>
      ${it.sources&&it.sources.some(s=>s.qtyBase!=null)?`<p class="help">Dalle ricette: ${escapeHtml(it.qtyText||'')}. ${it.manual?'<button type="button" class="btn btn-ghost btn-sm" data-reset style="padding:0 6px;min-height:auto">Torna alla quantità delle ricette</button>':''}</p>`:''}
      ${sup?`<div class="field"><label for="iq-sez">Sezione da ${escapeHtml(sup.nome)}</label><select id="iq-sez">${it.sezione==="Altro"?'<option value="" selected>(non riconosciuta: scegli)</option>':''}${sup.sezioni.map(z=>`<option ${z===it.sezione?'selected':''}>${escapeHtml(z)}</option>`).join("")}</select><p class="help">Vale per questa voce anche nelle prossime spese.</p></div>`:''}`,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-ok>Salva</button>`,
    onMount(dialog, close){
      const rs=dialog.querySelector("[data-reset]"); if(rs) rs.addEventListener("click",()=>{ Shopping.setItemQty(l.id, it.id, {qty:null}); close(); after(); });
      dialog.querySelector("[data-ok]").addEventListener("click",()=>{
        const q=parseFloat(String(dialog.querySelector("#iq-qty").value).replace(",","."));
        const c=parseInt(dialog.querySelector("#iq-conf").value,10);
        Shopping.setItemQty(l.id, it.id, { qty:isNaN(q)?null:q, unita:dialog.querySelector("#iq-unit").value, confezioni:isNaN(c)?null:c, nota:dialog.querySelector("#iq-nota").value.trim() });
        const sz=dialog.querySelector("#iq-sez"); if(sz && sup && sz.value && sz.value!==it.sezione) Supermercati.setOverride(sup.id, it.nome, sz.value);
        close(); after();
      });
    }});
}

/* Check lista base: finestra scorrevole con tutte le voci base per reparto; le voci già in lista sono spuntate */
function openBaseCheck(onDone){
  const st=Shopping.baseStatus();
  if(!st.length){ Toast.show("Lista base vuota: importa lista_base_spesa.txt dalle Impostazioni","warn"); return; }
  const order=Store.get().settings.departments||[]; const groups={};
  st.forEach(f=>{ (groups[f.reparto]=groups[f.reparto]||[]).push(f); });
  const reps=[...order.filter(r=>groups[r]), ...Object.keys(groups).filter(r=>!order.includes(r)).sort()];
  const l=Shopping.active();
  const body=`
    <p class="text-sm text-mute mb-2">${l?`Lista attiva: <strong>${escapeHtml(l.name)}</strong>.`:"Non c'è una lista attiva: confermando ne viene creata una."} Spunta ciò che ti serve; le voci già in lista sono già spuntate. Nella casella a destra puoi scrivere la quantità: <code>2</code>, <code>500 g</code>, <code>3 conf</code>, anche <code>200 g 2 conf</code>.</p>
    <div class="flex gap-2 mb-2"><button class="btn btn-sm" data-all>Tutte</button><button class="btn btn-sm" data-none>Nessuna</button><span class="text-xs text-mute" style="align-self:center" id="bc-count"></span></div>
    <div class="base-check">
      ${reps.map(rep=>`<div class="rep-head sticky">${escapeHtml(rep)}</div>`+groups[rep].map(f=>`
        <label class="bc-row ${f.locked?'locked':''}">
          <input type="checkbox" data-name="${escapeAttr(f.nome)}" ${f.inList?'checked':''} ${f.locked?'disabled':''}>
          <span class="bc-name">${escapeHtml(f.nome)}</span>
          ${f.locked?`<span class="chip chip-accent">da ricetta</span>`:''}
          <input type="text" class="bc-qty" data-qty-for="${escapeAttr(f.nome)}" data-initial="${escapeAttr(f.cur)}" value="${escapeAttr(f.cur)}" placeholder="${f.qty!=null?escapeAttr(Shopping.fmtQty(f.qty)+' '+f.unita):'q.tà / conf'}" aria-label="Quantità per ${escapeAttr(f.nome)}" inputmode="text">
        </label>`).join("")).join("")}
    </div>`;
  Modal.open({ title:"Check lista base", size:"lg", bodyHTML:body,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-ok>Aggiorna la lista</button>`,
    onMount(dialog, close){
      const boxes=[...dialog.querySelectorAll("[data-name]")];
      const count=()=>{ dialog.querySelector("#bc-count").textContent=boxes.filter(b=>b.checked).length+" selezionate"; };
      boxes.forEach(b=>b.addEventListener("change",count)); count();
      dialog.querySelector("[data-all]").addEventListener("click",()=>{ boxes.forEach(b=>{ if(!b.disabled) b.checked=true; }); count(); });
      dialog.querySelector("[data-none]").addEventListener("click",()=>{ boxes.forEach(b=>{ if(!b.disabled) b.checked=false; }); count(); });
      // scrivere una quantità spunta la voce da sola
      dialog.querySelectorAll(".bc-qty").forEach(inp=>{ inp.addEventListener("click",e=>e.preventDefault()); inp.addEventListener("input",()=>{ const cb=boxes.find(b=>b.dataset.name===inp.dataset.qtyFor); if(cb && !cb.disabled && inp.value.trim()){ cb.checked=true; count(); } }); });
      dialog.querySelector("[data-ok]").addEventListener("click",()=>{

        close(); Toast.show(`Lista base: ${r.added} aggiunte${r.removed?`, ${r.removed} tolte`:""}`,"ok");

/* ---------------------------------------------------------------------------
   VISTA: Checklist (To-Do / Scadenze / Ricorrenze) + Countdown
--------------------------------------------------------------------------- */
let checklistTab="todo";
let todoFilter="tutte";
let icsSelection=new Set();

/* Countdown: differenza in giorni → etichetta + livello cromatico */
function countdown(dateObj){
  const diff=DateUtils.diffDays(DateUtils.today(), dateObj);
  const soglia=Store.get().settings.urgencyDays||7;
  let label, level;
  if(diff<0){ label=`Scaduto da ${-diff} g`; level="red"; }
  else if(diff===0){ label="Oggi"; level="red"; }
  else if(diff===1){ label="Domani"; level="orange"; }
  else { label=`Tra ${diff} g`; level = diff<3?"orange":(diff<=soglia?"yellow":"green"); }
  return { diff, label, level };
}

function renderChecklist(){
  const el=document.createElement("div"); el.className="view";
  el.innerHTML=`
    <div class="view-head">
      <h1>Impegni</h1>
      <div class="seg" role="tablist" aria-label="Sezioni impegni">
        <button role="tab" data-tab="todo" aria-selected="${checklistTab==='todo'}">📋 Agenda</button>
        <button role="tab" data-tab="scadenze" aria-selected="${checklistTab==='scadenze'}">⏰ Scadenze</button>
        <button role="tab" data-tab="ricorrenze" aria-selected="${checklistTab==='ricorrenze'}">🎂 Ricorrenze</button>
      </div>
    </div>
    <div id="cl-body"></div>`;
  el.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ checklistTab=b.dataset.tab; icsSelection.clear(); Router.go("checklist"); }));
  const body=el.querySelector("#cl-body");
  if(checklistTab==="todo") renderTodoTab(body);
  else if(checklistTab==="scadenze") renderEventTab(body, "scadenze");
  else renderEventTab(body, "ricorrenze");
  return el;
}

/* ---- To-Do ---- */
function renderTodoTab(body){
  const labels={oggi:"Oggi", settimana:"Settimana", tutte:"Tutte"};
  body.innerHTML=`
    <div class="filterbar">
      <div class="seg" role="group" aria-label="Filtro to-do">
        ${["oggi","settimana","tutte"].map(f=>`<button data-f="${f}" aria-pressed="${todoFilter===f}">${labels[f]}</button>`).join("")}
      </div>
      <div class="flex gap-2" style="margin-left:auto">
        <button class="btn btn-sm" id="ev-new2">+ Impegno</button>
        <button class="btn btn-primary btn-sm" id="td-new">+ To-do</button>
      </div>
    </div>
    <p class="help mb-2">To-do e impegni insieme, in ordine di data e ora. Riunioni e appuntamenti con il loro orario; i to-do con l'ora se ce l'hanno.</p>
    <div id="td-list"></div>`;
  body.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{ todoFilter=b.dataset.f; renderTodoTab(body); }));
  body.querySelector("#td-new").addEventListener("click",()=>openTodoEditor(null));
  body.querySelector("#ev-new2").addEventListener("click",()=>openEventEditor(null,"RIUNIONE"));

  const list=body.querySelector("#td-list");
  const t=DateUtils.today();
  const horizon = todoFilter==="oggi"?0 : todoFilter==="settimana"?6 : 60;
  // to-do
  let items=Todos.all().map(td=>({kind:"todo", td, date:td.data||null, ora:td.ora||"", done:!!td.done}));
  if(todoFilter!=="tutte") items=items.filter(x=>x.date && DateUtils.diffDays(t,x.date)<=horizon);
  // impegni con data (riunioni, appuntamenti, eventi, scadenze…) nello stesso orizzonte; ricorrenze alla prossima occorrenza
  Events.all().forEach(e=>{
    const d=e.date?DateUtils.parseYmd(e.date):Calendar.nextOccurrence(e); if(!d) return;
    const diff=DateUtils.diffDays(t,d);
    if(diff<0 && todoFilter!=="tutte") return;
    if(diff>horizon) return;
    items.push({kind:"event", e, date:DateUtils.ymd(d), ora:e.ora||"", done:false});
  });
  items.sort((a,b)=>(a.done-b.done) || (dateSort(a.date)-dateSort(b.date)) || ((a.ora||"99")<(b.ora||"99")?-1:(a.ora||"99")>(b.ora||"99")?1:0));
  if(!items.length){ list.innerHTML=`<div class="empty-state">Niente in agenda${todoFilter!=='tutte'?' in questo periodo':''}.</div>`; return; }
  list.innerHTML="";
  let lastDay=null;
  items.forEach(x=>{
    if(x.date!==lastDay){ lastDay=x.date; const h=document.createElement("div"); h.className="ag-dayhead"; h.textContent=x.date?`${dayName(DateUtils.parseYmd(x.date))} ${DateUtils.fmtLong(DateUtils.parseYmd(x.date))}`:"Senza data"; list.appendChild(h); }
    list.appendChild(x.kind==="todo"?todoRow(x.td):eventRow(x.e, DateUtils.parseYmd(x.date), true));
  });
}
function dateSort(d){ return d?DateUtils.parseYmd(d).getTime():8.64e15; }
function prioRank(p){ return {alta:3, media:2, bassa:1}[p]||0; }

function todoRow(td){
  const row=document.createElement("div"); row.className="cl-item"+(td.done?" done":"");
  let cdHtml="";
  if(td.data){ const c=countdown(DateUtils.parseYmd(td.data)); cdHtml=`<span class="cd ${c.level}">${c.label}</span>`; }
  row.innerHTML=`
    <input type="checkbox" class="cl-check" ${td.done?'checked':''} aria-label="Completato: ${escapeAttr(td.titolo)}">
    <div class="cl-main">
      <div class="cl-title truncate" title="${escapeAttr(td.titolo)}">${oraFmt(td.ora)}${chiChipHTML(td.chi,true)} ${escapeHtml(td.titolo)}</div>
      <div class="cl-meta">
        <span class="evt-type">to-do</span>
        ${td.prio?`<span class="prio ${td.prio}">${escapeHtml(td.prio)}</span>`:''}
        ${cdHtml}
        ${td.data?`<span>${DateUtils.fmtLong(DateUtils.parseYmd(td.data))}</span>`:''}
        ${td.note?`<span>· ${escapeHtml(td.note)}</span>`:''}

    <div class="cl-actions">
      ${td.data?`<button data-snooze aria-label="Rinvia">💤</button>`:''}
      <button data-edit aria-label="Modifica">✏️</button>
      <button data-del aria-label="Elimina">🗑️</button>
    </div>`;
  row.querySelector(".cl-check").addEventListener("change",e=>{ Todos.update(td.id,{done:e.target.checked}); Router.go("checklist"); });
  const sn=row.querySelector("[data-snooze]"); if(sn) sn.addEventListener("click",()=>openSnooze(sn,"todo",td.id));
  row.querySelector("[data-edit]").addEventListener("click",()=>openTodoEditor(td));
  row.querySelector("[data-del]").addEventListener("click",async()=>{
    if(await Modal.confirm({title:"Elimina to-do", message:`Eliminare "${td.titolo}"?`, confirmLabel:"Elimina", danger:true})){ Todos.remove(td.id); Router.go("checklist"); }
  });
  return row;

/* ---- Scadenze & Ricorrenze (eventi) ---- */
function renderEventTab(body, which){

  });
  return row;

      </div>
      <p class="help" style="margin-top:-8px">Es. ospiti a cena: +2 e “Solo cena”. Qualcuno mangia fuori a pranzo: −1 e “Solo pranzo”. Cambia le persone a tavola e le porzioni della spesa.</p>
      <div class="field-row">
        <div class="field"><label for="ee-ente">Ente (opz.)</label><input id="ee-ente" type="text" value="${escapeAttr(v.ente||'')}"></div>
        <div class="field"><label for="ee-imp">Importo € (opz.)</label><input id="ee-imp" type="number" step="any" value="${v.importo!=null&&v.importo!==''?v.importo:''}"></div>
      </div>
      <div class="field"><label for="ee-note">Note</label><textarea id="ee-note" rows="2">${escapeHtml(v.note||'')}</textarea></div>
      <p id="ee-err" class="help" style="color:var(--danger)" role="alert"></p>`,
    footHTML:`${isNew?"":'<button class="btn btn-danger" data-del style="margin-right:auto">Elimina</button>'}<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-save>Salva</button>`,
    onMount(dialog, close){
      const getChi=wireChiPicker(dialog,"ee-chi");
      const refreshList=(dateStr)=>{ if(!dateStr) return; const wk=DateUtils.isoWeekKey(DateUtils.parseYmd(dateStr)); let n=0; ["pranzo","cena"].forEach(w=>{ if(Shopping.mealInList(dateStr,w)){ Shopping.addMeal(wk, dateStr, w); n++; } }); if(n) Toast.show("Lista della spesa aggiornata","ok"); };
      const done=(dateStr)=>{ close(); Toast.show("Salvato","ok"); refreshList(dateStr); if(opts.onSaved) opts.onSaved(); else Router.go("checklist"); };
      const del=dialog.querySelector("[data-del]");
      if(del) del.addEventListener("click", async ()=>{
        const ok=await Modal.confirm({title:"Elimina impegno", message:`Eliminare “${ev.titolo}”?`, confirmLabel:"Elimina", danger:true});
        if(ok){ const d=ev.date||null; Events.remove(ev.id); close(); Toast.show("Eliminato"); refreshList(d); if(opts.onSaved) opts.onSaved(); else Router.go("checklist"); }
      });
      dialog.querySelector("[data-save]").addEventListener("click",()=>{
        const tit=dialog.querySelector("#ee-tit").value.trim();
        const type=dialog.querySelector("#ee-type").value;
        const data=dialog.querySelector("#ee-data").value;
        const err=dialog.querySelector("#ee-err");
        if(!tit){ err.textContent="Il titolo è obbligatorio."; return; }
        if(!data){ err.textContent="La data è obbligatoria."; return; }
        const imp=dialog.querySelector("#ee-imp").value;
        const dp=parseInt(dialog.querySelector("#ee-delta").value,10);
        const patch={ titolo:tit, type, note:dialog.querySelector("#ee-note").value.trim(),
          ente:dialog.querySelector("#ee-ente").value.trim()||undefined,
          importo: imp!==""?parseFloat(imp):undefined,
          remind:dialog.querySelector("#ee-remind").value||undefined,
          ora:dialog.querySelector("#ee-ora").value||undefined,
          durata:parseInt(dialog.querySelector("#ee-durata").value,10)||undefined,
          chi:getChi(),
          deltaPersone: (isNaN(dp)||dp===0)?undefined:Math.max(-20,Math.min(20,dp)),
          pasto: dialog.querySelector("#ee-pasto").value };
        if(type==="COMPLEANNO"||type==="ANNIVERSARIO"){
          const d=DateUtils.parseYmd(data);
          patch.rrule={freq:"ANNUALE", day:`${DateUtils.pad(d.getMonth()+1)}-${DateUtils.pad(d.getDate())}`};
          patch.date=null;
        } else { patch.date=data; patch.rrule=undefined; }
        if(isNew) Events.add(patch); else Events.update(ev.id, patch);
        done(patch.date||null);
      });
    }});
}

/* Esporta eventi selezionati (o tutti visibili) in .ics */
function exportICS(ids){
  let evs = ids.length ? Events.all().filter(e=>ids.includes(e.id)) : [];
  if(!evs.length){ Toast.show("Seleziona almeno un evento (casella a sinistra)","warn"); return; }
  downloadFile("eventi.ics", buildICS(evs), "text/calendar");
  Toast.show(`${evs.length} eventi esportati (.ics)`,"ok");
}
function buildICS(events){
  const dt=d=>`${d.getFullYear()}${DateUtils.pad(d.getMonth()+1)}${DateUtils.pad(d.getDate())}`;
  const esc=s=>String(s||"").replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  let out="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Planner Weekly//IT\r\nCALSCALE:GREGORIAN\r\n";
  events.forEach(e=>{
    const d=e.date?DateUtils.parseYmd(e.date):Calendar.nextOccurrence(e); if(!d) return;
    out+="BEGIN:VEVENT\r\n";
    out+=`UID:${e.id}@planner-weekly\r\n`;
    if(e.ora){ const [hh,mm]=e.ora.split(":"); out+=`DTSTART:${dt(d)}T${hh}${mm}00\r\n`; if(e.durata){ const end=new Date(d.getTime()); end.setHours(parseInt(hh,10), parseInt(mm,10)+e.durata); out+=`DTEND:${dt(end)}T${DateUtils.pad(end.getHours())}${DateUtils.pad(end.getMinutes())}00\r\n`; } }
    else out+=`DTSTART;VALUE=DATE:${dt(d)}\r\n`;
    out+=`SUMMARY:${esc(e.titolo)}\r\n`;
    if(e.note) out+=`DESCRIPTION:${esc(e.note)}\r\n`;
    if(e.rrule){ const fr={ANNUALE:"YEARLY",MENSILE:"MONTHLY",SETTIMANALE:"WEEKLY"}[e.rrule.freq]; if(fr) out+=`RRULE:FREQ=${fr}\r\n`; }
    out+="END:VEVENT\r\n";
  });
  return out+"END:VCALENDAR\r\n";
}

/* Promemoria all'avvio: toast (+ Notification API se attiva) per le voci di oggi */
function checkReminders(){
  const s=Store.get().settings, t=DateUtils.today(), due=[];
  Todos.all().forEach(td=>{ if(!td.done && td.data && DateUtils.diffDays(t,td.data)<=0) due.push({kind:"To-Do", title:td.titolo}); });
  Events.byType(["SCADENZA","EVENTO","FESTA","COMPLEANNO","ANNIVERSARIO"]).forEach(e=>{
    const d=e.date?DateUtils.parseYmd(e.date):Calendar.nextOccurrence(e);
    if(d && DateUtils.diffDays(t,d)===0) due.push({kind:e.type, title:e.titolo});
  });
  if(!due.length) return;
  Toast.show(`${due.length} promemoria per oggi — controlla la Checklist`, "warn", 5000);
  if(s.notificationsEnabled && "Notification" in window && Notification.permission==="granted"){
    due.slice(0,3).forEach(d=>{ try{ new Notification("Planner Weekly", {body:`${d.kind}: ${d.title}`}); }catch(err){} });
  }
}

function runTxtImport(kind){

function openImportPreview(kind, res){
  let itemsHtml="", count=0;
  const rowChk=(id,label,sub)=>`<li><label class="ing-have" style="flex:1;color:var(--text)"><input type="checkbox" data-inc="${id}" checked> <span>${label}</span></label>${sub?`<span class="text-mute text-xs">${escapeHtml(sub)}</span>`:""}</li>`;

  if(kind==="calendario"){
    const list=[];
    res.events.forEach((e,i)=>list.push({t:"event", i, label:`<strong>${escapeHtml(e.type)}</strong> · ${escapeHtml(e.titolo)}`, sub:e.date||(e.rrule?("↻ "+e.rrule.freq+" "+e.rrule.day):"")}));
    res.todos.forEach((t,i)=>list.push({t:"todo", i, label:`<strong>TODO</strong> · ${escapeHtml(t.titolo)}`, sub:t.data||""}));
    res._list=list; count=list.length;
    itemsHtml=list.map((x,idx)=>rowChk(idx, x.label, x.sub)).join("");
  } else if(kind==="ricette"){
    count=res.recipes.length;
    itemsHtml=res.recipes.map((r,i)=>rowChk(i, escapeHtml(r.nome||"(senza nome)"), (r.ingredienti||[]).length+" ingr.")).join("");
  } else if(kind==="todo"){
    count=res.todos.length;
    itemsHtml=res.todos.map((t,i)=>rowChk(i, escapeHtml(t.titolo), t.data||"")).join("");
  } else if(kind==="listabase"){
    count=res.items.length;
    itemsHtml=res.items.map((it,i)=>rowChk(i, escapeHtml(it.nome), `${it.reparto}${it.qty!=null?` · ${Shopping.fmtQty(it.qty)} ${it.unita}`:""}`)).join("");
  } else {
    count=res.applied.length;
    itemsHtml=res.applied.map(a=>`<li><span>${escapeHtml(a.key)}</span><span class="text-mute">${escapeHtml(a.value)}</span></li>`).join("");
  }
  const errs=res.errors||[];
  Modal.open({ title:`Anteprima import · ${kind}.txt`, size:"lg", bodyHTML:`
    <p class="mb-2"><strong>${count}</strong> voci valide${errs.length?` · <span style="color:var(--danger)">${errs.length} righe con errori</span>`:""}</p>
    ${kind!=="impostazioni"&&count?`<p class="help mb-2">Deseleziona le voci che non vuoi importare.</p>`:""}
    <ul class="ing-list" style="max-height:300px;overflow:auto">${itemsHtml||'<li class="text-mute">Nessuna voce valida trovata</li>'}</ul>
    ${errs.length?`<details class="mt-3"><summary style="color:var(--danger);cursor:pointer">Righe con errori (${errs.length}) — verranno ignorate</summary>
      <ul class="text-xs text-mute" style="padding-left:1.2em;margin-top:6px">${errs.map(e=>`<li>Riga ${e.line}: ${escapeHtml(e.msg)}<br><code>${escapeHtml(e.raw)}</code></li>`).join("")}</ul></details>`:""}`,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-apply ${count?'':'disabled'}>Importa</button>`,
    onMount(dialog, close){
      const applyBtn=dialog.querySelector("[data-apply]");
      if(applyBtn) applyBtn.addEventListener("click",()=>{
        const inc=id=>{ const cb=dialog.querySelector(`[data-inc="${id}"]`); return !cb || cb.checked; };
        applyImport(kind, res, inc); close();
      });
    }});
}

function applyImport(kind, res, inc){
  if(kind==="calendario"){
    let n=0;
    res._list.forEach((x,idx)=>{ if(!inc(idx)) return; if(x.t==="event") Events.add(res.events[x.i]); else Todos.add(res.todos[x.i]); n++; });
    Toast.show(`${n} voci di calendario importate`,"ok");
  } else if(kind==="ricette"){
    let n=0; Store.update(db=>res.recipes.forEach((r,i)=>{ if(inc(i)){ db.recipes.push({...r, id:r.id||Recipes.genId(), useCount:0}); n++; } }));
    Toast.show(`${n} ricette importate`,"ok");
  } else if(kind==="todo"){
    let n=0; res.todos.forEach((t,i)=>{ if(inc(i)){ Todos.add(t); n++; } });
    Toast.show(`${n} to-do importati`,"ok");
  } else if(kind==="listabase"){
    let n=0;
    Store.update(db=>{
      const favs=db.settings.favorites=db.settings.favorites||[];
      const deps=db.settings.departments=db.settings.departments||[];
      res.items.forEach((it,i)=>{
        if(!inc(i)) return;
        const k=it.nome.trim().toLowerCase();
        const idx=favs.findIndex(f=>f.nome.trim().toLowerCase()===k);
        const rec={nome:it.nome, qty:(it.qty!=null?it.qty:null), unita:it.unita||"pz", reparto:it.reparto};
        if(idx>=0) favs[idx]=rec; else favs.push(rec);
        if(it.reparto && !deps.includes(it.reparto)) deps.push(it.reparto);
        n++;
      });
    });
    Toast.show(`${n} voci della lista base importate`,"ok");
  } else {
    Store.update(db=>Object.assign(db.settings, res.patch)); Theme.apply();
    Toast.show(`${res.applied.length} impostazioni applicate`,"ok");
  }
  Router.go("impostazioni");
}

/* ---------------------------------------------------------------------------
   BACKUP & RIPRISTINO — export .json (BOM UTF-8) + import Sostituisci/Unisci
--------------------------------------------------------------------------- */
async function doExportBackup(){
  try{
    const json=await Backup.exportJSON();
    const p=DateUtils.pad, now=new Date();
    const name=`planner-backup-${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}-${p(now.getHours())}${p(now.getMinutes())}.json`;
    downloadFile(name, "﻿"+json, "application/json");   // BOM UTF-8
    Toast.show("Backup esportato","ok");
  }catch(e){ console.error(e); Toast.show("Esportazione non riuscita","err"); }
}

function doImportBackup(){
  pickFile(".json,application/json", async (txt)=>{
    let obj;
    try{ obj=JSON.parse(txt.replace(/^﻿/,"")); }
    catch(e){ Toast.show("File non valido (JSON non leggibile)","err"); return; }
    const errs=Backup.validate(obj);
    if(errs.length){
      Modal.open({ title:"File di backup non valido",
        bodyHTML:`<ul class="text-sm" style="padding-left:1.2em">${errs.map(e=>`<li>${escapeHtml(e)}</li>`).join("")}</ul>`,
        footHTML:`<button class="btn" data-close>Chiudi</button>` });
      return;
    }
    const chk=await Backup.verify(obj);
    openRestoreModal(obj, chk);
  });
}

function openRestoreModal(obj, chk){
  const counts=`${(obj.recipes||[]).length} ricette · ${(obj.calendarEvents||[]).length} eventi · ${(obj.todos||[]).length} to-do · ${Object.keys(obj.planByWeek||{}).length} settimane`;
  const chkNote = chk.checked
    ? (chk.ok ? `<span class="chip chip-accent">✓ Checksum verificato</span>` : `<span class="chip" style="color:var(--danger);border-color:var(--danger)">⚠️ Checksum NON corrisponde</span>`)
    : `<span class="chip">Nessun checksum</span>`;
  const verNote = (obj.version!==Store.SCHEMA_VERSION) ? `<span class="chip" style="color:var(--warn)">⚠️ Versione ${escapeHtml(String(obj.version))} ≠ app ${Store.SCHEMA_VERSION} · import best-effort</span>` : "";
  Modal.open({ title:"Ripristina backup",
    bodyHTML:`
      <p class="text-sm text-mute mb-1">Creato: ${obj.createdAt?escapeHtml(new Date(obj.createdAt).toLocaleString("it-IT")):"—"}</p>
      <p class="mb-2">${counts}</p>
      <div class="flex gap-2 flex-wrap mb-3">${chkNote} ${verNote}</div>
      <p class="text-sm mb-0"><strong>Sostituisci</strong>: cancella tutto e ripristina dal backup.<br>
      <strong>Unisci</strong>: aggiunge senza duplicati e mantiene i dati locali in caso di conflitto (log in console).</p>`,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn" data-merge>Unisci</button><button class="btn btn-danger" data-replace>Sostituisci tutto</button>`,
    onMount(dialog, close){
      dialog.querySelector("[data-merge]").addEventListener("click",()=>{
        const log=Backup.merge(obj); close(); Theme.apply();
        Toast.show("Backup unito"+(log.length?` · ${log.length} conflitti (console)`:""),"ok");
        Router.go("impostazioni");
      });
      dialog.querySelector("[data-replace]").addEventListener("click", async ()=>{
        if(chk.checked && !chk.ok){
          if(!await Modal.confirm({title:"Checksum non valido", message:"L'integrità del file non è confermata. Ripristinare comunque?", confirmLabel:"Ripristina comunque", danger:true})) return;
        }
        if(!await Modal.confirm({title:"Sostituisci tutto", message:"Tutti i dati attuali verranno sovrascritti in modo irreversibile. Continuare?", confirmLabel:"Sostituisci", danger:true})) return;
        Backup.replaceAll(obj); close(); Theme.apply();
        Toast.show("Dati ripristinati dal backup","ok"); Router.go("impostazioni");
      });
    }});
}

/* ---------------------------------------------------------------------------
   Helpers vari
--------------------------------------------------------------------------- */
function setSetting(key, val){ Store.update(db=>{ db.settings[key]=val; }); }
function clampInt(v,min,max,def){ v=parseInt(v,10); if(isNaN(v)) return def; return Math.max(min,Math.min(max,v)); }
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }
/* Download di un file generato in memoria (Blob) */
function downloadFile(filename, content, mime){
  const blob=new Blob([content], {type:(mime||"text/plain")+";charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}
/* Selettore file locale → callback(testo, nomeFile) */
function pickFile(accept, cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>cb(String(rd.result), f.name);
    rd.onerror=()=>Toast.show("Impossibile leggere il file","err");
    rd.readAsText(f);
  });
  inp.click();
}
function accentHex(c){ return {teal:"#0d9488",blue:"#2563eb",coral:"#e2574c",violet:"#7c3aed",amber:"#d97706"}[c]||"#0d9488"; }

async function requestNotifPermission(){
  if(!("Notification" in window)){ Toast.show("Notifiche di sistema non supportate dal browser","warn"); return false; }
  try{
    const p = await Notification.requestPermission();
    if(p==="granted"){ Toast.show("Notifiche attivate","ok"); return true; }
    Toast.show("Permesso notifiche negato","warn"); return false;
  }catch(e){ return false; }
}

function escapeHtml(str){ return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------------------------------------------------------------------
   BOOT
--------------------------------------------------------------------------- */
/* ---------------------------------------------------------------------------
   MODULO: Pwa — installazione su schermata Home, offline, memoria persistente
   - Registra sw.js (solo su https o localhost: da file:// non è permesso)
   - Chiede al browser di rendere la memoria "persistente" (non cancellabile
     dalle pulizie automatiche). Le web app da schermata Home su iPadOS hanno
     una memoria separata da Safari: il reset del browser non le tocca.
   - Mostra un suggerimento di installazione una sola volta su iPad/iPhone.
--------------------------------------------------------------------------- */
const APP_VERSION = "2026-10-12.4";
const Pwa = (function(){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const standalone = window.navigator.standalone===true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  const canSW = "serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1");
  let reg=null, waiting=null, persisted=null;

  async function init(){
    if(canSW){
      try{
        reg = await navigator.serviceWorker.register("sw.js");
        if(reg.waiting) onWaiting(reg.waiting);
        reg.addEventListener("updatefound", ()=>{
          const nw=reg.installing; if(!nw) return;
          nw.addEventListener("statechange", ()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller) onWaiting(nw); });
        });
        let reloading=false;
        navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(reloading) return; reloading=true; location.reload(); });
      }catch(e){ console.warn("Service worker non registrato:", e); }
    }
    try{ if(navigator.storage && navigator.storage.persist){ persisted = await navigator.storage.persist(); } }catch(e){}
    maybeHint();
    refreshStatus();
  }
  function onWaiting(sw){
    waiting=sw;
    // si applica da sola: ricarica appena l'utente non sta scrivendo in un campo
    const go=()=>{ if(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ setTimeout(go, 3000); return; } Toast.show("Aggiornamento alla nuova versione…", "ok", 1500); setTimeout(()=>sw.postMessage("skipWaiting"), 800); };
    setTimeout(go, 1200);
  }
  function applyUpdate(){ if(waiting) waiting.postMessage("skipWaiting"); else if(reg) reg.update(); }

  const isAndroid=/Android/i.test(navigator.userAgent);
  function maybeHint(){
    if((!isIOS && !isAndroid) || standalone) return;
    if(localStorage.getItem("pw-install-hint")) return;
    localStorage.setItem("pw-install-hint","1");
    setTimeout(()=>Modal.open({ title:isAndroid?"Installa sul telefono":"Installa sull'iPad / iPhone", bodyHTML: isAndroid ? `
      <p>Per avere il Planner come <strong>app con icona</strong>, a tutto schermo:</p>
      <ol style="padding-left:1.2em;line-height:1.7">
        <li>In Chrome tocca il menu <strong>⋮</strong> in alto a destra.</li>
        <li>Scegli <strong>“Installa app”</strong> oppure <strong>“Aggiungi a schermata Home”</strong>.</li>
        <li>Conferma, poi apri il Planner dall'icona.</li>
      </ol>` : `
      <p>Per avere il Planner come <strong>app con icona</strong>, a tutto schermo e con i dati al sicuro anche se svuoti Safari:</p>
      <ol style="padding-left:1.2em;line-height:1.7">
        <li>Tocca il pulsante <strong>Condividi</strong> di Safari (il quadrato con la freccia).</li>
        <li>Scorri e scegli <strong>“Aggiungi alla schermata Home”</strong>.</li>
        <li>Conferma con <strong>Aggiungi</strong>, poi apri il Planner dall'icona.</li>
      </ol>
      <p class="help">Da lì in poi usa sempre l'icona: i dati dell'app restano separati da quelli di Safari.</p>`,
      footHTML:`<button class="btn btn-primary" data-close>Ho capito</button>` }), 1500);
  }

  function statusText(){
    if(standalone) return {chip:"✅ Installata come app", help:"Stai usando il Planner dall'icona sulla schermata Home. I dati stanno nella memoria dell'app, separata da Safari: svuotare cronologia e dati dei siti non li tocca. Spariscono solo se elimini l'icona, quindi fai ogni tanto un backup qui sotto."};
    if(location.protocol==="file:") return {chip:"📄 Aperta da file", help:"Per installarla sull'iPad la pagina deve stare su un indirizzo web (https). Vedi il file LEGGIMI-iPad.md nella cartella del progetto."};
    if(isIOS) return {chip:"🌐 Aperta in Safari", help:"Tocca Condividi → “Aggiungi alla schermata Home” per installarla. Fino ad allora i dati stanno in Safari e un reset del browser li cancella."};
    if(isAndroid) return {chip:"🌐 Aperta nel browser", help:"In Chrome: menu ⋮ → “Installa app” (o “Aggiungi a schermata Home”). Da installata ha la sua icona e funziona offline."};
    return {chip:"🌐 Aperta nel browser", help:"Su iPad/iPhone: apri questo indirizzo in Safari e usa Condividi → “Aggiungi alla schermata Home”. Su Mac/PC il browser può offrire “Installa app” nella barra dell'indirizzo."};
  }
  async function refreshStatus(root){
    const q=(id)=>(root||document).querySelector("#"+id);
    const st=q("pwa-status"), hp=q("pwa-help"), sg=q("pwa-storage"), b=q("pwa-update");
    if(!st) return;
    const t=statusText(); st.textContent=t.chip; hp.textContent=t.help;
    if(b) b.hidden=!waiting;
    try{
      if(navigator.storage && navigator.storage.estimate){
        const e=await navigator.storage.estimate();
        const used=Math.round((e.usage||0)/1024);
        sg.textContent=`Spazio usato: ${used<1024?used+" KB":(used/1024).toFixed(1)+" MB"}${persisted===true?" · memoria persistente":""}`;
        sg.hidden=false;
      }
    }catch(e){}
  }
  async function hardReload(){
    Toast.show("Ricarico l'app dal sito…","ok",2000);
    try{ const regs=await navigator.serviceWorker.getRegistrations(); for(const r of regs) await r.unregister(); }catch(e){}
    try{ const keys=await caches.keys(); for(const k of keys) await caches.delete(k); }catch(e){}
    setTimeout(()=>{ location.href=location.pathname+"?r="+Date.now(); }, 600);
  }
  function renderSettings(el){
    refreshStatus(el);
    const b=el.querySelector("#pwa-reload"); if(b) b.addEventListener("click", hardReload);
  }
  return { init, renderSettings, isIOS, standalone };
})();

function boot(){
  Theme.apply();

  // registra viste
  Router.register("cover", renderCover);
  Router.register("impostazioni", renderSettings);
  Router.register("planner", renderPlanner);
  Router.register("ricette", renderRecipes);
  Router.register("spesa", renderShopping);
  Router.register("checklist", renderChecklist);

  // navigazione (header + tabbar)
  document.querySelectorAll("[data-nav]").forEach(b=>{
    b.addEventListener("click", ()=>Router.go(b.getAttribute("data-nav")));
  });

  // scorciatoie tastiera globali
  document.addEventListener("keydown", e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const tag = (e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable) return;
    const map = {g:"planner", r:"ricette", s:"spesa", t:"checklist"};
    const k = e.key.toLowerCase();
    if(map[k]){ e.preventDefault(); Router.go(map[k]); }
  });

  // prima vista: cover se non ancora "onboarded", altrimenti planner
  const s = Store.get().settings;
  Router.go(s.onboarded ? "planner" : "cover");
  // segna onboarded appena l'utente entra nel planner la prima volta
  if(!s.onboarded) setSetting("onboarded", true);

  // promemoria di oggi (toast + eventuali notifiche di sistema)
  setTimeout(checkReminders, 600);

  // web app installabile: service worker, memoria persistente, suggerimento iPad
  Pwa.init();
  const fv=document.getElementById("ft-ver"); if(fv) fv.textContent="v. "+APP_VERSION;
  // telefono ↔ tablet: al cambio di larghezza il planner si ridisegna con la disposizione giusta
  if(window.matchMedia){ const mq=window.matchMedia("(max-width: 700px)"); const onChange=()=>{ if(Router.currentName()==="planner") Router.go("planner"); }; if(mq.addEventListener) mq.addEventListener("change", onChange); else if(mq.addListener) mq.addListener(onChange); }

  // identità dispositivo + avvio sincronizzazione se configurata
  if(!Store.get().settings.deviceId) setSetting("deviceId", "dev-"+Math.random().toString(36).slice(2,10));
  if(Store.get().settings.sync && Store.get().settings.sync.enabled) setTimeout(()=>Sync.startAuto(), 400);
}

return { boot, Store, Toast, Modal, Router, Theme, Demo, applyImport, IngKey, Supermercati, Reparti,
  Parse, Backup, Sync, Shopping, Recipes, Events, Todos, Calendar, DateUtils, Plan };
})();

document.addEventListener("DOMContentLoaded", App.boot);
</script>
