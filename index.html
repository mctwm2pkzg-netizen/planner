:root[data-style="pastello"] .chip{ border-color:transparent; background:var(--surface-2); font-weight:800; }
:root[data-style="pastello"] .top-nav{ background:var(--surface-2); border:none; border-radius:999px; }
:root[data-style="pastello"] .top-nav button{ border-radius:999px; }
:root[data-style="pastello"] .top-nav button[aria-current="page"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }
:root[data-style="pastello"] .app-header{ border-bottom:none; box-shadow:0 2px 12px rgba(42,51,64,.05); }
:root[data-style="pastello"] .tabbar{ border-top:none; box-shadow:0 -2px 12px rgba(42,51,64,.05); }
:root[data-style="pastello"] .brand .logo{ border-radius:14px; }
/* planner: un pastello per giorno */
:root[data-style="pastello"] .pg-day, :root[data-style="pastello"] .pl-row, :root[data-style="pastello"] .agenda-day{ border:none; border-radius:14px; box-shadow:none; }
:root[data-style="pastello"] .planner-grid > .pg-day:nth-child(2), :root[data-style="pastello"] .pl-rows > .pl-row:nth-child(1), :root[data-style="pastello"] .agenda > .agenda-day:nth-child(1){ background:var(--p1); }
:root[data-style="pastello"] .planner-grid > .pg-day:nth-child(3), :root[data-style="pastello"] .pl-rows > .pl-row:nth-child(2), :root[data-style="pastello"] .agenda > .agenda-day:nth-child(2){ background:var(--p2); }

<script>
"use strict";
/* ===========================================================================
   APP — namespace unico con moduli simulati (IIFE)
   =========================================================================== */
const App = (function(){

/* ---------------------------------------------------------------------------
   MODULO: Store  — astrazione persistenza su LocalStorage, versionata.
   Espone get/set del singolo "db" serializzato + migrazioni per versione.
--------------------------------------------------------------------------- */
const Store = (function(){
  const KEY = "planner-weekly-db";
  const SCHEMA_VERSION = 5;

  // Stato di default (modello dati indicativo del prompt)
  function defaults(){
    return {
      app: "Planner Weekly",
      version: SCHEMA_VERSION,
      settings: {
        theme: "light",
        accent: "teal",
        style: "mono",
        monoColor: "bosco",
        fontScale: 1.0,
        defaultServings: 2,
        weekDays: 5,
        plannerLayout: "griglia",
        defaultReminder: "09:00",
        urgencyDays: 7,
        departments: ["Verdura","Latticini","Carne","Dispensa","Igiene","Casa"],
        repartiAlias: {},
        people: [ {id:"fra", sigla:"FRA", nome:"Francesco", colore:"#2563eb"}, {id:"fla", sigla:"FLA", nome:"Flavia", colore:"#d6216f"} ],
        ingredientAlias: {},
        supermercati: [],
        supermercatoAttivo: "",
        unitPrefs: ["g","kg","ml","L","pz","tazza","cucchiaio","cucchiaino"],
        conversioniAuto: true,
        compactHeaders: true,
        notificationsEnabled: false,
        ignoreIngredients: ["sale","pepe","olio","acqua"],
        favorites: [
          {nome:"Latte", qty:1, unita:"L"},
          {nome:"Pane", qty:1, unita:"pz"},
          {nome:"Uova", qty:6, unita:"pz"},
          {nome:"Carta igienica", qty:1, unita:"pz"}
        ],
        sync: { enabled:false, url:"", anonKey:"", code:"" },
        deviceId: "",
        onboarded: false
      },
      recipes: [],
      calendarEvents: [],
      planByWeek: {},
      shoppingByWeek: {},
      shoppingLists: [],
      todos: [],
      syncMeta: { rev:0, lastPulledRev:-1, lastHash:"", lastAt:null },
      createdAt: new Date().toISOString()
    };
  }

  let cache = null;

  // Migrazioni schema: mappa da versione -> versione successiva
  function migrate(db){
    if(!db.version) db.version = 1;
    // v1 -> v2: persone per singolo pasto (pranzo/cena) invece che per giorno
    if(db.version < 2){
      Object.values(db.planByWeek||{}).forEach(week=>{
        Object.values(week||{}).forEach(day=>{
          if(!day || typeof day!=="object") return;
          if(typeof day.persone==="number") day.persone={pranzo:day.persone, cena:day.persone};
          if(!day.persone || typeof day.persone!=="object") day.persone={};
          ["pranzo","cena"].forEach(w=>{
            const sl=day[w];
            if(sl && sl.overrideServings){ day.persone[w]=sl.overrideServings; delete sl.overrideServings; }
          });
        });
      });
      db.version=2;
    }
    // v2 -> v3: liste della spesa esplicite (Nuova lista / Chiudi / Spesa fatta) al posto della lista derivata
    if(db.version < 3){
      db.shoppingLists = db.shoppingLists || [];
      const wks=Object.keys(db.shoppingByWeek||{}).sort();
      const last=wks.length ? db.shoppingByWeek[wks[wks.length-1]] : null;
      if(last && (last.extra||[]).length && !db.shoppingLists.length){
        db.shoppingLists.push({ id:"l-mig", name:"Spesa (voci recuperate)", createdAt:new Date().toISOString(), closedAt:null, doneAt:null, status:"open", unit:{},
          items:last.extra.map(x=>({ id:"i-"+Math.random().toString(36).slice(2,8), nome:x.nome, unita:(x.qty==null?"qb":x.unita), reparto:x.reparto, done:false,
            sources:[{kind:"manual", qtyBase:(x.qty==null?null:((x.unita==="kg"||x.unita==="L")?x.qty*1000:x.qty))}] })) });
      }
      db.version=3;
    }
    // v3 -> v4: il planner parte a 5 giorni (lun–ven); il weekend si aggiunge con il pulsante
    if(db.version < 4){ if(db.settings) db.settings.weekDays=5; db.version=4; }
    // v4 -> v5: stile Monospazio come predefinito (chi aveva scelto altro lo mantiene)
    if(db.version < 5){ if(db.settings && (!db.settings.style || db.settings.style==="moderno")) db.settings.style="mono"; db.version=5; }
    db.version = SCHEMA_VERSION;
    return db;
  }

  function load(){
    if(cache) return cache;
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw){ cache = defaults(); save(); return cache; }
      const parsed = JSON.parse(raw);
      cache = migrate(mergeDefaults(defaults(), parsed));
    }catch(err){
      console.error("Store.load fallito, uso i default:", err);
      cache = defaults();
    }
    return cache;
  }

  // Fonde i default con l'oggetto salvato (aggiunge chiavi nuove mancanti)
  function mergeDefaults(def, saved){
    const out = Array.isArray(def) ? saved : {...def, ...saved};
    if(def && def.settings){ out.settings = {...def.settings, ...(saved.settings||{})}; }
    return out;
  }

  let saveHook=null;
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(cache));
      if(saveHook){ try{ saveHook(); }catch(e){} }
      return true;
    }catch(err){
      console.error("Store.save fallito:", err);
      Toast.show("Salvataggio non riuscito, riprova", "err");
      return false;
    }
  }

  return {
    SCHEMA_VERSION,
    get(){ return load(); },
    // Modifica atomica: passa una funzione che muta il db, poi salva
    update(fn){ const db = load(); fn(db); save(); return db; },
    save,
    replaceAll(newDb){ cache = migrate(mergeDefaults(defaults(), newDb)); save(); },
    reset(){ cache = defaults(); save(); },
    setSaveHook(fn){ saveHook=fn; },
    defaults
  };
})();

/* ---------------------------------------------------------------------------
   MODULO: Toast  — notifiche interne (sempre attive)
--------------------------------------------------------------------------- */
const Toast = (function(){
  const wrap = () => document.getElementById("toast-wrap");
  function show(msg, type="", ms=3200){
    const el = document.createElement("div");
    el.className = "toast" + (type ? " "+type : "");
    el.setAttribute("role", type==="err" ? "alert" : "status");
    const icon = type==="ok"?"✓":type==="err"?"⚠":type==="warn"?"!":"ℹ";
    el.innerHTML = `<span aria-hidden="true">${icon}</span><span>${escapeHtml(msg)}</span>`;
    wrap().appendChild(el);
    setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .25s"; setTimeout(()=>el.remove(),260); }, ms);
  }
  return { show };
})();

/* ---------------------------------------------------------------------------
   MODULO: Modal  — dialog accessibile con focus trap + Esc
--------------------------------------------------------------------------- */
const Modal = (function(){
  let openCount = 0;
  let lastFocused = null;

  /* opts: {title, bodyHTML, footHTML, size, onMount(root), onClose} */
  function open(opts){
    lastFocused = document.activeElement;
    const root = document.getElementById("modal-root");
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    const titleId = "modal-title-"+(++openCount);
    backdrop.innerHTML = `
      <div class="modal ${opts.size==='lg'?'modal-lg':''}" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
        <div class="modal-head">
          <h2 id="${titleId}">${escapeHtml(opts.title||"")}</h2>
          <button class="btn btn-ghost btn-icon" data-close aria-label="Chiudi">✕</button>
        </div>
        <div class="modal-body">${opts.bodyHTML||""}</div>
        ${opts.footHTML ? `<div class="modal-foot">${opts.footHTML}</div>` : ""}
      </div>`;
    root.appendChild(backdrop);

    const dialog = backdrop.querySelector(".modal");
    function close(){
      backdrop.remove();
      document.removeEventListener("keydown", onKey, true);
      if(opts.onClose) opts.onClose();
      if(lastFocused && lastFocused.focus) lastFocused.focus();
    }
    backdrop.addEventListener("mousedown", e=>{ if(e.target===backdrop && opts.dismissable!==false) close(); });
    backdrop.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", close));

    // focus trap
    function focusables(){
      return [...dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
        .filter(el=>el.offsetParent!==null || el===document.activeElement);
    }
    function onKey(e){
      if(e.key==="Escape" && opts.dismissable!==false){ e.preventDefault(); close(); return; }
      if(e.key==="Tab"){
        const f = focusables(); if(!f.length) return;
        const first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener("keydown", onKey, true);

    if(opts.onMount) opts.onMount(dialog, close);
    // focus iniziale
    const auto = dialog.querySelector("[autofocus]") || focusables()[0];
    if(auto) auto.focus();

    return { close, dialog };
  }

  /* Conferma semplice: ritorna Promise<boolean> */
  function confirm({title, message, confirmLabel="Conferma", danger=false}){
    return new Promise(resolve=>{
      let done=false;
      const m = open({
        title,
        bodyHTML:`<p class="mb-0">${escapeHtml(message)}</p>`,
        footHTML:`<button class="btn" data-no>Annulla</button>
                  <button class="btn ${danger?'btn-danger':'btn-primary'}" data-yes autofocus>${escapeHtml(confirmLabel)}</button>`,
        onMount(dialog, close){
          dialog.querySelector("[data-yes]").addEventListener("click", ()=>{ done=true; close(); resolve(true); });
          dialog.querySelector("[data-no]").addEventListener("click", ()=>{ done=true; close(); resolve(false); });
        },
        onClose(){ if(!done) resolve(false); }
      });
    });
  }

  function prompt({title, label="", value="", placeholder="", confirmLabel="Salva"}){
    return new Promise(resolve=>{
      let done=false;
      open({ title,
        bodyHTML:`<div class="field">${label?`<label for="pr-val">${escapeHtml(label)}</label>`:""}<input type="text" id="pr-val" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}" autofocus></div>`,
        footHTML:`<button class="btn" data-no>Annulla</button><button class="btn btn-primary" data-yes>${escapeHtml(confirmLabel)}</button>`,
        onMount(dialog, close){
          const inp=dialog.querySelector("#pr-val");
          const ok=()=>{ done=true; const v=inp.value.trim(); close(); resolve(v||null); };
          dialog.querySelector("[data-yes]").addEventListener("click", ok);
          inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); ok(); } });
          dialog.querySelector("[data-no]").addEventListener("click", ()=>{ done=true; close(); resolve(null); });
        },
        onClose(){ if(!done) resolve(null); } });
    });
  }
  return { open, confirm, prompt };
})();

/* ---------------------------------------------------------------------------
   MODULO: Theme  — applica tema/accento/scala font dalle impostazioni
--------------------------------------------------------------------------- */
const Theme = (function(){
  function apply(){
    const s = Store.get().settings;
    const html = document.documentElement;
    const STYLES=["moderno","carte","mercato","lavagna","pastello","mono","fumetto"];
    const style=STYLES.includes(s.style)?s.style:"moderno";
    html.setAttribute("data-style", style);
    // Tema chiaro/scuro e colore d'accento valgono solo per Moderno: gli altri stili hanno colori fissi, come nelle anteprime
    html.setAttribute("data-theme", (style==="moderno" && s.theme==="dark")?"dark":"light");
    html.setAttribute("data-accent", style==="moderno"?(s.accent||"teal"):"teal");
    // carattere dello stile caricato solo quando serve (Google Fonts); il service worker lo tiene in cache
    const FONTS={ mercato:"Oswald:wght@500;600&family=Nunito+Sans:wght@500;700;800", lavagna:"Oswald:wght@500;600&family=Nunito+Sans:wght@500;700;800", pastello:"Quicksand:wght@600;700&family=Nunito:wght@500;700;800", mono:"IBM+Plex+Mono:wght@500;600;700", fumetto:"Bangers&family=Nunito:wght@500;700;800" };
    const TC={moderno:(s.theme==="dark"?"#161b25":"#0d9488"), carte:"#D6216F", mercato:"#142033", lavagna:"#8a5a2b", pastello:"#dfe6ee", mono:"#1b1f1c", fumetto:"#111111"};
    document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute("content", TC[style]||"#0d9488"));
    if(FONTS[style] && !document.getElementById("font-"+style)){
      const l=document.createElement("link"); l.id="font-"+style; l.rel="stylesheet"; l.href="https://fonts.googleapis.com/css2?family="+FONTS[style]+"&display=swap"; document.head.appendChild(l);
    }
    html.setAttribute("data-mono", ["bosco","inchiostro","ambra","prugna"].includes(s.monoColor)?s.monoColor:"bosco");
    html.style.setProperty("--font-scale", s.fontScale || 1);
  }
  return { apply };
})();

/* ---------------------------------------------------------------------------
   MODULO: DateUtils  — settimane ISO 8601, aritmetica date (locale Europe/Rome)
--------------------------------------------------------------------------- */
const DateUtils = (function(){
  const pad = n => String(n).padStart(2,"0");
  function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function parseYmd(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  // Lunedì della settimana che contiene d (lun=inizio)
  function getMonday(d){
    const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const off=(x.getDay()+6)%7;      // dom=0 -> 6, lun=1 -> 0 ...
    x.setDate(x.getDate()-off); return x;
  }
  // Chiave settimana ISO: "YYYY-WW"
  function isoWeekKey(d){
    const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    const dayNum=(date.getUTCDay()+6)%7;
    date.setUTCDate(date.getUTCDate()-dayNum+3);          // giovedì della settimana
    const firstThu=new Date(Date.UTC(date.getUTCFullYear(),0,4));
    const week=1+Math.round(((date-firstThu)/86400000 - 3 + ((firstThu.getUTCDay()+6)%7))/7);
    return `${date.getUTCFullYear()}-${pad(week)}`;
  }
  const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  const MESI_LONG=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  function fmtShort(d){ return `${d.getDate()} ${MESI[d.getMonth()]}`; }
  function fmtLong(d){ return `${d.getDate()} ${MESI_LONG[d.getMonth()]} ${d.getFullYear()}`; }
  // weekday JS (dom=0) da sigla RRULE
  const WD={SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};
  function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
  // differenza in giorni interi tra due date (b - a)
  function diffDays(a,b){ return Math.round((parseYmd(typeof b==="string"?b:ymd(b)) - parseYmd(typeof a==="string"?a:ymd(a)))/86400000); }
  return { pad, ymd, parseYmd, addDays, getMonday, isoWeekKey, fmtShort, fmtLong, MESI, MESI_LONG, WD, today, diffDays };
})();

/* ---------------------------------------------------------------------------
   MODULO: Calendar  — occorrenze eventi (date singole + RRULE) e persone/giorno
--------------------------------------------------------------------------- */
const Calendar = (function(){
  // L'evento capita nel giorno dateStr ("YYYY-MM-DD")?
  function occursOn(ev, dateStr){
    if(ev.date) return ev.date===dateStr;
    if(ev.rrule){
      const d=DateUtils.parseYmd(dateStr), r=ev.rrule;
      if(r.freq==="ANNUALE"){                       // day = "mm-gg"
        if(!r.day) return false;
        const [mm,gg]=r.day.split("-").map(Number);
        return (d.getMonth()+1===mm) && (d.getDate()===gg);
      }
      if(r.freq==="MENSILE"){                        // day = "gg"
        return d.getDate()===Number(r.day);
      }
      if(r.freq==="SETTIMANALE"){                     // day = "MON".."SUN"
        const wd=DateUtils.WD[String(r.day||"").toUpperCase()];
        return wd!==undefined && d.getDay()===wd;
      }
    }
    return false;
  }
  // Composizione persone del giorno: {base, plus, minus, total, contributi:[...]}
  // which: "pranzo" | "cena" | undefined (tutti). Un evento con pasto="pranzo" conta solo a pranzo.
  function composition(dateStr, base, which){
    const db=Store.get();
    let plus=0, minus=0; const contributi=[];
    db.calendarEvents.forEach(ev=>{
      const p=ev.pasto||"entrambi";
      if(which && p!=="entrambi" && p!==which) return;
      if(typeof ev.deltaPersone==="number" && ev.deltaPersone!==0 && occursOn(ev,dateStr)){
        if(ev.deltaPersone>0) plus+=ev.deltaPersone; else minus+=Math.abs(ev.deltaPersone);
        contributi.push({titolo:ev.titolo, delta:ev.deltaPersone});
      }
    });
    return { base, plus, minus, total:Math.max(1, base+plus-minus), contributi };
  }
  function peopleForDate(dateStr, base, which){ return composition(dateStr, base, which).total; }
  // Prossima occorrenza (per countdown ricorrenze): ritorna Date >= oggi
  function nextOccurrence(ev){
    if(ev.date) return DateUtils.parseYmd(ev.date);
    const r=ev.rrule; if(!r) return null;
    const t=DateUtils.today();
    if(r.freq==="ANNUALE"){
      const [mm,gg]=String(r.day).split("-").map(Number);
      let y=t.getFullYear(); let d=new Date(y,mm-1,gg);
      if(d<t) d=new Date(y+1,mm-1,gg);
      return d;
    }
    if(r.freq==="MENSILE"){
      const gg=Number(r.day); let d=new Date(t.getFullYear(),t.getMonth(),gg);
      if(d<t) d=new Date(t.getFullYear(),t.getMonth()+1,gg);
      return d;
    }
    if(r.freq==="SETTIMANALE"){
      const wd=DateUtils.WD[String(r.day).toUpperCase()];
      for(let i=0;i<7;i++){ const d=DateUtils.addDays(t,i); if(d.getDay()===wd) return d; }
    }
    return null;
  }
  return { occursOn, composition, peopleForDate, nextOccurrence };
})();

/* ---------------------------------------------------------------------------
   MODULO: Units/Scale  — parsing quantità, scaling porzioni, reparto di default
--------------------------------------------------------------------------- */
const Units = (function(){
  const MASS=["g","kg"], VOL=["ml","l"], SPOON=["cucchiaio","cucchiai","cucchiaino","cucchiaini","tazza","tazze"];
  // Normalizza sigla unità
  function norm(u){
    if(!u) return "";
    const x=u.trim().toLowerCase();
    const map={ grammi:"g", grammo:"g", chilo:"kg", chili:"kg", kg:"kg", litro:"L", litri:"L", l:"L",
      millilitri:"ml", ml:"ml", pezzi:"pz", pezzo:"pz", pz:"pz", foglie:"pz", foglia:"pz", spicchi:"pz", spicchio:"pz" };
    if(map[x]) return map[x];
    if(x==="l") return "L";
    return u.trim();
  }
  // Parsa "300 g", "2 cucchiai", "qb", "4 pz"
  function parseQty(str){
    if(str==null) return {qty:null, unita:"qb"};
    const s=String(str).trim();
    if(!s || /^q\.?\s?b\.?$/i.test(s) || /quanto basta/i.test(s)) return {qty:null, unita:"qb"};
    const m=s.match(/^([\d]+(?:[.,]\d+)?)\s*(.*)$/);
    if(!m) return {qty:null, unita:"qb"};
    const qty=parseFloat(m[1].replace(",","."));
    const unita=norm(m[2]) || "pz";
    return { qty:isNaN(qty)?null:qty, unita };
  }
  return { norm, parseQty, MASS, VOL, SPOON };
})();

const Scale = (function(){
  // Scala un ingrediente per fattore; non tocca qb. Arrotonda: g/ml step 5, pz intero>=1.
  function ingredient(ing, factor){
    if(ing.qty==null || ing.unita==="qb"){
      return { ...ing, qtyScaled:null, display: "qb" };
    }
    let q = ing.qty * factor;
    const u = ing.unita;
    if(u==="g" || u==="ml"){ q = Math.max(5, Math.round(q/5)*5); }
    else if(u==="pz"){ q = Math.max(1, Math.round(q)); }
    else if(u==="kg" || u==="L"){ q = Math.round(q*100)/100; }
    else { q = Math.round(q*10)/10; }          // cucchiai, tazze...
    const disp = (Number.isInteger(q)? q : q.toString().replace(".",","));
    return { ...ing, qtyScaled:q, display:`${disp} ${u}` };
  }
  function factorFor(recipe, servings){
    const base = recipe.porzioniBase || 1;
    return servings / base;
  }
  return { ingredient, factorFor };
})();

/* ---------------------------------------------------------------------------
   MODULO: Reparti  — dizionario base ingrediente -> reparto (override utente a parte)
--------------------------------------------------------------------------- */
/* Chiave normalizzata di un ingrediente: minuscolo, senza accenti, singolare/plurale unificati.
   "patate" e "patata" → "patat"; "pomodori"/"pomodoro" → "pomodor"; "uova"/"uovo" → "uov"; "funghi"/"fungo" → "fung".
   Le parole vuote (di, del, con…) si ignorano; i sinonimi delle Impostazioni (es. "evo = olio extravergine") si applicano prima. */
const IngKey = (function(){
  const STOP=new Set(["di","del","della","dello","dei","degli","delle","da","dal","dalla","a","al","alla","in","con","e","ed","il","lo","la","i","gli","le","un","una","per","fresco","fresca","freschi","fresche"]);
  function stem(w){
    if(w.length<4) return w;
    w=w.replace(/chi$/,"c").replace(/ghi$/,"g");                              // funghi→fung, fuochi→fuoc
    return w.replace(/[aeio]$/,"");                                            // patate/patata→patat, uova/uovo→uov
  }
  function key(nome){
    let n=String(nome||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(.*?\)/g," ").replace(/[^a-z0-9 ]+/g," ").trim();
    try{ const al=Store.get().settings.ingredientAlias||{}; if(al[n]) n=String(al[n]).toLowerCase(); }catch(e){}
    return n.split(/\s+/).filter(w=>w && !STOP.has(w)).map(stem).join(" ");
  }
  function same(a,b){ return key(a)===key(b); }
  return { key, same, stem };
})();

const Reparti = (function(){
  const DICT=[
    [/(zucchin|pomodor|insalat|basilic|verdur|patat|cipoll|aglio|carota|spinac|melanzan|peperon|lattug|rucol|frutt|mel[ae]|banan|limon|arancia|fragol|funghi|prezzemolo)/,"Verdura"],
    [/(latte|yogurt|burro|panna|mozzarella|parmigian|formagg|ricotta|uov[ao]|stracchino|mascarpone)/,"Latticini"],
    [/(pollo|manzo|maiale|carne|salsicc|prosciutt|tacchino|vitello|hamburger|wurstel|salame|pancett|bacon)/,"Carne"],
    [/(pesce|tonno|salmone|gamber|vongol|merluzzo|acciug|calamar|sogliola|orata)/,"Carne"],
    [/(pasta|spaghett|riso|farina|zucchero|passata|sale|pepe|olio|aceto|pane|biscott|scatola|legum|fagiol|cec[ei]|lenticch|pomodori pelati|brodo|dado|spezie|caffè|tè|cereal|cracker|marmellat)/,"Dispensa"],
    [/(detersiv|sapone|shampoo|dentifric|carta igienica|deodorante|spugna)/,"Igiene"],
  ];
  function match(nome){ const n=(nome||"").toLowerCase(); for(const [re,r] of DICT){ if(re.test(n)) return r; } return null; }
  function guess(nome){
    const n=(nome||"").toLowerCase();
    let rep="Dispensa";
    for(const [re,r] of DICT){ if(re.test(n)){ rep=r; break; } }
    // traduzione nei reparti scelti dall'utente (Impostazioni: AliasReparti, es. "Verdura=Ortofrutta")
    try{
      const st=Store.get().settings, alias=st.repartiAlias||{}, deps=st.departments||[];
      if(alias[rep] && !deps.includes(rep)) return alias[rep];
    }catch(e){}
    return rep;
  }
  return { guess, match };
})();

/* ---------------------------------------------------------------------------
   MODULO: Recipes  — accesso ricette, ricerca, autocomplete con frecency
--------------------------------------------------------------------------- */
const Recipes = (function(){
  function all(){ return Store.get().recipes; }
  function byId(id){ return all().find(r=>r.id===id) || null; }
  function genId(){ return "r-"+Math.random().toString(36).slice(2,9); }
  function add(recipe){
    Store.update(db=>{ db.recipes.push(recipe); });
    return recipe;
  }
  function bumpUse(id){
    Store.update(db=>{ const r=db.recipes.find(x=>x.id===id); if(r) r.useCount=(r.useCount||0)+1; });
  }
  // Autocomplete: match inizio-parola + contenimento, ordinato per frecency (useCount desc)
  function search(q){
    const term=(q||"").trim().toLowerCase();
    const list=all().slice();
    if(!term){
      return list.sort((a,b)=>(b.useCount||0)-(a.useCount||0)).slice(0,8);
    }
    const scored=[];
    list.forEach(r=>{
      const name=r.nome.toLowerCase();
      const tags=(r.tag||[]).join(" ").toLowerCase();
      const ing=(r.ingredienti||[]).map(i=>i.nome).join(" ").toLowerCase();
      let score=-1;
      if(name.startsWith(term)) score=100;
      else if(new RegExp("\\b"+escapeRe(term)).test(name)) score=80;
      else if(name.includes(term)) score=60;
      else if(tags.includes(term)) score=40;
      else if(ing.includes(term)) score=20;
      if(score>=0) scored.push({r, score:score+(r.useCount||0)});
    });
    return scored.sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.r);
  }
  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
  return { all, byId, genId, add, bumpUse, search };
})();

/* ---------------------------------------------------------------------------
   MODULO: Plan  — accesso al piano per settimana/giorno/slot
--------------------------------------------------------------------------- */
const Plan = (function(){
  function week(weekKey){
    const db=Store.get();
    return db.planByWeek[weekKey] || {};
  }
  function slot(weekKey, dateStr, which){
    const w=week(weekKey);
    return (w[dateStr] && w[dateStr][which]) || null;
  }
  function setSlot(weekKey, dateStr, which, data){
    Store.update(db=>{
      db.planByWeek[weekKey] = db.planByWeek[weekKey] || {};
      db.planByWeek[weekKey][dateStr] = db.planByWeek[weekKey][dateStr] || {pranzo:null, cena:null, note:""};
      db.planByWeek[weekKey][dateStr][which] = data;
    });
  }
  function setNote(weekKey, dateStr, text){
    Store.update(db=>{
      db.planByWeek[weekKey] = db.planByWeek[weekKey] || {};
      db.planByWeek[weekKey][dateStr] = db.planByWeek[weekKey][dateStr] || {pranzo:null, cena:null, note:""};
      db.planByWeek[weekKey][dateStr].note = text;
    });
  }
  function clearDay(weekKey, dateStr){
    Store.update(db=>{
      if(db.planByWeek[weekKey]) db.planByWeek[weekKey][dateStr] = {pranzo:null, cena:null, note:""};
    });
  }
  function copyDay(weekKey, fromDate, toDate){
    Store.update(db=>{
      const w=db.planByWeek[weekKey]; if(!w||!w[fromDate]) return;
      w[toDate]=JSON.parse(JSON.stringify(w[fromDate]));
    });
  }
  function moveDay(weekKey, fromDate, toDate){
    Store.update(db=>{
      const w=db.planByWeek[weekKey]; if(!w) return;
      const src=w[fromDate]||{pranzo:null,cena:null,note:""};
      w[toDate]=JSON.parse(JSON.stringify(src));
      w[fromDate]={pranzo:null,cena:null,note:""};
    });
  }
  // Copia un'intera settimana (pasti, persone, note) su un'altra, giorno per giorno (lun→lun, mar→mar…)
  function copyWeek(fromKey, toKey, fromMonday, toMonday, nDays){
    let n=0;
    Store.update(db=>{
      const src=db.planByWeek[fromKey]||{}; db.planByWeek[toKey]=db.planByWeek[toKey]||{};
      for(let i=0;i<nDays;i++){
        const a=DateUtils.ymd(DateUtils.addDays(fromMonday,i)), b=DateUtils.ymd(DateUtils.addDays(toMonday,i));
        if(!src[a]) continue;
        db.planByWeek[toKey][b]=JSON.parse(JSON.stringify(src[a]));
        if(src[a].pranzo||src[a].cena) n++;
      }
    });
    return n;
  }
  function weekIsEmpty(weekKey){ const w=week(weekKey); return !Object.values(w).some(d=>d && (d.pranzo||d.cena)); }
  // Override manuale delle persone di UN pasto (which="pranzo"|"cena"; n=null → torna all'automatico)
  function setPeople(weekKey, dateStr, which, n){
    Store.update(db=>{
      db.planByWeek[weekKey]=db.planByWeek[weekKey]||{};
      const d=db.planByWeek[weekKey][dateStr]=db.planByWeek[weekKey][dateStr]||{pranzo:null,cena:null,note:""};
      if(typeof d.persone==="number") d.persone={pranzo:d.persone, cena:d.persone};
      if(!d.persone || typeof d.persone!=="object") d.persone={};
      if(n==null) delete d.persone[which]; else d.persone[which]=n;
      if(d[which] && d[which].overrideServings) delete d[which].overrideServings;
    });
  }
  // Override presente per quel pasto? (letture tolleranti verso i dati vecchi)
  function peopleOverride(weekKey, dateStr, which){
    const d=week(weekKey)[dateStr]; if(!d) return null;
    if(d.persone && typeof d.persone==="object" && typeof d.persone[which]==="number") return d.persone[which];
    if(typeof d.persone==="number") return d.persone;
    if(d[which] && d[which].overrideServings) return d[which].overrideServings;
    return null;
  }
  // Persone effettive a quel pasto: override manuale se presente, altrimenti calcolo da Calendario
  function peopleFor(weekKey, dateStr, base, which){
    const o=peopleOverride(weekKey, dateStr, which);
    if(o!=null) return o;
    return Calendar.peopleForDate(dateStr, base, which);
  }
  return { week, slot, setSlot, setNote, clearDay, copyDay, moveDay, copyWeek, weekIsEmpty, setPeople, peopleFor, peopleOverride };
})();

/* ---------------------------------------------------------------------------
   MODULO: Shopping  — extra manuali + stato "ce l'ho"/unità per settimana.
   (L'aggregazione dai pasti del planner verrà implementata nella fase Spesa.)
--------------------------------------------------------------------------- */
const Shopping = (function(){
  /* Liste esplicite. Stati: "open" (si riempie) → "shopping" (al supermercato, si spunta) → "done" (archiviata).
     Al massimo una lista attiva (open o shopping). Ogni voce ha delle "sources": da quale pasto/ricetta,
     dalla lista base o aggiunta a mano; la quantità è la somma delle sorgenti con quantità. */
  const norm=n=>IngKey.key(n);
  const rnd=p=>p+Math.random().toString(36).slice(2,8);
  function lists(){ return Store.get().shoppingLists||[]; }
  function active(){ return lists().find(l=>l.status==="open"||l.status==="shopping")||null; }
  function byId(id){ return lists().find(l=>l.id===id)||null; }
  function create(){
    const ex=active(); if(ex) return ex;
    let created=null;
    Store.update(db=>{
      db.shoppingLists=db.shoppingLists||[];
      created={ id:rnd("l-"), name:"Spesa del "+DateUtils.fmtShort(DateUtils.today()), createdAt:new Date().toISOString(),
        closedAt:null, doneAt:null, status:"open", items:[], unit:{} };
      db.shoppingLists.unshift(created);
    });
    return created;
  }
  function ensure(){ return active()||create(); }
  function setStatus(id, status){
    Store.update(db=>{ const l=(db.shoppingLists||[]).find(x=>x.id===id); if(!l) return;
      l.status=status;
      if(status==="shopping") l.closedAt=new Date().toISOString();
      if(status==="done") l.doneAt=new Date().toISOString();
      if(status==="open"){ l.closedAt=null; l.doneAt=null; } });
  }
  function remove(id){ Store.update(db=>{ db.shoppingLists=(db.shoppingLists||[]).filter(x=>x.id!==id); }); }
  function rename(id, name){ Store.update(db=>{ const l=(db.shoppingLists||[]).find(x=>x.id===id); if(l && name.trim()) l.name=name.trim(); }); }

  // ---- unità e reparti ----
  function dimOf(u){ if(u==="g"||u==="kg") return "mass"; if(u==="ml"||u==="L") return "vol"; if(u==="pz") return "count"; if(!u||u==="qb") return "qb"; return "u:"+u; }
  function toBase(qty,u){ return (u==="kg"||u==="L") ? qty*1000 : qty; }
  function round2(n){ return Math.round(n*100)/100; }
  function fmtQty(q){ return Number.isInteger(q)?q:String(q).replace(".",","); }
  function applyAlias(rep){ try{ const st=Store.get().settings, alias=st.repartiAlias||{}, deps=st.departments||[]; return (rep && alias[rep] && !deps.includes(rep))?alias[rep]:rep; }catch(e){ return rep; } }
  // "qb", spezie e dosi da cucchiaio: in lista va solo il nome
  function isNoQty(qty, unita){ return qty==null || unita==="qb" || Units.SPOON.includes(String(unita||"").toLowerCase()); }

  // ---- voci ----
  // entries: [{nome, qty, unita, reparto, source:{kind:"recipe"|"base"|"manual", ...}}]
  function addRaw(listId, entries){
    Store.update(db=>{
      const l=(db.shoppingLists||[]).find(x=>x.id===listId); if(!l) return;
      entries.forEach(e=>{
        const k=norm(e.nome); if(!k) return;
        const noQty=isNoQty(e.qty, e.unita);
        const unita=noQty?"qb":e.unita; const dim=dimOf(unita);
        const qtyBase=noQty?null:toBase(e.qty, unita);
        let it=l.items.find(x=>norm(x.nome)===k);                                   // "patate" e "patata" sono la stessa voce
        if(it && !noQty && dimOf(it.unita)==="qb") it.unita=unita;
        if(!it){ it={ id:rnd("i-"), nome:String(e.nome).trim(), unita, reparto:e.reparto||Reparti.guess(e.nome), repartoAuto:(!e.reparto && !Reparti.match(e.nome)), done:false, sources:[] }; l.items.push(it); }
        else if(e.reparto && it.repartoAuto){ it.reparto=e.reparto; it.repartoAuto=false; }
        it.sources.push({ ...(e.source||{kind:"manual"}), qtyBase, unita:(noQty?null:unita), at:new Date().toISOString() });
        it.done=false;
      });
    });
  }
  function removeSources(listId, pred){
    Store.update(db=>{ const l=(db.shoppingLists||[]).find(x=>x.id===listId); if(!l) return;
      l.items.forEach(it=>{ it.sources=(it.sources||[]).filter(s=>!pred(s)); });
      l.items=l.items.filter(it=>it.sources.length); });
  }
  function removeItem(listId, itemId){ Store.update(db=>{ const l=(db.shoppingLists||[]).find(x=>x.id===listId); if(l) l.items=l.items.filter(i=>i.id!==itemId); }); }
  function setDone(listId, itemId, val){ Store.update(db=>{ const l=(db.shoppingLists||[]).find(x=>x.id===listId); const it=l&&l.items.find(i=>i.id===itemId); if(it) it.done=!!val; }); }
  function setUnitPref(listId, itemId, unit){ Store.update(db=>{ const l=(db.shoppingLists||[]).find(x=>x.id===listId); if(!l) return; l.unit=l.unit||{}; if(unit) l.unit[itemId]=unit; else delete l.unit[itemId]; }); }
  // quantità decisa a mano (sovrascrive la somma delle ricette) e numero di confezioni
  function setItemQty(listId, itemId, patch){
    Store.update(db=>{ const l=(db.shoppingLists||[]).find(x=>x.id===listId); const it=l&&l.items.find(i=>i.id===itemId); if(!it) return;
      if("qty" in patch){ if(patch.qty==null){ delete it.qtyManual; } else it.qtyManual={qty:patch.qty, unita:patch.unita||it.unita||"pz"}; }
      if("confezioni" in patch){ if(patch.confezioni==null||patch.confezioni<=0) delete it.confezioni; else it.confezioni=patch.confezioni; }
      if("nota" in patch){ if(patch.nota) it.nota=patch.nota; else delete it.nota; } });
  }
  // tutta la settimana in lista: ogni pasto con ricetta; lo stesso ingrediente si somma
  function addWeek(weekKey, days){
    const l=ensure(); let meals=0, n=0;
    days.forEach(d=>{ const ds=DateUtils.ymd(d); ["pranzo","cena"].forEach(w=>{ const sl=Plan.slot(weekKey, ds, w); if(!sl||!sl.recipeId) return;
      removeSources(l.id, s=>s.kind==="recipe" && s.day===ds && s.slot===w); const e=mealEntries(weekKey, ds, w); addRaw(l.id, e); meals++; n+=e.length; }); });
    return { meals, items:n, total:(active()||l).items.length };
  }

  // ---- dal planner: ingredienti di un pasto (scalati alle persone del pasto; esclusi "Ce l'ho" e ignorati) ----
  function mealEntries(weekKey, ds, which){
    const s=Store.get().settings; const slot=Plan.slot(weekKey, ds, which); if(!slot||!slot.recipeId) return [];
    const r=Recipes.byId(slot.recipeId); if(!r) return [];
    const serv=Plan.peopleFor(weekKey, ds, s.defaultServings, which);
    const factor=Scale.factorFor(r, serv);
    const have=slot.have||[]; const ignore=(s.ignoreIngredients||[]).map(x=>x.toLowerCase());
    const out=[];
    (r.ingredienti||[]).forEach(ing=>{
      if(have.includes(ing.nome)) return;
      if(ignore.includes(norm(ing.nome))) return;
      const source={kind:"recipe", recipeId:r.id, recipeName:r.nome, day:ds, slot:which};
      const reparto=ing.reparto||Reparti.guess(ing.nome);
      if(isNoQty(ing.qty, ing.unita)){ out.push({nome:ing.nome, qty:null, unita:"qb", reparto, source}); return; }
      if(ing.unita==="pz"){ out.push({nome:ing.nome, qty:ing.qty*factor, unita:"pz", reparto, source}); return; }   // arrotondato dopo la somma
      const sc=Scale.ingredient(ing, factor);
      out.push({nome:ing.nome, qty:sc.qtyScaled, unita:ing.unita, reparto, source});
    });
    return out;
  }
  function addMeal(weekKey, ds, which){
    const l=ensure();
    removeSources(l.id, s=>s.kind==="recipe" && s.day===ds && s.slot===which);   // idempotente: ri-aggiungere aggiorna
    const entries=mealEntries(weekKey, ds, which);
    addRaw(l.id, entries);
    return entries.length;
  }
  function removeMeal(ds, which){ const l=active(); if(!l) return; removeSources(l.id, s=>s.kind==="recipe" && s.day===ds && s.slot===which); }
  function mealInList(ds, which){ const l=active(); if(!l) return false; return l.items.some(it=>(it.sources||[]).some(s=>s.kind==="recipe" && s.day===ds && s.slot===which)); }
  function addManual(nome, qty, unita){ const l=ensure(); addRaw(l.id, [{nome, qty:(qty!=null&&!isNaN(qty))?qty:null, unita:unita||"pz", source:{kind:"manual"}}]); return l; }
  function addRecipeIngredients(r, ings){ const l=ensure(); addRaw(l.id, ings.map(ing=>({nome:ing.nome, qty:ing.qty, unita:ing.unita, reparto:ing.reparto, source:{kind:"recipe", recipeId:r.id, recipeName:r.nome}}))); return l; }

  // ---- lista base (Impostazioni → Preferiti / lista_base_spesa.txt) ----
  function baseStatus(){
    const l=active(); const favs=Store.get().settings.favorites||[];
    return favs.map(f=>{ const it=l?l.items.find(x=>norm(x.nome)===norm(f.nome)):null;
      let cur="";
      if(it){ const v=view(l).items.find(x=>x.id===it.id); if(v){ cur=v.hasQty?v.qtyText:""; if(v.confezioni) cur=(cur?cur+" · ":"")+v.confezioni+" conf"; } }
      return {...f, reparto:applyAlias(f.reparto||Reparti.guess(f.nome)), inList:!!it, itemId:it?it.id:null, cur, locked:!!(it && (it.sources||[]).some(s=>s.kind!=="base"))}; });
  }
  // "2", "500 g", "3 conf", "500 g 2 conf" → {qty, unita, confezioni}
  function parseQtyText(t){
    const out={qty:null, unita:null, confezioni:null}; t=String(t||"").trim().toLowerCase(); if(!t) return out;
    const c=t.match(/(\d+)\s*conf/); if(c){ out.confezioni=parseInt(c[1],10); t=t.replace(c[0],"").replace(/[·,]/g," ").trim(); }
    if(t){ const q=Units.parseQty(t); if(q.qty!=null){ out.qty=q.qty; out.unita=q.unita; } }
    return out;
  }
  function setBase(selected){  // [{nome, qtyText}]
    const l=ensure(); const favs=Store.get().settings.favorites||[];
    const selMap=new Map(selected.map(x=>[norm(x.nome), x]));
    const toAdd=[], toRemove=[], toQty=[];
    favs.forEach(f=>{
      const it=l.items.find(x=>norm(x.nome)===norm(f.nome)); const pick=selMap.get(norm(f.nome));
      if(pick){
        const pq=parseQtyText(pick.qtyText);
        if(!it) toAdd.push({nome:f.nome, qty:(pq.qty!=null?pq.qty:f.qty), unita:(pq.unita||f.unita||"pz"), reparto:f.reparto, source:{kind:"base"}, _conf:pq.confezioni, _manual:pq.qty!=null});
        else toQty.push({id:it.id, pq, touched:pick.qtyText!==pick.initial});
      }
      else if(it && (it.sources||[]).every(s=>s.kind==="base")) toRemove.push(it.id);
    });
    toRemove.forEach(id=>removeItem(l.id, id));
    if(toAdd.length) addRaw(l.id, toAdd.map(x=>({nome:x.nome, qty:x.qty, unita:x.unita, reparto:x.reparto, source:x.source})));
    // confezioni/quantità scritte a mano sulle voci nuove
    toAdd.forEach(x=>{ if(x._conf||x._manual){ const it=active().items.find(i=>norm(i.nome)===norm(x.nome)); if(it) setItemQty(l.id, it.id, { ...(x._manual?{qty:x.qty, unita:x.unita}:{}), ...(x._conf?{confezioni:x._conf}:{}) }); } });
    toQty.forEach(x=>{ if(!x.touched) return; setItemQty(l.id, x.id, { qty:x.pq.qty, unita:x.pq.unita||undefined, confezioni:x.pq.confezioni }); });
    return {added:toAdd.length, removed:toRemove.length};
  }

  // ---- chiusura: "Spesa fatta" con eventuale riporto dei non presi in una nuova lista ----
  function finish(id, carryOver){
    const l=byId(id); if(!l) return null;
    const left=l.items.filter(i=>!i.done).map(i=>JSON.parse(JSON.stringify(i)));
    setStatus(id, "done");
    if(carryOver && left.length){
      const n=create();
      Store.update(db=>{ const nl=db.shoppingLists.find(x=>x.id===n.id); left.forEach(i=>{ i.done=false; nl.items.push(i); }); });
      return n;
    }
    return null;
  }

  // ---- vista: quantità sommate, unità migliore, gruppi per reparto ----
  function display(dim, base, pref){
    if(dim==="mass"){ const alt=["g","kg"]; const u=alt.includes(pref)?pref:(base>=1000?"kg":"g"); return {qty:u==="kg"?round2(base/1000):Math.round(base), unita:u, altUnits:alt}; }
    if(dim==="vol"){ const alt=["ml","L"]; const u=alt.includes(pref)?pref:(base>=1000?"L":"ml"); return {qty:u==="L"?round2(base/1000):Math.round(base), unita:u, altUnits:alt}; }
    if(dim==="count"){ return {qty:Math.max(1, Math.ceil(base-1e-6)), unita:"pz", altUnits:[]}; }
    return {qty:Math.round(base*10)/10, unita:dim.slice(2), altUnits:[]};
  }
  function view(l){
    const items=(l.items||[]).map(it=>{
      // somme separate per dimensione (grammi, millilitri, pezzi…): "500 g · 4 pz"
      const byDim={};
      (it.sources||[]).forEach(src=>{ if(src.qtyBase==null) return; const u=src.unita||it.unita; const dm=dimOf(u); if(dm==="qb") return; byDim[dm]=(byDim[dm]||0)+src.qtyBase; });
      const dims=Object.keys(byDim);
      const parts=dims.map(dm=>display(dm, byDim[dm], dims.length===1?(l.unit||{})[it.id]:null));
      let hasQty=parts.length>0, qty=null, unita=it.unita, altUnits=[], qtyText="";
      if(hasQty){ qty=parts[0].qty; unita=parts[0].unita; altUnits=dims.length===1?parts[0].altUnits:[]; qtyText=parts.map(x=>`${fmtQty(x.qty)} ${x.unita}`).join(" · "); }
      const base=dims.length===1?byDim[dims[0]]:0;
      if(it.qtyManual && it.qtyManual.qty!=null){ qty=it.qtyManual.qty; unita=it.qtyManual.unita; altUnits=[]; hasQty=true; qtyText=`${fmtQty(qty)} ${unita}`; }
      return {...it, hasQty, base, qty, unita, altUnits, qtyText, manual:!!it.qtyManual, reparto:applyAlias(it.reparto)};
    });
    const stg=Store.get().settings;
    const sup=stg.supermercatoAttivo ? (stg.supermercati||[]).find(x=>x.id===stg.supermercatoAttivo) : null;
    const groups={}; let order;
    if(sup){
      // raggruppa per SEZIONE del supermercato: assegnazione per parola chiave, altrimenti per reparto dell'app
      items.forEach(it=>{ it.sezione=Supermercati.sectionFor(sup, it); (groups[it.sezione]=groups[it.sezione]||[]).push(it); });
      order=sup.sezioni.concat(["Altro"]);
    } else {
      items.forEach(it=>{ (groups[it.reparto]=groups[it.reparto]||[]).push(it); });
      order=stg.departments||[];
    }
    const orderedReps=[...order.filter(r=>groups[r]), ...Object.keys(groups).filter(r=>!order.includes(r)).sort()];
    orderedReps.forEach(r=>groups[r].sort((a,b)=>(a.done-b.done)||a.nome.localeCompare(b.nome)));
    const done=items.filter(i=>i.done).length;
    return { groups, orderedReps, items, done, toBuy:items.length-done, supermercato:sup||null };
  }
  function provSummary(it){
    const src=it.sources||[];
    const recs=[...new Set(src.filter(s=>s.recipeName).map(s=>s.recipeName))];
    const parts=[]; if(recs.length) parts.push(recs.length>1?`${recs.length} ricette`:recs[0]);
    if(src.some(s=>s.kind==="base")) parts.push("lista base");
    if(src.some(s=>s.kind==="manual")) parts.push("aggiunto");
    return parts.join(" · ")||"—";
  }
  function toTxt(l){
    const {groups, orderedReps}=view(l);
    let out=`${l.name}\n`;
    orderedReps.forEach(rep=>{ out+=`\n## ${rep}\n`; groups[rep].forEach(it=>{ out+=`- [${it.done?"x":" "}] ${it.nome}${it.hasQty?` — ${it.qtyText}`:''}${it.confezioni?` — ${it.confezioni} conf.`:''}${it.nota?` (${it.nota})`:''}\n`; }); });
    return out;
  }
  function toCsv(l){
    const {items}=view(l);
    let out="reparto,nome,quantita,unita,preso,provenienza\n";
    items.forEach(it=>{ out+=`"${it.reparto}","${it.nome.replace(/"/g,'""')}",${it.hasQty?fmtQty(it.qty):''},"${it.hasQty?it.unita:''}",${it.done?1:0},"${provSummary(it).replace(/"/g,'""')}"\n`; });
    return out;
  }
  return { lists, active, byId, create, ensure, setStatus, remove, rename, addRaw, addMeal, addWeek, removeMeal, mealInList, mealEntries, setItemQty,
    addManual, addRecipeIngredients, baseStatus, setBase, finish, removeItem, setDone, setUnitPref, view, provSummary, toTxt, toCsv, fmtQty };
})();

/* ---------------------------------------------------------------------------
/* ---------------------------------------------------------------------------
   MODULO: Supermercati — ordine dei reparti per negozio (modalità "sto facendo la spesa")
   Ogni supermercato ha: id, nome, emoji/colore, elenco ordinato delle sue sezioni,
   e una mappa reparto-dell'app → sezione. Le parole chiave affinano l'assegnazione.

const Supermercati = (function(){

  // Ordine = priorità. Una sezione "A|B" usa A se il negozio la ha, altrimenti B.

    [/(brodo|dado\b|concentrat|fecola|pangrattat|crostin|latte di cocco|succo di limone|aglio in polvere|cipolla in polvere|in scatola|in lattina|in vasetto|sott'?oli|sottacet)/,"Alimentari confezionati (secco)"],

    [/(cerott|vitamin|integrator|termometr|disinfett|garz|aspirin|tachipirin|sciropp)/,"Parafarmacia|Igiene e cura della persona"],
    [/(carta igienic|fazzolett|dentifric|spazzolin|shampoo|bagnoschium|sapone|deodorant|assorbent|pannolin|salviett|cotone|rasoi|crema (viso|mani|corpo)|balsamo)/,"Igiene e cura della persona"],
    [/(alluminio|pellicola|carta forno|stoviglie|bicchier|piatti di carta|tovaglio|candel|lampadin|pil[ae]\b|batteri[ae])/,"Casalinghi e bazar"],
    [/(quadern|penn[ae] (a sfera|biro)|biro|matit|pennarell|gomma da|colla stick|nastro adesiv|cartellin|busta|evidenziator)/,"Cancelleria"],
    [/(crocchett|croccantin|cibo (gatto|cane)|sabbia (gatto|per gatti)|lettiera|scatolett[ae] (gatto|cane))/,"Animali|Casalinghi e bazar"],
    [/(acqua\b|birra|vino|pepsi|coca|aranciat|succo|bibita|spumante|prosecco|limonat|gassos|chinotto|the freddo|tè freddo)/,"Bevande e cantina"],

  const PAM_SEZIONI=["Pulizia della casa","Igiene e cura della persona","Gastronomia e salumeria","Panetteria e pasticceria","Ortofrutta","Casalinghi e bazar","Cancelleria","Abbigliamento e intimo","Macelleria","Latticini e banco frigo","Alimentari confezionati (uova, latte, panna)","Surgelati e gelati","Colazione e dolciario","Alimentari confezionati (secco)","Bevande e cantina","Parafarmacia"];
  const MAPPA_STD={ "Ortofrutta":"Ortofrutta", "Verdura":"Ortofrutta", "Dispensa":"Alimentari confezionati (secco)", "Frigo / Surgelati":"Latticini e banco frigo", "Latticini":"Latticini e banco frigo", "Carne":"Macelleria", "Casa":"Pulizia della casa", "Igiene":"Igiene e cura della persona" };
  function defaults(){
    return [
      { id:"coop", nome:"Coop", emoji:"🟥", colore:"#e30613", logo:LOGO_COOP, sezioni:COOP_SEZIONI.slice(), mappa:{...MAPPA_STD} },
      { id:"pam", nome:"Pam", emoji:"🟩", colore:"#009246", logo:LOGO_PAM, sezioni:PAM_SEZIONI.slice(), mappa:{...MAPPA_STD} }
    ];
  }
  function all(){
    const s=Store.get().settings;
    if(!s.supermercati||!s.supermercati.length){ Store.update(db=>{ db.settings.supermercati=defaults(); }); }
    else {
      const defs=defaults(); const miss=defs.filter(d=>!s.supermercati.some(x=>x.id===d.id));
      const needLogo=s.supermercati.some(x=>defs.some(d=>d.id===x.id && d.logo && !x.logo));
      if(miss.length||needLogo) Store.update(db=>{ db.settings.supermercati.push(...miss); db.settings.supermercati.forEach(x=>{ const d=defs.find(z=>z.id===x.id); if(d && d.logo && !x.logo){ x.logo=d.logo; x.colore=d.colore; x.emoji=d.emoji; if(x.id==="pam" && x.nome==="Pam Panorama") x.nome="Pam"; } }); });
    }
    return Store.get().settings.supermercati;
  }
  function byId(id){ return all().find(x=>x.id===id)||null; }
  function active(){ const id=Store.get().settings.supermercatoAttivo; return id?byId(id):null; }
  function setActive(id){ setSetting("supermercatoAttivo", id||""); }
  function sectionFor(sup, it){
    const ov=(sup.override||{})[IngKey.key(it.nome)]; if(ov && sup.sezioni.includes(ov)) return ov;
    { const n=String(it.nome||"").toLowerCase(); for(const [re,sec] of COOP_PAROLE){ if(re.test(n)){ const alt=sec.split("|").find(z=>sup.sezioni.includes(z)); if(alt) return alt; } } }
    const fromBase=(it.sources||[]).some(x=>x.kind==="base");
    const auto=it.repartoAuto===true || (it.repartoAuto===undefined && !fromBase && !Reparti.match(it.nome));
    const m=(sup.mappa||{})[it.reparto]; if(m && sup.sezioni.includes(m) && !auto) return m;
    return "Altro";   // non riconosciuta: in fondo, in evidenza, da sistemare con un tocco sulla quantità
  }
  function setOverride(supId, nome, sezione){ Store.update(db=>{ const sup=(db.settings.supermercati||[]).find(x=>x.id===supId); if(!sup) return; sup.override=sup.override||{}; const k=IngKey.key(nome); if(sezione) sup.override[k]=sezione; else delete sup.override[k]; }); }
  function save(sup){ Store.update(db=>{ const arr=db.settings.supermercati=db.settings.supermercati||[]; const i=arr.findIndex(x=>x.id===sup.id); if(i>=0) arr[i]=sup; else arr.push(sup); }); }
  function remove(id){ Store.update(db=>{ db.settings.supermercati=(db.settings.supermercati||[]).filter(x=>x.id!==id); if(db.settings.supermercatoAttivo===id) db.settings.supermercatoAttivo=""; }); }
  return { all, byId, active, setActive, sectionFor, setOverride, save, remove, defaults };
})();

/* ---------------------------------------------------------------------------
   MODULO: Todos  — CRUD lista to-do
--------------------------------------------------------------------------- */
const Todos = (function(){
  function all(){ return Store.get().todos; }
  function add(t){ Store.update(db=>db.todos.push({id:"t-"+Math.random().toString(36).slice(2,8), done:false, ...t})); }
  function update(id, patch){ Store.update(db=>{ const x=db.todos.find(z=>z.id===id); if(x) Object.assign(x,patch); }); }
  function remove(id){ Store.update(db=>{ db.todos=db.todos.filter(z=>z.id!==id); }); }
  return { all, add, update, remove };
})();
