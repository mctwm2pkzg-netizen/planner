/* ---------------------------------------------------------------------------
   MODULO: Backup  — export/import completo (.json + checksum + merge)
--------------------------------------------------------------------------- */
const Backup = (function(){
  const APP="Planner Weekly";
  const SECTIONS=["settings","recipes","calendarEvents","planByWeek","shoppingByWeek","todos"];

  // SHA-256 esadecimale (richiede secure context; se assente ritorna null → checksum opzionale)
  async function sha256(str){
    try{
      if(!(window.crypto && crypto.subtle)) return null;
      const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return "sha256-"+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }catch(e){ return null; }
  }

  async function exportJSON(){
    const db=Store.get();
    // ordine chiavi fisso → checksum riproducibile in import
    const payload={ app:APP, version:Store.SCHEMA_VERSION, createdAt:new Date().toISOString(),
      settings:db.settings, recipes:db.recipes, calendarEvents:db.calendarEvents,
      planByWeek:db.planByWeek, shoppingByWeek:db.shoppingByWeek, todos:db.todos };
    const checksum=await sha256(JSON.stringify(payload));
    const full=checksum ? {...payload, checksum} : payload;
    return JSON.stringify(full, null, 2);
  }

  function validate(obj){
    const errs=[];
    if(!obj || typeof obj!=="object"){ return ["Il file non contiene un oggetto JSON valido."]; }
    if(obj.app && obj.app!==APP) errs.push(`Backup di un'altra app: "${obj.app}"`);
    if(!("version" in obj)) errs.push("Manca il campo 'version'.");
    SECTIONS.forEach(k=>{ if(!(k in obj)) errs.push("Manca la sezione: "+k); });
    return errs;
  }

  async function verify(obj){
    if(!obj.checksum) return { checked:false, ok:true };
    const {checksum, ...payload}=obj;
    const calc=await sha256(JSON.stringify(payload));
    if(calc==null) return { checked:false, ok:true }; // impossibile calcolare qui
    return { checked:true, ok: calc===checksum };
  }

  function replaceAll(obj){
    Store.replaceAll({
      app:APP, version:obj.version, createdAt:obj.createdAt,
      settings:obj.settings, recipes:obj.recipes, calendarEvents:obj.calendarEvents,
      planByWeek:obj.planByWeek, shoppingByWeek:obj.shoppingByWeek, todos:obj.todos
    });
  }

  // Unione non distruttiva; ritorna un log dei conflitti
  function merge(obj){
    const log=[];
    Store.update(db=>{
      (obj.recipes||[]).forEach(r=>{
        const ex=db.recipes.find(x=>x.id===r.id || x.nome.toLowerCase()===String(r.nome||"").toLowerCase());
        if(ex){ log.push("ricetta già presente: "+r.nome); }
        else db.recipes.push({...r, id:r.id||("r-"+Math.random().toString(36).slice(2,8))});
      });
      const evKey=e=>`${e.date||(e.rrule&&e.rrule.day)||""}|${e.type}|${e.titolo}`;
      const seenE=new Set(db.calendarEvents.map(evKey));
      (obj.calendarEvents||[]).forEach(e=>{ const k=evKey(e); if(seenE.has(k)){ log.push("evento duplicato: "+e.titolo); } else { db.calendarEvents.push({...e, id:e.id||("e-"+Math.random().toString(36).slice(2,8))}); seenE.add(k); } });
      const tKey=t=>`${t.titolo}|${t.data||""}`;
      const seenT=new Set(db.todos.map(tKey));
      (obj.todos||[]).forEach(t=>{ const k=tKey(t); if(seenT.has(k)){ log.push("to-do duplicato: "+t.titolo); } else { db.todos.push({...t, id:t.id||("t-"+Math.random().toString(36).slice(2,8))}); seenT.add(k); } });
      Object.keys(obj.planByWeek||{}).forEach(wk=>{ if(db.planByWeek[wk]){ log.push("settimana piano già presente (mantengo locale): "+wk); } else db.planByWeek[wk]=obj.planByWeek[wk]; });
      Object.keys(obj.shoppingByWeek||{}).forEach(wk=>{ if(!db.shoppingByWeek[wk]) db.shoppingByWeek[wk]=obj.shoppingByWeek[wk]; });
      // settings: in modalità unisci si mantengono quelle locali
    });
    console.log("[Backup merge]", log.length?log:"nessun conflitto");
    return log;
  }

  return { exportJSON, validate, verify, replaceAll, merge };
})();

/* ---------------------------------------------------------------------------
   MODULO: Sync  — sincronizzazione multi-dispositivo via Supabase (REST)
   Modello: un "codice" condiviso identifica una riga; il payload è cifrato
   sul dispositivo (AES-GCM) → sul cloud finisce solo testo cifrato.
--------------------------------------------------------------------------- */
const Sync = (function(){
  let _status={kind:"off", msg:""}, _syncing=false, _conflictOpen=false;
  let _timer=null, _pushDeb=null, _statusCb=null;

  function cfg(){ return Store.get().settings.sync || {}; }
  function isEnabled(){ const c=cfg(); return !!(c.enabled && c.url && c.anonKey && c.code); }

  /* --- crypto helpers (Web Crypto) --- */
  function b64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
  function unb64(str){ const bin=atob(str); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  async function hashHex(str){
    if(window.crypto && crypto.subtle){
      const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }
    let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
    return ("0000000"+h.toString(16)).slice(-8);
  }
  async function deriveKey(code, salt){
    const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  }
  async function encryptBlob(obj, code){
    const json=JSON.stringify(obj);
    if(!(window.crypto && crypto.subtle)) return { payload:json, salt:"", iv:"", enc:false };
    const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveKey(code, salt);
    const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(json));
    return { payload:b64(ct), salt:b64(salt), iv:b64(iv), enc:true };
  }
  async function decryptBlob(row, code){
    if(!row.enc) return JSON.parse(row.payload);
    const key=await deriveKey(code, unb64(row.salt));
    const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(row.iv)}, key, unb64(row.payload));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  /* --- transport REST (sovrascrivibile per test) --- */
  function headers(){ const s=cfg(); return { apikey:s.anonKey, Authorization:"Bearer "+s.anonKey, Accept:"application/json" }; }
  const REST={
    async fetchRow(codeId){
      const base=cfg().url.replace(/\/+$/,"");
      const res=await fetch(`${base}/rest/v1/sync_store?code_id=eq.${encodeURIComponent(codeId)}&select=*`, { headers:headers() });
      if(!res.ok) throw new Error("HTTP "+res.status+" "+(await res.text()).slice(0,120));
      const arr=await res.json(); return arr[0]||null;
    },
    async upsertRow(row){
      const base=cfg().url.replace(/\/+$/,"");
      const res=await fetch(`${base}/rest/v1/sync_store`, { method:"POST",
        headers:{...headers(), "Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"},
        body:JSON.stringify(row) });
      if(!res.ok) throw new Error("HTTP "+res.status+" "+(await res.text()).slice(0,160));
    }
  };
  let _transport=REST;
  function T(){ return _transport; }

  /* --- stato --- */
  function setStatus(kind, msg){
    _status={kind, msg:msg||""};
    const el=document.getElementById("sync-status");
    if(el){ el.textContent=statusText(); el.dataset.kind=kind; }
    if(_statusCb) _statusCb(_status);
  }
  function statusText(){
    const m={ off:"Non attiva", syncing:"Sincronizzazione…", ok:"Sincronizzato", err:"Errore", conflict:"Conflitto da risolvere", idle:"In attesa" }[_status.kind]||"";
    const t=Store.get().syncMeta.lastAt;
    const when=(_status.kind==="ok" && t)? " · "+new Date(t).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) : "";
    return m + (_status.msg?(" · "+_status.msg):"") + when;
  }

  /* --- dati da sincronizzare (escluse le credenziali di sync) --- */
  function collectBlob(){
    const db=Store.get(); const s={...db.settings}; delete s.sync; delete s.deviceId;
    return { settings:s, recipes:db.recipes, calendarEvents:db.calendarEvents,
      planByWeek:db.planByWeek, shoppingByWeek:db.shoppingByWeek, todos:db.todos };
  }
  async function pushBlob(blob, code, codeId, rev){
    const enc=await encryptBlob(blob, code);
    await T().upsertRow({ code_id:codeId, ...enc, rev, device:Store.get().settings.deviceId, updated_at:new Date().toISOString() });
    const h=await hashHex(JSON.stringify(blob));
    Store.update(db=>{ db.syncMeta={...db.syncMeta, rev, lastPulledRev:rev, lastHash:h, lastAt:new Date().toISOString()}; });
  }
  async function applyRemote(remoteData, remoteRev){
    Store.update(db=>{
      const keepSync=db.settings.sync, keepDev=db.settings.deviceId;
      db.settings={...db.settings, ...(remoteData.settings||{}), sync:keepSync, deviceId:keepDev};
      db.recipes=remoteData.recipes||[]; db.calendarEvents=remoteData.calendarEvents||[];
      db.planByWeek=remoteData.planByWeek||{}; db.shoppingByWeek=remoteData.shoppingByWeek||{}; db.todos=remoteData.todos||[];
      db.syncMeta={...db.syncMeta, rev:remoteRev, lastPulledRev:remoteRev};
    });
    const h=await hashHex(JSON.stringify(collectBlob()));
    Store.update(db=>{ db.syncMeta.lastHash=h; db.syncMeta.lastAt=new Date().toISOString(); });
    if(typeof Theme!=="undefined") Theme.apply();
  }
  function rerender(){ const n=Router.currentName && Router.currentName(); if(n) Router.go(n); }

  /* --- ciclo di sincronizzazione --- */
  async function runSync(reason){
    if(!isEnabled() || _syncing || _conflictOpen) return;
    _syncing=true; setStatus("syncing");
    try{
      const code=cfg().code, codeId=await hashHex(code);
      const localBlob=collectBlob();
      const localHash=await hashHex(JSON.stringify(localBlob));
      const meta=Store.get().syncMeta;
      const dirty = localHash!==meta.lastHash;
      const row=await T().fetchRow(codeId);
      if(!row){ await pushBlob(localBlob, code, codeId, 1); setStatus("ok"); return; }
      const remoteRev=row.rev|0;
      if(remoteRev>meta.lastPulledRev){
        let remoteData;
        try{ remoteData=await decryptBlob(row, code); }
        catch(e){ setStatus("err","codice errato o dati non leggibili"); return; }
        if(!dirty){ await applyRemote(remoteData, remoteRev); setStatus("ok"); rerender(); }
        else { _syncing=false; promptConflict(remoteData, remoteRev, localBlob, code, codeId); return; }
      } else if(dirty){
        await pushBlob(localBlob, code, codeId, remoteRev+1); setStatus("ok");
      } else { setStatus("ok"); }
    }catch(e){ console.error("[Sync]", e); setStatus("err", e.message); }
    finally{ _syncing=false; }
  }

  function promptConflict(remoteData, remoteRev, localBlob, code, codeId){
    _conflictOpen=true; setStatus("conflict");
    Modal.open({ title:"Conflitto di sincronizzazione", dismissable:false,
      bodyHTML:`<p class="mb-2">Sia questo dispositivo che il cloud hanno modifiche non ancora allineate.</p>
        <p class="text-sm text-mute mb-0"><strong>Unisci</strong> combina tutto senza perdere dati (consigliato).<br>
        <strong>Prendi dal cloud</strong> sovrascrive questo dispositivo.<br>
        <strong>Tieni questo dispositivo</strong> sovrascrive il cloud.</p>`,
      footHTML:`<button class="btn" data-keep>Tieni questo</button><button class="btn" data-take>Prendi dal cloud</button><button class="btn btn-primary" data-merge>Unisci</button>`,
      onMount(dialog, close){
        const done=()=>{ _conflictOpen=false; setStatus("ok"); rerender(); };
        dialog.querySelector("[data-keep]").addEventListener("click", async ()=>{ close(); try{ await pushBlob(localBlob, code, codeId, remoteRev+1); }catch(e){ setStatus("err",e.message); } done(); });
        dialog.querySelector("[data-take]").addEventListener("click", async ()=>{ close(); try{ await applyRemote(remoteData, remoteRev); }catch(e){ setStatus("err",e.message); } done(); });
        dialog.querySelector("[data-merge]").addEventListener("click", async ()=>{
          close();
          try{ Backup.merge(remoteData); const blob=collectBlob(); await pushBlob(blob, code, codeId, remoteRev+1); }
          catch(e){ setStatus("err",e.message); }
          done();
        });
      }});
  }

  async function test(){
    if(!cfg().url||!cfg().anonKey){ Toast.show("Inserisci URL e anon key","warn"); return; }
    try{ setStatus("syncing"); await T().fetchRow(await hashHex(cfg().code||"test")); setStatus("ok","connessione OK"); Toast.show("Connessione a Supabase riuscita","ok"); }
    catch(e){ setStatus("err", e.message); Toast.show("Connessione fallita: "+e.message, "err"); }
  }

  /* --- automatismi --- */
  function onVis(){ if(document.visibilityState==="visible" && navigator.onLine) runSync("visible"); }
  function onOnline(){ runSync("online"); }
  function startAuto(){
    stopAuto();
    if(!isEnabled()){ setStatus("off"); return; }
    Store.setSaveHook(()=>{ if(_syncing||_conflictOpen) return; clearTimeout(_pushDeb); _pushDeb=setTimeout(()=>runSync("change"), 2500); });
    _timer=setInterval(()=>{ if(navigator.onLine) runSync("interval"); }, 18000);
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("online", onOnline);
    setStatus("idle"); runSync("start");
  }
  function stopAuto(){
    if(_timer) clearInterval(_timer); _timer=null;
    Store.setSaveHook(null);
    document.removeEventListener("visibilitychange", onVis);
    window.removeEventListener("online", onOnline);
    setStatus("off");
  }

  return {
    startAuto, stopAuto, runSync, test, isEnabled, statusText,
    // esposti per test:
    _setTransport(t){ _transport=t; }, _encryptBlob:encryptBlob, _decryptBlob:decryptBlob, _hashHex:hashHex, _collectBlob:collectBlob
  };
})();

/* ---------------------------------------------------------------------------
   MODULO: Parse  — parser dei file .txt (ricette, calendario, todo, impostazioni)
--------------------------------------------------------------------------- */
const Parse = (function(){
  // ricette.txt -> {recipes:[], errors:[]}. Blocchi separati da una riga "---".
  function ricette(text){
    const errors=[]; const recipes=[];
    const blocks = text.replace(/\r/g,"").split(/^\s*---\s*$/m).map(b=>b.trim()).filter(Boolean);
    blocks.forEach((block, bi)=>{
      const lines=block.split("\n");
      const r={ id:Recipes.genId(), nome:"", porzioniBase:2, categoria:"", tempo:"", tag:[], ingredienti:[], istruzioni:[], note:"", useCount:0 };
      let mode=null; // "ing" | "ist" | "note"
      lines.forEach(raw=>{
        const line=raw.trim();
        if(!line || line.startsWith("#")) return;
        const kv=line.match(/^([A-Za-zÀ-ÿ ]+):\s*(.*)$/);
        const key=kv?kv[1].trim().toLowerCase():null;
        if(key==="nome"){ r.nome=kv[2].trim(); mode=null; return; }
        if(key==="porzionibase"||key==="porzioni"){ r.porzioniBase=parseInt(kv[2],10)||2; mode=null; return; }
        if(key==="categoria"){ r.categoria=kv[2].trim(); mode=null; return; }
        if(key==="tempo"){ r.tempo=kv[2].trim(); mode=null; return; }
        if(key==="tag"){ r.tag=kv[2].split(",").map(x=>x.trim()).filter(Boolean); mode=null; return; }
        if(key==="ingredienti"){ mode="ing"; if(kv[2].trim()) pushIng(r, kv[2], errors, bi); return; }
        if(key==="istruzioni"){ mode="ist"; if(kv[2].trim()) r.istruzioni.push(kv[2].trim().replace(/^\d+[\).]\s*/,"")); return; }
        if(key==="note"){ mode="note"; r.note=kv[2].trim(); return; }
        if(key==="fonte"){ r.fonte=kv[2].trim(); mode=null; return; }
        // riga dentro una sezione
        if(mode==="ing"){ pushIng(r, line, errors, bi); }
        else if(mode==="ist"){ r.istruzioni.push(line.replace(/^\d+[\).]\s*/,"")); }
        else if(mode==="note"){ r.note += (r.note?" ":"")+line; }
      });
      if(!r.nome){ errors.push({block:bi+1, msg:"Blocco senza 'Nome', ignorato"}); return; }
      recipes.push(r);
    });
    return { recipes, errors };
  }
  function pushIng(r, line, errors, bi){
    const ing=parseIngredientLine(line);
    if(ing) r.ingredienti.push(ing);
    else errors.push({block:bi+1, msg:"Ingrediente non valido: "+line});
  }

  // ---- calendario.txt: "data/rrule | TIPO | TITOLO | NOTE | OPZIONI" ----
  const CAL_TYPES=["SCADENZA","TODO","COMPLEANNO","ANNIVERSARIO","EVENTO","FESTA","OSPITI","ASSENZA"];
  function calOpts(str){
    const o={remind:null, prio:null, delta:null, giorno:null, weekday:null};
    if(!str) return o;
    str.split(";").forEach(seg=>seg.trim().split(/\s+/).forEach(tok=>{
      let m;
      if(m=tok.match(/^REMIND:(\d{1,2}:\d{2})$/i)) o.remind=m[1];
      else if(m=tok.match(/^PRIO:(bassa|media|alta)$/i)) o.prio=m[1].toLowerCase();
      else if(m=tok.match(/^GIORNO:(.+)$/i)) o.giorno=m[1];
      else if(m=tok.match(/^WEEKDAY:(MON|TUE|WED|THU|FRI|SAT|SUN)$/i)) o.weekday=m[1].toUpperCase();
      else if(m=tok.match(/^([+-]\d+)$/)) o.delta=parseInt(m[1],10);
      else if(m=tok.match(/^PASTO:(pranzo|cena|entrambi)$/i)) o.pasto=m[1].toLowerCase();
    }));
    return o;
  }
  function calendario(text){
    const events=[], todos=[], errors=[];
    text.replace(/\r/g,"").split("\n").forEach((raw,i)=>{
      const line=raw.trim(); if(!line || line.startsWith("#")) return;
      const p=line.split("|").map(x=>x.trim());
      if(p.length<3){ errors.push({line:i+1, raw:line, msg:"Servono almeno: data/rrule | TIPO | TITOLO"}); return; }
      const first=p[0], tipo=(p[1]||"").toUpperCase(), titolo=p[2], note=p[3]||"", opts=p[4]||"";
      if(!CAL_TYPES.includes(tipo)){ errors.push({line:i+1, raw:line, msg:"TIPO non valido: "+p[1]}); return; }
      if(!titolo){ errors.push({line:i+1, raw:line, msg:"Titolo mancante"}); return; }
      const o=calOpts(opts);
      const ev={type:tipo, titolo, note:note||undefined};
      if(o.remind) ev.remind=o.remind;
      if(o.prio) ev.prio=o.prio;
      if(o.delta!=null) ev.deltaPersone=o.delta;
      if(o.pasto) ev.pasto=o.pasto;
      if(/^RRULE:/i.test(first)){
        const freq=(first.split(":")[1]||"").toUpperCase();
        if(!["ANNUALE","MENSILE","SETTIMANALE"].includes(freq)){ errors.push({line:i+1, raw:line, msg:"Frequenza RRULE non valida: "+freq}); return; }
        let day = freq==="SETTIMANALE" ? o.weekday : o.giorno;
        if(!day){ errors.push({line:i+1, raw:line, msg:"Manca "+(freq==="SETTIMANALE"?"WEEKDAY":"GIORNO")+" per la RRULE"}); return; }
        ev.date=null; ev.rrule={freq, day};
      } else {
        if(!/^\d{4}-\d{2}-\d{2}$/.test(first)){ errors.push({line:i+1, raw:line, msg:"Data non valida (usa YYYY-MM-DD): "+first}); return; }
        ev.date=first;
      }
      if(tipo==="TODO") todos.push({titolo, data:ev.date||null, prio:o.prio||"media", note:note||""});
      else events.push(ev);
    });
    return { events, todos, errors };
  }

  // ---- todo.txt: "TITOLO | DATA | PRIORITÀ | NOTE" ----
  function todo(text){
    const todos=[], errors=[];
    text.replace(/\r/g,"").split("\n").forEach((raw,i)=>{
      const line=raw.trim(); if(!line || line.startsWith("#")) return;
      const p=line.split("|").map(x=>x.trim());
      const titolo=p[0];
      if(!titolo){ errors.push({line:i+1, raw:line, msg:"Titolo mancante"}); return; }
      const data=p[1]||"";
      if(data && !/^\d{4}-\d{2}-\d{2}$/.test(data)){ errors.push({line:i+1, raw:line, msg:"Data non valida: "+data}); return; }
      const prio=(p[2]||"").toLowerCase();
      if(prio && !["bassa","media","alta"].includes(prio)){ errors.push({line:i+1, raw:line, msg:"Priorità non valida: "+p[2]}); return; }
      todos.push({titolo, data:data||null, prio:prio||"media", note:p[3]||""});
    });
    return { todos, errors };
  }

  // ---- impostazioni.txt: "Chiave: Valore" (case-insensitive, # commenti) ----
  const SET_MAP={ tema:"theme", coloreaccento:"accent", scalafont:"fontScale", porzionidefault:"defaultServings",
    promemoriadefault:"defaultReminder", sogliaurgenzagiorni:"urgencyDays", escludicondimenti:"deprecateCondimenti",
    reparti:"departments", unitapreferite:"unitPrefs", conversioniauto:"conversioniAuto",
    intestazionicompatte:"compactHeaders", notifichesistema:"notificationsEnabled", ignoraingredienti:"ignoreIngredients",
    aliasreparti:"repartiAlias" };
  function impostazioni(text){
    const patch={}, applied=[], errors=[];
    text.replace(/\r/g,"").split("\n").forEach((raw,i)=>{
      const line=raw.trim(); if(!line || line.startsWith("#")) return;
      const idx=line.indexOf(":");
      if(idx<0){ errors.push({line:i+1, raw:line, msg:"Formato 'Chiave: Valore' non riconosciuto"}); return; }
      const rawKey=line.slice(0,idx).trim(), key=rawKey.toLowerCase(), val=line.slice(idx+1).trim();
      const target=SET_MAP[key];
      if(!target){ errors.push({line:i+1, raw:line, msg:"Chiave non supportata: "+rawKey}); return; }
      let parsed;
      if(target==="theme") parsed=/scur|dark/i.test(val)?"dark":"light";
      else if(target==="fontScale"){ parsed=parseFloat(val.replace(",",".")); if(isNaN(parsed)){ errors.push({line:i+1, raw:line, msg:"ScalaFont non numerica"}); return; } }
      else if(target==="defaultServings"||target==="urgencyDays"){ parsed=parseInt(val,10); if(isNaN(parsed)){ errors.push({line:i+1, raw:line, msg:"Valore non numerico"}); return; } }
      else if(["deprecateCondimenti","conversioniAuto","compactHeaders","notificationsEnabled"].includes(target)) parsed=/^(true|si|sì|1|on)$/i.test(val);
      else if(target==="repartiAlias"){
        parsed={};
        val.split(",").forEach(pair=>{ const [a,b]=pair.split("=").map(x=>(x||"").trim()); if(a&&b) parsed[a]=b; });
      }
      else if(["departments","unitPrefs","ignoreIngredients"].includes(target)){ parsed=val.split(",").map(x=>x.trim()).filter(Boolean); if(target==="ignoreIngredients") parsed=parsed.map(x=>x.toLowerCase()); }
      else parsed=val;
      patch[target]=parsed; applied.push({key:rawKey, value:val});
    });
    return { patch, applied, errors };
  }

  // ---- lista_base_spesa.txt: "## Reparto" poi una voce per riga ("- nome | 1 L", la quantità è facoltativa) ----
  function listabase(text){
    const items=[], errors=[]; let reparto="";
    text.replace(/^\uFEFF/,"").replace(/\r/g,"").split("\n").forEach((raw,i)=>{
      const line=raw.trim(); if(!line || line.startsWith("#!")) return;
      const h=line.match(/^#{1,3}\s*(.+)$/);
      if(h){ reparto=h[1].trim(); return; }
      const ing=parseIngredientLine(line);
      if(!ing){ errors.push({line:i+1, raw:line, msg:"Riga non riconosciuta"}); return; }
      if(!reparto){ errors.push({line:i+1, raw:line, msg:"Voce prima di un titolo '## Reparto'"}); return; }
      items.push({ nome:ing.nome, qty:ing.qty, unita:ing.unita==="qb"?"pz":ing.unita, reparto });
    });
    return { items, errors };
  }

  return { ricette, calendario, todo, impostazioni, listabase };
})();

/* ---------------------------------------------------------------------------
   MODULO: Router  — gestione viste + scorciatoie tastiera
--------------------------------------------------------------------------- */
const Router = (function(){
  const routes = {};
  let current = null;
  function register(name, renderFn){ routes[name] = renderFn; }
  function go(name){
    if(!routes[name]) name = "planner";
    current = name;
    const root = document.getElementById("view-root");
    root.innerHTML = "";
    const hw = document.getElementById("hdr-week"); if(hw) hw.innerHTML = "";
    const el = routes[name]();
    if(el) root.appendChild(el);
    // aggiorna stato nav
    document.querySelectorAll("[data-nav]").forEach(b=>{
      const active = b.getAttribute("data-nav")===name;
      if(active) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    window.scrollTo(0,0);
  }
  function currentName(){ return current; }
  return { register, go, currentName };
})();

/* Lista reparti riordinabile via drag&drop nativo + rinomina inline */
function renderDeptList(ul){
  const depts = Store.get().settings.departments;
  ul.innerHTML = "";
  depts.forEach((name, idx)=>{
    const li = document.createElement("li");
    li.draggable = true; li.dataset.idx = idx;
    li.innerHTML = `
      <span class="grip" aria-hidden="true" title="Trascina">⠿</span>
      <input type="text" value="${escapeAttr(name)}" aria-label="Nome reparto">
      <button class="btn btn-ghost btn-icon btn-sm" data-del aria-label="Rimuovi ${escapeAttr(name)}">🗑️</button>`;
    // rinomina
    li.querySelector("input").addEventListener("change", e=>{
      const v = e.target.value.trim(); if(!v){ e.target.value=name; return; }
      Store.update(db=>{ db.settings.departments[idx]=v; });
    });
    // elimina
    li.querySelector("[data-del]").addEventListener("click", ()=>{
      Store.update(db=>{ db.settings.departments.splice(idx,1); });
      renderDeptList(ul);
    });
    // drag&drop
    li.addEventListener("dragstart", e=>{ li.classList.add("dragging"); e.dataTransfer.setData("text/plain", idx); e.dataTransfer.effectAllowed="move"; });
    li.addEventListener("dragend", ()=>li.classList.remove("dragging"));
    li.addEventListener("dragover", e=>{ e.preventDefault(); li.classList.add("dragover"); });
    li.addEventListener("dragleave", ()=>li.classList.remove("dragover"));
    li.addEventListener("drop", e=>{
      e.preventDefault(); li.classList.remove("dragover");
      const from = Number(e.dataTransfer.getData("text/plain")); const to = idx;
      if(from===to) return;
      Store.update(db=>{ const a=db.settings.departments; const [m]=a.splice(from,1); a.splice(to,0,m); });
      renderDeptList(ul);
    });
    ul.appendChild(li);
  });
}

}

let plannerMonday = DateUtils.getMonday(new Date());

/* ---- giorni visibili della settimana (5 o 7, da Impostazioni) ---- */
const DAY_NAMES=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
function dayName(d){ return DAY_NAMES[(d.getDay()+6)%7]; }
function plannerDays(monday){ const n=(Store.get().settings.weekDays===5)?5:7; return Array.from({length:n},(_,i)=>DateUtils.addDays(monday,i)); }

/* ---- barra settimana nell'header (usata da Planner e Spesa) ---- */
function mountWeekNav(route){
  const host=document.getElementById("hdr-week"); if(!host) return;
  const monday=plannerMonday, days=plannerDays(monday), last=days[days.length-1];
  const weekKey=DateUtils.isoWeekKey(monday);
  host.innerHTML=`
    <button class="btn btn-icon" id="wk-prev" aria-label="Settimana precedente">←</button>
    <button class="btn" id="wk-today" title="Vai alla settimana corrente">Oggi</button>
    <button class="btn btn-icon" id="wk-next" aria-label="Settimana successiva">→</button>
    <label class="week-label" for="wk-date">Sett. ${weekKey.split("-")[1]}<small>${DateUtils.fmtShort(monday)} – ${DateUtils.fmtShort(last)}</small></label>
    <input type="date" id="wk-date" aria-label="Vai alla settimana della data" value="${DateUtils.ymd(monday)}">`;
  host.querySelector("#wk-prev").addEventListener("click",()=>{ plannerMonday=DateUtils.addDays(plannerMonday,-7); Router.go(route); });
  host.querySelector("#wk-next").addEventListener("click",()=>{ plannerMonday=DateUtils.addDays(plannerMonday,7); Router.go(route); });
  host.querySelector("#wk-today").addEventListener("click",()=>{ plannerMonday=DateUtils.getMonday(new Date()); Router.go(route); });
  host.querySelector("#wk-date").addEventListener("change",e=>{ if(e.target.value){ plannerMonday=DateUtils.getMonday(DateUtils.parseYmd(e.target.value)); Router.go(route); } });
}

/* ---- scadenze dei prossimi N giorni (eventi + to-do), ordinate per data ---- */
function upcomingItems(daysAhead){
  const t=DateUtils.today(), out=[];
  Events.all().forEach(e=>{
    const d=e.date?DateUtils.parseYmd(e.date):Calendar.nextOccurrence(e); if(!d) return;
    const diff=DateUtils.diffDays(t,d);
    if(diff>=0 && diff<=daysAhead) out.push({kind:e.type, titolo:e.titolo, date:d, diff});
  });
  Todos.all().forEach(td=>{
    if(td.done||!td.data) return;
    const d=DateUtils.parseYmd(td.data), diff=DateUtils.diffDays(t,d);
    if(diff<=daysAhead) out.push({kind:"TODO", titolo:td.titolo, date:d, diff});
  });
  return out.sort((a,b)=>a.diff-b.diff);
}
/* Striscia scadenze: chip statici scorrevoli a dito (niente testo che corre da solo) */
function buildTicker(){
  const items=upcomingItems(14);
  const el=document.createElement("div"); el.className="ticker"; el.setAttribute("aria-label","Scadenze dei prossimi 14 giorni");
  let html=`<span class="tk-label">Prossimi 14 giorni</span>`;
  if(!items.length) html+=`<span class="text-xs text-mute">nessuna scadenza</span>`;
  else html+=items.map(it=>{ const c=countdown(it.date); return `<button type="button" class="chip tk-chip ${c.level}" title="${escapeAttr(it.kind)} · ${DateUtils.fmtLong(it.date)}">${escapeHtml(it.titolo)}<span class="tk-when">${escapeHtml(c.label.toLowerCase())}</span></button>`; }).join("");
  el.innerHTML=html;
  el.querySelectorAll(".tk-chip").forEach(b=>b.addEventListener("click",()=>Router.go("checklist")));
  return el;
}

function buildMealCell(weekKey, ds, which, compact){

  const slot=(week[ds] && week[ds][which]) || null;
  const people=Plan.peopleFor(weekKey, ds, s.defaultServings, which);
  const isSet=Plan.peopleOverride(weekKey, ds, which)!=null;
  const wrap=document.createElement("div"); wrap.className="meal-wrap"+(compact?" compact":"");
  const cell=document.createElement("button"); cell.type="button";
  if(slot && slot.recipeId){
    const r=Recipes.byId(slot.recipeId); const nm=r?r.nome:"(ricetta rimossa)";
    cell.className="meal-cell";
    cell.innerHTML=`<div class="m-title" title="${escapeAttr(nm)}">${escapeHtml(nm)}</div><div class="m-sub">ricetta${r&&r.tempo?" · "+escapeHtml(r.tempo):""}</div>`;
  } else if(slot && slot.manualText){
    cell.className="meal-cell";
    cell.innerHTML=`<div class="m-title" title="${escapeAttr(slot.manualText)}">${escapeHtml(slot.manualText)}</div><div class="m-sub">pasto libero</div>`;
  } else {
    cell.className="meal-cell is-empty"; cell.textContent=compact?("+ "+(which==="pranzo"?"Pranzo":"Cena")):"+ Aggiungi";
  }
  cell.setAttribute("aria-label", `${which==="pranzo"?"Pranzo":"Cena"} del ${DateUtils.fmtShort(DateUtils.parseYmd(ds))}`);
  cell.addEventListener("click",()=>openMealModal(weekKey, ds, which, people));
  const pp=document.createElement("button"); pp.type="button";
  pp.className="m-people"+(isSet?" is-set":"")+(people>=3?" many":"");
  pp.title=`Persone a ${which}: ${people}${isSet?" (impostate a mano)":" (automatico)"} · tocca per cambiare`;
  pp.setAttribute("aria-label", pp.title);
  pp.innerHTML=`👥 ${people}`;
  pp.addEventListener("click",e=>{ e.stopPropagation(); openMealPeople(pp, weekKey, ds, which); });
  wrap.appendChild(cell); wrap.appendChild(pp);
  return wrap;
}

/* ---- cella Impegni & Note del giorno: eventi del calendario + nota libera ---- */
function buildImpegniCell(weekKey, ds, compact){
  const week=Plan.week(weekKey);
  const evs=Events.all().filter(e=>Calendar.occursOn(e, ds));
  const wrap=document.createElement("div"); wrap.className="imp-cell"+(compact?" compact":"");
  const list=document.createElement("div"); list.className="imp-list";
  evs.forEach(e=>{
    const row=document.createElement("button"); row.type="button"; row.className="imp-row";
    const dp=(typeof e.deltaPersone==="number" && e.deltaPersone!==0) ? e.deltaPersone : 0;
    const tag=dp ? `<span class="chip ${dp>0?'chip-accent':'chip-danger'}">${e.pasto&&e.pasto!=="entrambi"?e.pasto+" ":""}${dp>0?"+":""}${dp}</span>` : "";
    row.innerHTML=`<span class="imp-dot ${dp>0?'plus':dp<0?'minus':''}"></span><span class="imp-title" title="${escapeAttr(e.titolo)}">${escapeHtml(e.titolo)}</span>${tag}`;
    row.addEventListener("click",()=>openEventEditor(e, null, {onSaved:()=>Router.go("planner")}));
    list.appendChild(row);
  });
  const add=document.createElement("button"); add.type="button"; add.className="imp-add"; add.textContent="+ Impegno";
  add.addEventListener("click",()=>openEventEditor(null, "EVENTO", {date:ds, onSaved:()=>Router.go("planner")}));
  wrap.appendChild(list);
  if(!compact){
    list.appendChild(add);
    const ta=document.createElement("textarea"); ta.className="imp-note"; ta.rows=2;
    ta.value=(week[ds] && week[ds].note)||""; ta.placeholder="Note…"; ta.setAttribute("aria-label","Note del "+DateUtils.fmtShort(DateUtils.parseYmd(ds)));
    ta.addEventListener("input", debounce(()=>Plan.setNote(weekKey, ds, ta.value), 400));
    wrap.appendChild(ta);
  } else {
    const note=(week[ds] && week[ds].note)||"";
    const nb=document.createElement("button"); nb.type="button"; nb.className="imp-notebtn"+(note?"":" is-empty");
    nb.textContent=note||"+ Nota"; nb.title=note||"Aggiungi una nota";
    nb.addEventListener("click",()=>openNoteEditor(weekKey, ds));
    const actions=document.createElement("div"); actions.className="imp-actions";
    actions.appendChild(add); actions.appendChild(nb);
    wrap.appendChild(actions);
  }
  return wrap;
}
function openNoteEditor(weekKey, ds){
  const cur=(Plan.week(weekKey)[ds]||{}).note||"";
  Modal.open({ title:"Note · "+dayName(DateUtils.parseYmd(ds))+" "+DateUtils.fmtShort(DateUtils.parseYmd(ds)),
    bodyHTML:`<div class="field"><textarea id="nt-txt" rows="4" placeholder="Note del giorno…">${escapeHtml(cur)}</textarea></div>`,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-save>Salva</button>`,
    onMount(dialog, close){
      dialog.querySelector("[data-save]").addEventListener("click",()=>{ Plan.setNote(weekKey, ds, dialog.querySelector("#nt-txt").value); close(); Router.go("planner"); });
    }});
}

function renderPlanner(){
  const db=Store.get(), s=db.settings;
  const monday=plannerMonday;
  const weekKey=DateUtils.isoWeekKey(monday);
  const days=plannerDays(monday);
  const todayStr=DateUtils.ymd(DateUtils.today());
  const layout=(s.plannerLayout==="affiancato")?"affiancato":"griglia";

  mountWeekNav("planner");

  const el=document.createElement("div");
  el.className="view planner-view layout-"+layout;

  // ---- testata: persone di oggi, disposizione, stampa, spesa ----
  const head=document.createElement("div"); head.className="view-head planner-head";
  const twk=DateUtils.isoWeekKey(DateUtils.today());
  const tp=Plan.peopleFor(twk, todayStr, s.defaultServings, "pranzo"), tc=Plan.peopleFor(twk, todayStr, s.defaultServings, "cena");
  head.innerHTML=`
    <span class="chip chip-accent tk-today" title="Oggi ${DateUtils.fmtLong(DateUtils.today())} · persone a pranzo e a cena (base ${s.defaultServings})">👥 Oggi ${tp} · ${tc}</span>
    <div class="tk-slot"></div>
    <div class="flex gap-2 items-center" style="flex:none">
      <button class="btn btn-sm" id="wk-layout" title="Cambia disposizione (anche in Impostazioni)">⇄ ${layout==="griglia"?"Affianca la spesa":"Griglia a colonne"}</button>
      <button class="btn btn-sm" id="wk-print" title="Stampa settimana">🖨️ Stampa</button>
      ${layout==="griglia"?`<button class="btn btn-sm btn-primary" id="wk-shop">🛒 Spesa</button>`:""}
    </div>`;
  head.querySelector(".tk-slot").replaceWith(buildTicker());
  el.appendChild(head);

  if(layout==="griglia"){
    // ======== LAYOUT A: settimana a colonne ========
    const scroll=document.createElement("div"); scroll.className="planner-scroll";
    const grid=document.createElement("div"); grid.className="planner-grid"; grid.style.setProperty("--days", days.length);
    grid.appendChild(document.createElement("div")); // angolo
    days.forEach(d=>{
      const ds=DateUtils.ymd(d);
      const dh=document.createElement("div");
      dh.className="pg-day"+(ds===todayStr?" is-today":"");
      dh.draggable=true; dh.dataset.date=ds;
      dh.innerHTML=`<div class="d-name"><span class="d-wd">${dayName(d)}</span><span class="d-num">${d.getDate()}</span></div>
        ${ds===todayStr?'<span class="chip chip-accent d-today">Oggi</span>':''}
        <button class="d-menu-btn" aria-label="Azioni per ${dayName(d)} ${d.getDate()}" title="Azioni giorno">⋯</button>`;
      dh.querySelector(".d-menu-btn").addEventListener("click",(e)=>{ e.stopPropagation(); openDayMenu(e.currentTarget, weekKey, ds, days); });
      dh.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",ds); e.dataTransfer.effectAllowed="move"; });
      dh.addEventListener("dragover",e=>{ e.preventDefault(); dh.classList.add("dragover"); });
      dh.addEventListener("dragleave",()=>dh.classList.remove("dragover"));
      dh.addEventListener("drop",e=>{ e.preventDefault(); dh.classList.remove("dragover"); const from=e.dataTransfer.getData("text/plain"); if(!from||from===ds) return; Plan.moveDay(weekKey, from, ds); Toast.show("Giorno spostato","ok"); Router.go("planner"); });
      grid.appendChild(dh);
    });
    [["pranzo","Pranzo","🍝"],["cena","Cena","🌙"]].forEach(([key,label,ico])=>{
      const lab=document.createElement("div"); lab.className="pg-rowlabel";
      lab.innerHTML=`<span class="rl-letter" title="${label}" aria-label="${label}">${ico}</span>`; grid.appendChild(lab);
      days.forEach(d=>grid.appendChild(buildMealCell(weekKey, DateUtils.ymd(d), key, false)));
    });
    const il=document.createElement("div"); il.className="pg-rowlabel"; il.innerHTML=`<span class="rl-letter" title="Impegni e note" aria-label="Impegni e note">📌</span>`; grid.appendChild(il);
    days.forEach(d=>grid.appendChild(buildImpegniCell(weekKey, DateUtils.ymd(d), false)));
    scroll.appendChild(grid); el.appendChild(scroll);
  } else {
    // ======== LAYOUT C: giorni a righe + lista spesa affiancata ========
    const split=document.createElement("div"); split.className="planner-split";
    const rows=document.createElement("div"); rows.className="pl-rows";
    days.forEach(d=>{
      const ds=DateUtils.ymd(d);
      const row=document.createElement("div"); row.className="pl-row"+(ds===todayStr?" is-today":"");
      const dc=document.createElement("div"); dc.className="pl-day";
      dc.innerHTML=`<span class="d-wd">${dayName(d)}</span><span class="d-num">${d.getDate()}</span><button class="d-menu-btn" aria-label="Azioni per ${dayName(d)} ${d.getDate()}" title="Azioni giorno">⋯</button>`;
      dc.querySelector(".d-menu-btn").addEventListener("click",(e)=>{ e.stopPropagation(); openDayMenu(e.currentTarget, weekKey, ds, days); });
      row.appendChild(dc);
      const meals=document.createElement("div"); meals.className="pl-meals";
      meals.appendChild(buildMealCell(weekKey, ds, "pranzo", true));
      meals.appendChild(buildMealCell(weekKey, ds, "cena", true));
      row.appendChild(meals);
      row.appendChild(buildImpegniCell(weekKey, ds, true));
      rows.appendChild(row);
    });
    split.appendChild(rows);
    split.appendChild(buildShoppingPanel(weekKey));
    el.appendChild(split);
  }

  head.querySelector("#wk-layout").addEventListener("click",()=>{ setSetting("plannerLayout", layout==="griglia"?"affiancato":"griglia"); Router.go("planner"); });
  head.querySelector("#wk-print").addEventListener("click",()=>printWeek(weekKey, monday, days));
  const sh=head.querySelector("#wk-shop"); if(sh) sh.addEventListener("click",()=>Router.go("spesa"));
  return el;
}

/* Menu azioni giorno (popover) */
function openDayMenu(anchor, weekKey, dateStr, days){
  const others=days.filter(d=>DateUtils.ymd(d)!==dateStr);
  const dupBtns=others.map(d=>`<button data-dup="${DateUtils.ymd(d)}">📋 ${dayName(d)} ${d.getDate()}</button>`).join("");
  const html=`
    <small>Azioni giorno</small>
    <button data-act="print">🖨️ Stampa giorno</button>
    <button data-act="clear">🧹 Svuota giorno</button>
    <div class="sep"></div>
    <small>Duplica su…</small>
    ${dupBtns}`;
  openPopover(anchor, html, (pop,close)=>{
    pop.querySelector('[data-act="clear"]').addEventListener("click", async ()=>{
      close();
      const ok=await Modal.confirm({title:"Svuota giorno", message:"Rimuovere pranzo, cena e note di questo giorno?", confirmLabel:"Svuota", danger:true});
      if(ok){ Plan.clearDay(weekKey, dateStr); Toast.show("Giorno svuotato"); Router.go("planner"); }
    });
    pop.querySelector('[data-act="print"]').addEventListener("click",()=>{ close(); printDay(weekKey, dateStr); });
    pop.querySelectorAll("[data-dup]").forEach(b=>b.addEventListener("click",()=>{
      close(); Plan.copyDay(weekKey, dateStr, b.dataset.dup); Toast.show("Giorno duplicato","ok"); Router.go("planner");
    }));
  });
}

/* Editor rapido delle persone di UN pasto (+/− con ritorno all'automatico) */
function openMealPeople(anchor, weekKey, ds, which){
  const base=Store.get().settings.defaultServings;
  const comp=Calendar.composition(ds, base, which);
  const isSet=Plan.peopleOverride(weekKey, ds, which)!=null;
  const cur=Plan.peopleFor(weekKey, ds, base, which);
  const html=`
    <small>Persone a ${which} · ${dayName(DateUtils.parseYmd(ds))} ${DateUtils.parseYmd(ds).getDate()}</small>
    <div style="display:flex;align-items:center;gap:12px;justify-content:center;padding:8px 12px">
      <button class="btn btn-icon" data-m aria-label="Meno">−</button>
      <strong id="dp-val" style="min-width:2ch;text-align:center;font-size:var(--fs-xl)">${cur}</strong>
      <button class="btn btn-icon" data-p aria-label="Più">+</button>
    </div>
    <button data-auto>↺ Automatico (${comp.total})</button>
    <small style="padding:4px 10px 2px">Base ${comp.base}${comp.plus?` +${comp.plus} ospiti`:""}${comp.minus?` −${comp.minus} assenze`:""}${comp.contributi.length?" · "+comp.contributi.map(c=>c.titolo).join(", "):""}</small>`;
  let changed=false;
  openPopover(anchor, html, (pop, close)=>{
    let v=cur;
    const val=pop.querySelector("#dp-val");
    const apply=n=>{ v=Math.max(1,Math.min(30,n)); val.textContent=v; Plan.setPeople(weekKey, ds, which, v); changed=true; };
    pop.querySelector("[data-m]").addEventListener("click",()=>apply(v-1));
    pop.querySelector("[data-p]").addEventListener("click",()=>apply(v+1));
    pop.querySelector("[data-auto]").addEventListener("click",()=>{ Plan.setPeople(weekKey, ds, which, null); changed=true; close(); });
  }, ()=>{ if(changed) Router.go("planner"); });
}

/* ---------------------------------------------------------------------------
   MODALE PASTO: autocomplete ricette, scaling porzioni, checklist Ce l'ho/Manca
--------------------------------------------------------------------------- */
function openMealModal(weekKey, dateStr, which, people){
  const existing = Plan.slot(weekKey, dateStr, which) || {};
  const autoServ = Calendar.peopleForDate(dateStr, Store.get().settings.defaultServings, which);
  const state = {
    recipeId: existing.recipeId||null,
    manualText: existing.manualText||"",
    serv: people,                       // persone a tavola per QUESTO pasto
    have: (existing.have||[]).slice()
  };
  const d=DateUtils.parseYmd(dateStr);
  const slotLabel = which==="pranzo"?"🍝 Pranzo":"🌙 Cena";
  const initName = state.recipeId ? (Recipes.byId(state.recipeId)?.nome||"") : (state.manualText||"");

  const body=`
    <p class="text-mute text-sm mb-3">${slotLabel} · ${["Lun","Mar","Mer","Gio","Ven","Sab","Dom"][((d.getDay()+6)%7)]} ${DateUtils.fmtLong(d)} · 👥 ${people} a tavola</p>
    <div class="field ac-wrap">
      <label for="meal-input">Cosa si mangia?</label>
      <input type="text" id="meal-input" autocomplete="off" placeholder="Cerca ricetta o scrivi liberamente…" value="${escapeAttr(initName)}" autofocus>
      <p class="help">Scegli una ricetta per calcolare porzioni e ingredienti, oppure scrivi testo libero.</p>
    </div>
    <div id="meal-detail"></div>`;
  const foot=`
    ${(state.recipeId||state.manualText)?'<button class="btn btn-danger" data-remove style="margin-right:auto">Rimuovi</button>':''}
    <button class="btn" data-close>Annulla</button>
    <button class="btn btn-primary" data-save>Salva</button>`;

  Modal.open({
    title:"Pasto", bodyHTML:body, footHTML:foot,
    onMount(dialog, close){
      const input=dialog.querySelector("#meal-input");
      const detail=dialog.querySelector("#meal-detail");

      function renderDetail(){
        if(state.recipeId){
          const r=Recipes.byId(state.recipeId);
          if(!r){ detail.innerHTML=`<p class="text-mute">Ricetta non trovata.</p>`; return; }
          const serv = state.serv;
          const factor = Scale.factorFor(r, serv);
          const ings=(r.ingredienti||[]).map(ing=>Scale.ingredient(ing, factor));
          detail.innerHTML=`
            <div class="card" style="background:var(--surface-2)">
              <div class="flex items-center justify-between gap-3 mb-3">
                <div>
                  <div class="font-bold">${escapeHtml(r.nome)}</div>
                  <div class="text-xs text-mute">${escapeHtml(r.categoria||"")}${r.tempo?" · "+escapeHtml(r.tempo):""} · base ${r.porzioniBase} porz.</div>
                </div>
                <div style="text-align:right">
                  <label for="meal-serv" class="mb-1">Persone a tavola</label>
                  <input type="number" id="meal-serv" min="1" max="30" value="${serv}" style="width:84px">
                  <div class="help" style="margin-top:2px">auto: ${autoServ}${state.serv!==autoServ?` · <button type="button" class="btn btn-ghost btn-sm" data-reset-serv style="padding:0 4px;min-height:auto">ripristina</button>`:""}</div>
                </div>
              </div>
              <p class="text-sm font-semi mb-2">Ingredienti — spunta “Ce l'ho”, il resto va in lista spesa</p>
              <ul class="ing-list">
                ${ings.map((ing,idx)=>{
                  const has=state.have.includes(ing.nome);
                  const qb=(ing.qtyScaled==null);
                  return `<li class="${has?'has-it':''}" data-ing="${escapeAttr(ing.nome)}">
                    <span class="ing-name">${escapeHtml(ing.nome)} ${qb?'<span class="qb-tag">(qb)</span>':''}</span>
                    <span class="ing-qty">${qb?'':escapeHtml(ing.display)}</span>
                    <label class="ing-have"><input type="checkbox" ${has?'checked':''} data-have><span>Ce l'ho</span></label>
                  </li>`;
                }).join("")}
              </ul>
            </div>`;
          const servInput=detail.querySelector("#meal-serv");
          servInput.addEventListener("change",()=>{
            state.serv=clampInt(servInput.value,1,30,autoServ);
            renderDetail();
          });
          const rs=detail.querySelector("[data-reset-serv]");
          if(rs) rs.addEventListener("click",()=>{ state.serv=autoServ; renderDetail(); });
          detail.querySelectorAll("[data-have]").forEach(cb=>{
            cb.addEventListener("change",()=>{
              const li=cb.closest("li"); const name=li.dataset.ing;
              if(cb.checked){ if(!state.have.includes(name)) state.have.push(name); li.classList.add("has-it"); }
              else { state.have=state.have.filter(x=>x!==name); li.classList.remove("has-it"); }
            });
          });
        } else if(input.value.trim()){
          detail.innerHTML=`<p class="text-mute text-sm">Nessuna ricetta collegata: verrà salvato come <strong>pasto libero</strong> (non genera lista spesa).</p>`;
        } else {
          detail.innerHTML="";
        }
      }

      attachAutocomplete(input, {
        onText(val){ // se l'utente riscrive, scollega la ricetta
          if(state.recipeId){ const r=Recipes.byId(state.recipeId); if(!r||r.nome!==val){ state.recipeId=null; state.have=[]; } }
          state.manualText=val; renderDetail();
        },
        onSelect(r){ state.recipeId=r.id; state.manualText=""; state.have=[]; input.value=r.nome; renderDetail(); },
        onCreate(text){ openRecipeEditor({nome:text}, (rec)=>{ state.recipeId=rec.id; state.manualText=""; state.have=[]; input.value=rec.nome; renderDetail(); }); }
      });
      renderDetail();

      const rm=dialog.querySelector("[data-remove]");
      if(rm) rm.addEventListener("click",()=>{ Plan.setSlot(weekKey,dateStr,which,null); close(); Toast.show("Pasto rimosso"); Router.go("planner"); });

      dialog.querySelector("[data-save]").addEventListener("click",()=>{
        const txt=input.value.trim();
        Plan.setPeople(weekKey, dateStr, which, state.serv===autoServ ? null : state.serv);
        if(state.recipeId){
          Plan.setSlot(weekKey,dateStr,which,{recipeId:state.recipeId, have:state.have});
          Recipes.bumpUse(state.recipeId);
        } else if(txt){
          Plan.setSlot(weekKey,dateStr,which,{recipeId:null, manualText:txt});
        } else {
          Plan.setSlot(weekKey,dateStr,which,null);
        }
        close(); Toast.show("Pasto salvato","ok"); Router.go("planner");
      });
    }
  });
}

/* ---------------------------------------------------------------------------
   VISTA: Ricette — elenco, ricerca, filtri
--------------------------------------------------------------------------- */
let recipeSearch="";
let recipeFilters={ categoria:"", veg:false };

function renderRecipes(){
  const el=document.createElement("div"); el.className="view";
  const cats=[...new Set(Recipes.all().map(r=>r.categoria).filter(Boolean))].sort();
  el.innerHTML=`
    <div class="view-head">
      <h1>Ricette</h1>
      <div class="flex gap-2 flex-wrap">
        <button class="btn" id="rec-import">📥 Importa</button>
        <button class="btn" id="rec-export">📤 Esporta</button>
        <button class="btn btn-primary" id="rec-new">+ Nuova</button>
      </div>
    </div>
    <div class="rec-toolbar">
      <input type="search" class="search" id="rec-search" placeholder="Cerca per nome, tag o ingrediente…" value="${escapeAttr(recipeSearch)}">
    </div>
    <div class="filterbar">
      <select id="rec-cat" style="width:auto">
        <option value="">Tutte le categorie</option>
        ${cats.map(c=>`<option ${recipeFilters.categoria===c?'selected':''}>${escapeHtml(c)}</option>`).join("")}
      </select>
      <label class="switch" style="margin-left:8px"><input type="checkbox" id="rec-veg" ${recipeFilters.veg?'checked':''}><span class="track"></span><span class="thumb"></span></label>
      <span class="text-sm text-soft">Solo vegetariane</span>
    </div>
    <div id="rec-list"></div>`;

  function draw(){
    const list=el.querySelector("#rec-list");
    let items=Recipes.all().slice();
    const q=recipeSearch.trim().toLowerCase();
    if(q) items=items.filter(r=>
      r.nome.toLowerCase().includes(q) ||
      (r.tag||[]).join(" ").toLowerCase().includes(q) ||
      (r.ingredienti||[]).some(i=>i.nome.toLowerCase().includes(q)));
    if(recipeFilters.categoria) items=items.filter(r=>r.categoria===recipeFilters.categoria);
    if(recipeFilters.veg) items=items.filter(r=>(r.tag||[]).some(t=>/veg/i.test(t)));
    items.sort((a,b)=>(b.useCount||0)-(a.useCount||0) || a.nome.localeCompare(b.nome));
    if(!items.length){
      list.innerHTML=`<div class="empty-state">${Recipes.all().length?'Nessun risultato con questi filtri.':'Nessuna ricetta: creane una o importa un file .txt/.json.'}</div>`;
      return;
    }
    const grid=document.createElement("div"); grid.className="rec-grid";
    items.forEach(r=>{
      const card=document.createElement("button"); card.type="button"; card.className="rec-card";
      card.innerHTML=`
        <div class="rc-title">${escapeHtml(r.nome)}</div>
        <div class="rc-meta">${escapeHtml(r.categoria||"—")}${r.tempo?" · "+escapeHtml(r.tempo):""} · ${r.porzioniBase} porz. · ${(r.ingredienti||[]).length} ingr.${r.useCount?` · usata ${r.useCount}×`:""}</div>
        <div class="rc-tags">${(r.tag||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>`;
      card.addEventListener("click",()=>openRecipeDetail(r.id));
      grid.appendChild(card);
    });
    list.innerHTML=""; list.appendChild(grid);
  }

  el.querySelector("#rec-search").addEventListener("input", debounce(e=>{ recipeSearch=e.target.value; draw(); },150));
  el.querySelector("#rec-cat").addEventListener("change",e=>{ recipeFilters.categoria=e.target.value; draw(); });
  el.querySelector("#rec-veg").addEventListener("change",e=>{ recipeFilters.veg=e.target.checked; draw(); });
  el.querySelector("#rec-new").addEventListener("click",()=>openRecipeEditor(null,()=>Router.go("ricette")));
  el.querySelector("#rec-import").addEventListener("click",openImportRecipes);
  el.querySelector("#rec-export").addEventListener("click",openExportRecipes);
  draw();
  return el;
}

/* ---------------------------------------------------------------------------
   DETTAGLIO RICETTA — scaling live + istruzioni step-by-step + azioni
--------------------------------------------------------------------------- */
function openRecipeDetail(id){
  const r=Recipes.byId(id); if(!r){ Toast.show("Ricetta non trovata","err"); return; }
  let serv=r.porzioniBase, step=0;
  const body=`
    <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
      <div class="serv-picker">
        <label class="mb-0" for="rd-serv">Porzioni</label>
        <button class="btn btn-icon btn-sm" data-serv="-1" aria-label="Diminuisci">−</button>
        <input type="number" id="rd-serv" min="1" max="30" value="${serv}">
        <button class="btn btn-icon btn-sm" data-serv="1" aria-label="Aumenta">+</button>
      </div>
      <span class="text-xs text-mute">base ${r.porzioniBase} porz.${r.tempo?" · "+escapeHtml(r.tempo):""}${r.categoria?" · "+escapeHtml(r.categoria):""}</span>
    </div>
    ${(r.tag||[]).length?`<div class="rc-tags mb-3">${r.tag.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>`:""}
    <h3 class="mb-2">Ingredienti</h3>
    <ul class="ing-list" id="rd-ings"></ul>
    <h3 class="mt-4 mb-2">Istruzioni</h3>
    <div class="step-view" id="rd-steps"></div>
    ${r.fonte?`<p class="text-xs text-mute mt-3">Fonte: ${/^https?:\/\//i.test(r.fonte)?`<a href="${escapeAttr(r.fonte)}" target="_blank" rel="noopener">${escapeHtml(r.fonte.replace(/^https?:\/\/(www\.)?/i,"").slice(0,60))}</a>`:escapeHtml(r.fonte)}</p>`:""}
    <div class="field mt-4"><label for="rd-note">Note</label><textarea id="rd-note" rows="2" placeholder="Aggiungi una nota…">${escapeHtml(r.note||'')}</textarea></div>`;
  const foot=`
    <button class="btn btn-ghost" data-del style="margin-right:auto" aria-label="Elimina ricetta">🗑️</button>
    <button class="btn" data-dup>Duplica</button>
    <button class="btn" data-edit>Modifica</button>
    <button class="btn" data-shop>→ Spesa</button>
    <button class="btn btn-primary" data-plan>+ Planner</button>`;
  Modal.open({ title:r.nome, size:"lg", bodyHTML:body, footHTML:foot, onMount(dialog,close){
    const servInput=dialog.querySelector("#rd-serv");
    function drawIngs(){
      const factor=Scale.factorFor(r, serv);
      dialog.querySelector("#rd-ings").innerHTML=(r.ingredienti||[]).map(ing=>{
        const sc=Scale.ingredient(ing,factor);
        return `<li><span class="ing-name">${escapeHtml(ing.nome)}${sc.qtyScaled==null?' <span class="qb-tag">(qb)</span>':''}</span><span class="ing-qty">${sc.qtyScaled==null?'':escapeHtml(sc.display)}</span></li>`;
      }).join("") || '<li class="text-mute">Nessun ingrediente</li>';
    }
    function drawSteps(){
      const steps=r.istruzioni||[]; const cont=dialog.querySelector("#rd-steps");
      if(!steps.length){ cont.innerHTML='<p class="text-mute mb-0">Nessuna istruzione.</p>'; return; }
      cont.innerHTML=`
        <div class="step-num">Passo ${step+1} di ${steps.length}</div>
        <div class="step-text">${escapeHtml(steps[step])}</div>
        <div class="flex gap-2">
          <button class="btn btn-sm" data-prev ${step===0?'disabled':''}>← Precedente</button>
          <button class="btn btn-sm btn-primary" data-next ${step===steps.length-1?'disabled':''}>Passo successivo →</button>
        </div>`;
      cont.querySelector("[data-prev]").addEventListener("click",()=>{ if(step>0){step--;drawSteps();} });
      cont.querySelector("[data-next]").addEventListener("click",()=>{ if(step<steps.length-1){step++;drawSteps();} });
    }
    drawIngs(); drawSteps();
    dialog.querySelectorAll("[data-serv]").forEach(b=>b.addEventListener("click",()=>{ serv=clampInt(serv+Number(b.dataset.serv),1,30,serv); servInput.value=serv; drawIngs(); }));
    servInput.addEventListener("change",()=>{ serv=clampInt(servInput.value,1,30,r.porzioniBase); servInput.value=serv; drawIngs(); });
    dialog.querySelector("#rd-note").addEventListener("change",e=>{ Store.update(db=>{ const x=db.recipes.find(z=>z.id===r.id); if(x) x.note=e.target.value; }); Toast.show("Nota salvata"); });
    dialog.querySelector("[data-edit]").addEventListener("click",()=>{ close(); openRecipeEditor(r, ()=>Router.go("ricette")); });
    dialog.querySelector("[data-dup]").addEventListener("click",()=>{
      const copy=JSON.parse(JSON.stringify(r)); copy.id=Recipes.genId(); copy.nome=r.nome+" (copia)"; copy.useCount=0;
      close(); openRecipeEditor(copy, ()=>Router.go("ricette"));
    });
    dialog.querySelector("[data-del]").addEventListener("click",async ()=>{
      const ok=await Modal.confirm({title:"Elimina ricetta", message:`Eliminare "${r.nome}"? L'operazione non è reversibile.`, confirmLabel:"Elimina", danger:true});
      if(ok){ Store.update(db=>{ db.recipes=db.recipes.filter(x=>x.id!==r.id); }); close(); Toast.show("Ricetta eliminata"); Router.go("ricette"); }
    });
    dialog.querySelector("[data-plan]").addEventListener("click",()=>{ close(); openAddToPlanner(r, serv); });
    dialog.querySelector("[data-shop]").addEventListener("click",()=>{ close(); openSendToShopping(r, serv); });
  }});
}

/* Aggiungi ricetta al planner (scegli giorno/slot della settimana corrente) */
function openAddToPlanner(r, serv){
  const monday=plannerMonday, weekKey=DateUtils.isoWeekKey(monday);
  const days=[0,1,2,3,4].map(i=>DateUtils.addDays(monday,i));
  const dayOpts=days.map(d=>`<option value="${DateUtils.ymd(d)}">${["Lun","Mar","Mer","Gio","Ven"][((d.getDay()+6)%7)]} ${d.getDate()} ${DateUtils.MESI[d.getMonth()]}</option>`).join("");
  Modal.open({ title:"Aggiungi al planner", bodyHTML:`
    <p class="text-sm text-mute mb-3"><strong>${escapeHtml(r.nome)}</strong> · settimana ${weekKey.split("-")[1]} · ${serv} porz.</p>
    <div class="field-row">
      <div class="field"><label for="ap-day">Giorno</label><select id="ap-day">${dayOpts}</select></div>
      <div class="field"><label for="ap-slot">Pasto</label><select id="ap-slot"><option value="pranzo">🍝 Pranzo</option><option value="cena">🌙 Cena</option></select></div>
    </div>`,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-ok>Aggiungi</button>`,
    onMount(dialog,close){
      dialog.querySelector("[data-ok]").addEventListener("click",()=>{
        const day=dialog.querySelector("#ap-day").value, slot=dialog.querySelector("#ap-slot").value;
        const people=Plan.peopleFor(weekKey, day, Store.get().settings.defaultServings);
        Plan.setSlot(weekKey, day, slot, {recipeId:r.id, overrideServings: serv!==people?serv:null, have:[]});
        Recipes.bumpUse(r.id);
        close(); Toast.show("Aggiunto al planner","ok");
      });
    }});
}

/* Invia (parte degli) ingredienti alla lista spesa della settimana corrente */
function openSendToShopping(r, serv){
  const weekKey=DateUtils.isoWeekKey(plannerMonday);
  const factor=Scale.factorFor(r, serv);
  const ings=(r.ingredienti||[]).map(ing=>Scale.ingredient(ing,factor)).filter(x=>x.qtyScaled!=null);
  Modal.open({ title:"Invia ingredienti alla spesa", bodyHTML:`
    <p class="text-sm text-mute mb-2">Seleziona cosa aggiungere (settimana ${weekKey.split("-")[1]}, ${serv} porz.). Le voci “qb” sono escluse.</p>
    <ul class="ing-list">${ings.length?ings.map((ing,i)=>`<li><label class="ing-have" style="flex:1;color:var(--text)"><input type="checkbox" data-i="${i}" checked> <span class="ing-name">${escapeHtml(ing.nome)}</span></label><span class="ing-qty">${escapeHtml(ing.display)}</span></li>`).join(""):'<li class="text-mute">Nessun ingrediente con quantità</li>'}</ul>`,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-ok>Aggiungi selezionati</button>`,
    onMount(dialog,close){
      dialog.querySelector("[data-ok]").addEventListener("click",()=>{
        const sel=[]; dialog.querySelectorAll("[data-i]").forEach(cb=>{ if(cb.checked){ const ing=ings[Number(cb.dataset.i)]; sel.push({nome:ing.nome, qty:ing.qtyScaled, unita:ing.unita, reparto:ing.reparto||Reparti.guess(ing.nome), provenienze:[{recipeId:r.id}]}); } });
        if(!sel.length){ close(); return; }
        Shopping.addExtra(weekKey, sel);
        close(); Toast.show(sel.length+" ingredienti aggiunti alla spesa","ok");
      });
    }});
}

/* ---------------------------------------------------------------------------
   EDITOR RICETTA (nuova/modifica) — validazioni unità/quantità, righe dinamiche
--------------------------------------------------------------------------- */
function openRecipeEditor(existing, onSaved){
  const s=Store.get().settings;
  const base={nome:"",porzioniBase:s.defaultServings,categoria:"",tempo:"",tag:[],ingredienti:[],istruzioni:[],note:"",useCount:0};
  const r=Object.assign(base, existing?JSON.parse(JSON.stringify(existing)):{});
  const isNew=!existing || !existing.id;
  const units=s.unitPrefs.concat(["qb"]);
  const depts=s.departments;
  function ingRow(ing, idx){
    ing=ing||{nome:"",qty:null,unita:"g",reparto:""};
    return `<div class="ing-ed" data-row="${idx}">
      <input type="text" class="ie-nome" placeholder="ingrediente" value="${escapeAttr(ing.nome||"")}">
      <input type="text" class="ie-qty" placeholder="qb" value="${ing.qty==null?'':ing.qty}">
      <select class="ie-unita" aria-label="Unità">${units.map(u=>`<option ${((ing.unita||'g')===u)?'selected':''}>${u}</option>`).join("")}</select>
      <select class="ie-rep" aria-label="Reparto"><option value="">(auto)</option>${depts.map(d=>`<option ${ing.reparto===d?'selected':''}>${escapeHtml(d)}</option>`).join("")}</select>
      <button type="button" class="btn btn-ghost btn-icon ie-del" aria-label="Rimuovi ingrediente">✕</button>
    </div>`;
  }
  const body=`
    <div class="field-row">
      <div class="field"><label for="re-nome">Nome *</label><input id="re-nome" type="text" value="${escapeAttr(r.nome)}" autofocus></div>
      <div class="field"><label for="re-porz">Porzioni base *</label><input id="re-porz" type="number" min="1" max="30" value="${r.porzioniBase}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="re-cat">Categoria</label><input id="re-cat" type="text" value="${escapeAttr(r.categoria||'')}" placeholder="Primi, Secondi…"></div>
      <div class="field"><label for="re-tempo">Tempo</label><input id="re-tempo" type="text" value="${escapeAttr(r.tempo||'')}" placeholder="25 min"></div>
    </div>
    <div class="field"><label for="re-tag">Tag (separati da virgola)</label><input id="re-tag" type="text" value="${escapeAttr((r.tag||[]).join(', '))}" placeholder="vegetariano, veloce"></div>
    <div class="field">
      <label>Ingredienti</label>
      <div class="ed-head"><span>Nome</span><span>Q.tà</span><span>Unità</span><span>Reparto</span><span></span></div>
      <div id="re-ings">${(r.ingredienti.length?r.ingredienti:[null]).map(ingRow).join("")}</div>
      <button type="button" class="btn btn-sm mt-2" id="re-add-ing">+ Ingrediente</button>
    </div>
    <div class="field"><label for="re-ist">Istruzioni (una per riga)</label>
      <textarea id="re-ist" rows="5" placeholder="1) Metti a bollire l'acqua…">${escapeHtml((r.istruzioni||[]).map((x,i)=>`${i+1}) ${x}`).join("\n"))}</textarea></div>
    <div class="field"><label for="re-note">Note</label><textarea id="re-note" rows="2">${escapeHtml(r.note||'')}</textarea></div>
    <p id="re-err" class="help" style="color:var(--danger)" role="alert"></p>`;
  Modal.open({
    title:isNew?"Nuova ricetta":"Modifica ricetta", size:"lg", bodyHTML:body,
    footHTML:`<button class="btn" data-close>Annulla</button><button class="btn btn-primary" data-save>Salva</button>`,
    onMount(dialog, close){
      const ingsWrap=dialog.querySelector("#re-ings");
      function wireDel(row){ row.querySelector(".ie-del").addEventListener("click",()=>row.remove()); }
      ingsWrap.querySelectorAll(".ing-ed").forEach(wireDel);
      dialog.querySelector("#re-add-ing").addEventListener("click",()=>{
        const wrap=document.createElement("div"); wrap.innerHTML=ingRow(null, "n"+ingsWrap.children.length);
        const row=wrap.firstElementChild; ingsWrap.appendChild(row); wireDel(row); row.querySelector(".ie-nome").focus();
      });
      dialog.querySelector("[data-save]").addEventListener("click",()=>{
        const err=dialog.querySelector("#re-err");
        const nome=dialog.querySelector("#re-nome").value.trim();
        const porz=clampInt(dialog.querySelector("#re-porz").value,1,30,0);
        if(!nome){ err.textContent="Il nome è obbligatorio."; return; }
        if(!porz){ err.textContent="Le porzioni base devono essere un numero ≥ 1."; return; }
        const ings=[]; let bad=null;
        ingsWrap.querySelectorAll(".ing-ed").forEach(row=>{
          const nm=row.querySelector(".ie-nome").value.trim(); if(!nm) return;
          let unita=row.querySelector(".ie-unita").value;
          const qtyRaw=row.querySelector(".ie-qty").value.trim();
          let qty=null;
          if(unita==="qb" || qtyRaw==="" || /^qb$/i.test(qtyRaw)){ qty=null; unita="qb"; }
          else { qty=parseFloat(qtyRaw.replace(",",".")); if(isNaN(qty)){ bad=nm; return; } }
          const rep=row.querySelector(".ie-rep").value || Reparti.guess(nm);
          ings.push({nome:nm, qty, unita, reparto:rep});
        });
        if(bad){ err.textContent=`Quantità non numerica per "${bad}" (usa un numero o lascia vuoto per “qb”).`; return; }
        const ist=dialog.querySelector("#re-ist").value.split("\n").map(l=>l.trim().replace(/^\d+[\).]\s*/,"")).filter(Boolean);
        const tag=dialog.querySelector("#re-tag").value.split(",").map(x=>x.trim()).filter(Boolean);
        const out={ id:r.id||Recipes.genId(), nome, porzioniBase:porz,
          categoria:dialog.querySelector("#re-cat").value.trim(), tempo:dialog.querySelector("#re-tempo").value.trim(),
          tag, ingredienti:ings, istruzioni:ist, note:dialog.querySelector("#re-note").value.trim(), useCount:r.useCount||0 };
        Store.update(db=>{ const i=db.recipes.findIndex(x=>x.id===out.id); if(i>=0) db.recipes[i]=out; else db.recipes.push(out); });
        close(); Toast.show(isNew?"Ricetta creata":"Ricetta salvata","ok");
        if(onSaved) onSaved(out);
      });
    }
  });
}

/* ---------------------------------------------------------------------------
   IMPORT/EXPORT ricette (.txt + .json)
--------------------------------------------------------------------------- */
function recipeToTxt(r){
  let out=`Nome: ${r.nome}\nPorzioniBase: ${r.porzioniBase}\n`;
  if(r.tempo) out+=`Tempo: ${r.tempo}\n`;
  if(r.categoria) out+=`Categoria: ${r.categoria}\n`;
  if(r.tag&&r.tag.length) out+=`Tag: ${r.tag.join(", ")}\n`;
  out+=`Ingredienti:\n`+(r.ingredienti||[]).map(i=>`- ${i.nome} | ${i.qty==null?'qb':(i.qty+' '+i.unita)}`).join("\n")+"\n";
  out+=`Istruzioni:\n`+(r.istruzioni||[]).map((x,i)=>`${i+1}) ${x}`).join("\n");
  if(r.note) out+=`\nNote: ${r.note}`;
  if(r.fonte) out+=`\nFonte: ${r.fonte}`;
  return out;
}
function openExportRecipes(){
  const recs=Recipes.all();
  if(!recs.length){ Toast.show("Nessuna ricetta da esportare","warn"); return; }

    <div class="flex gap-2 flex-wrap"><button class="btn" data-json>⬇️ JSON (.json)</button><button class="btn" data-txt>⬇️ Testo (.txt)</button></div>`,

}

/* Parsa una riga ingrediente "- nome | qty unità" (tollerante) */
function parseIngredientLine(line){
  let l=(line||"").trim().replace(/^[-*•]\s*/,"");
  if(!l) return null;
  const parts=l.split("|");
  const nome=parts[0].trim();
  if(!nome) return null;
  const q = parts.length>1 ? Units.parseQty(parts.slice(1).join("|")) : {qty:null, unita:"qb"};
  return { nome, qty:q.qty, unita:q.unita, reparto:Reparti.guess(nome) };
}

/* ---------------------------------------------------------------------------
   AUTOCOMPLETE riutilizzabile
--------------------------------------------------------------------------- */
function attachAutocomplete(input, opts){
  const wrap=input.closest(".ac-wrap") || input.parentElement;
  let list=null, active=-1, items=[];
  function close(){ if(list){ list.remove(); list=null; active=-1; } }
  function build(){
    const q=input.value;
    const recs=Recipes.search(q);
    items=recs.map(r=>({type:"recipe", r}));
    if(q.trim() && !recs.some(r=>r.nome.toLowerCase()===q.trim().toLowerCase())) items.push({type:"create", text:q.trim()});
    close();
    if(!items.length) return;
    list=document.createElement("div"); list.className="ac-list"; list.setAttribute("role","listbox");
    items.forEach((it,i)=>{
      const it_el=document.createElement("div");
      it_el.className="ac-item"+(it.type==="create"?" ac-create":"");
      it_el.setAttribute("role","option");
      it_el.innerHTML = it.type==="recipe"
        ? `<span>${escapeHtml(it.r.nome)}</span><span class="ac-meta">${escapeHtml(it.r.categoria||"")}${it.r.porzioniBase?" · "+it.r.porzioniBase+" porz.":""}</span>`
        : `<span>+ Crea ricetta «${escapeHtml(it.text)}»</span>`;
      it_el.addEventListener("mousedown",e=>{ e.preventDefault(); choose(i); });
      list.appendChild(it_el);
    });
    wrap.appendChild(list);
  }
  function choose(i){
    const it=items[i]; if(!it) return; close();
    if(it.type==="recipe") opts.onSelect(it.r); else opts.onCreate(it.text);
  }
  function hl(){ if(list)[...list.children].forEach((c,i)=>c.classList.toggle("active",i===active)); }
  const deb=debounce(build,120);
  input.addEventListener("input",()=>{ if(opts.onText) opts.onText(input.value); deb(); });
  input.addEventListener("focus",build);
  input.addEventListener("keydown",e=>{
    if(!list){ if(e.key==="ArrowDown") build(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(items.length-1,active+1); hl(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(0,active-1); hl(); }
    else if(e.key==="Enter" && active>=0){ e.preventDefault(); choose(active); }
    else if(e.key==="Escape"){ close(); }
  });
  document.addEventListener("mousedown",e=>{ if(list && !wrap.contains(e.target)) close(); }, true);
}

/* ---------------------------------------------------------------------------
   POPOVER generico + STAMPA
--------------------------------------------------------------------------- */
let _pop=null, _popOutside=null, _popOnClose=null;
function closePopover(){
  if(_pop){ _pop.remove(); _pop=null; }
  if(_popOutside){ document.removeEventListener("mousedown",_popOutside,true); _popOutside=null; }
  if(_popOnClose){ const f=_popOnClose; _popOnClose=null; try{ f(); }catch(e){} }
}
function openPopover(anchor, html, onMount, onClose){
  closePopover();
  const pop=document.createElement("div"); pop.className="pop"; pop.innerHTML=html;
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  pop.style.top=(window.scrollY+r.bottom+4)+"px";
  let left=window.scrollX+r.right-pop.offsetWidth; if(left<8) left=8;
  pop.style.left=left+"px";
  _pop=pop; _popOnClose=onClose||null;
  _popOutside=e=>{ if(!pop.contains(e.target) && e.target!==anchor) closePopover(); };
  setTimeout(()=>document.addEventListener("mousedown",_popOutside,true),0);
  if(onMount) onMount(pop, closePopover);
}

function printHTML(title, inner){
  const pa=document.getElementById("print-area");
  pa.innerHTML=`<h1>${escapeHtml(title)}</h1>${inner}`;
  document.body.classList.add("printing");
  const cleanup=()=>{ document.body.classList.remove("printing"); pa.innerHTML=""; window.removeEventListener("afterprint",cleanup); };
  window.addEventListener("afterprint",cleanup);
  window.print();
}
function slotPrintText(slot){
  if(!slot) return "—";
  if(slot.recipeId){ const r=Recipes.byId(slot.recipeId); return (r?r.nome:"(ricetta rimossa)")+(slot.overrideServings?` (${slot.overrideServings} porz.)`:""); }
  if(slot.manualText) return slot.manualText;
  return "—";
}
function printWeek(weekKey, monday, days){

/* Lista spesa aggregata montata in un contenitore (usata dalla vista Spesa e dal pannello affiancato) */
function mountShoppingList(container, weekKey, opts){
  opts=opts||{};
  function draw(){
    const agg=Shopping.aggregate(weekKey);
    container.innerHTML="";
    if(!agg.items.length){
      container.innerHTML=`<div class="empty-state">Lista vuota. Pianifica i pasti (gli ingredienti non spuntati “Ce l'ho” arrivano qui), premi “Lista base” o aggiungi articoli.</div>`;
    } else {
      agg.orderedReps.forEach(rep=>{
        const items=agg.groups[rep];
        const h=document.createElement("div"); h.className="rep-head";
        h.innerHTML=`${escapeHtml(rep)} <span class="rep-count">(${items.length})</span>`;
        container.appendChild(h);
        items.forEach(it=>container.appendChild(itemRow(it)));
      });
    }
    if(opts.onDraw) opts.onDraw(agg);
  }
  function itemRow(it){
    const row=document.createElement("div"); row.className="shop-item"+(it.have?" have-it":"")+(opts.compact?" compact":"");
    const prov=Shopping.provSummary(it);
    const multi=[...new Set(it.provenienze.filter(p=>p.recipeName).map(p=>p.recipeName))].length>1
      || it.provenienze.filter(p=>p.recipeName).length>1;
    row.innerHTML=`
      <input type="checkbox" class="si-check" ${it.have?'checked':''} aria-label="Ce l'ho: ${escapeAttr(it.nome)}">
      <div class="si-main">
        <div class="si-name truncate" title="${escapeAttr(it.nome)}">${escapeHtml(it.nome)}</div>
        <div class="si-badge">${multi?`<button data-prov>${escapeHtml(prov)} ⓘ</button>`:escapeHtml(prov)}</div>
      </div>
      ${it.hasQty?`<span class="si-qty">${Shopping.fmtQty(it.qty)} ${it.unita}</span>`:''}
      ${(it.altUnits&&it.altUnits.length>1)?`<button class="si-unit-toggle" data-toggle title="Cambia unità (${it.altUnits.join('↔')})" aria-label="Cambia unità">⇄</button>`:''}
      ${(it.extraIds&&it.extraIds.length)?`<button class="btn btn-ghost si-del" data-del aria-label="Rimuovi ${escapeAttr(it.nome)}">✕</button>`:''}`;
    row.querySelector(".si-check").addEventListener("change",e=>{ Shopping.setHave(weekKey, it.key, e.target.checked); draw(); });
    const tg=row.querySelector("[data-toggle]");
    if(tg) tg.addEventListener("click",()=>{ const alt=it.altUnits.find(u=>u!==it.unita)||it.unita; Shopping.setUnitPref(weekKey, it.key, alt); draw(); });
    const del=row.querySelector("[data-del]");
    if(del) del.addEventListener("click",()=>{ it.extraIds.forEach(id=>Shopping.removeExtra(weekKey,id)); draw(); Toast.show("Articolo rimosso"); });
    const pv=row.querySelector("[data-prov]");
    if(pv) pv.addEventListener("click",()=>openProvPopover(pv, it));
    return row;
  }
  draw();
  return { draw };
}
