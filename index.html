<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Planner Weekly — Pasti, Spesa, Ricette</title>
<!-- Web app installabile (schermata Home iPad/iPhone/Android) -->
<meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161b25" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="application-name" content="Planner">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<!--
  ============================================================================
  PLANNER WEEKLY  —  Single-file offline app (HTML + CSS + JS inline)
  ============================================================================
  FASE 1 — Fondamenta:
    - Shell semantica (header/nav/main/footer) + tab bar mobile
    - Astrazione Store (LocalStorage) versionata con upgrade
    - Temi (chiaro/scuro + accento), scala tipografica
    - Infrastruttura Modali (role=dialog, focus trap, Esc) e Toast
    - Impostazioni complete
    - Toggle "Popola dati demo" + Reset con doppia conferma
  Le altre aree (Planner, Ricette, Spesa, Calendario, Backup) sono placeholder
  cablati in navigazione: verranno implementate nelle fasi successive.
  Nessuna dipendenza esterna. Funziona da file:// (offline).
  ============================================================================
-->
<style>
/* ===========================================================================
   1. DESIGN TOKENS  (variabili CSS: tema, accento, tipografia)
   =========================================================================== */
:root{
  --font-scale: 1;
  --fs-xs: calc(0.75rem * var(--font-scale));
  --fs-sm: calc(0.875rem * var(--font-scale));
  --fs-base: calc(1rem * var(--font-scale));
  --fs-lg: calc(1.125rem * var(--font-scale));
  --fs-xl: calc(1.375rem * var(--font-scale));
  --fs-2xl: calc(1.75rem * var(--font-scale));

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-8: 48px;

  --radius: 16px; --radius-sm: 11px; --radius-lg: 24px; --radius-btn: 13px;
  --ring: 0 0 0 4px var(--accent-ring);
  --shadow-1: 0 1px 2px rgba(17,24,39,.04), 0 6px 18px rgba(17,24,39,.06);
  --shadow-2: 0 16px 50px rgba(17,24,39,.20);
  --accent-grad: linear-gradient(135deg, var(--accent-2), var(--accent-strong));

  /* Accento di default (teal) — sovrascritto da data-accent */
  --accent: #0d9488;
  --accent-2: #14b8a6;
  --accent-strong: #0f766e;
  --accent-contrast: #ffffff;
  --accent-ring: rgba(13,148,136,.38);
  --accent-soft: rgba(13,148,136,.12);
}

/* ---- Palette accenti (con colore per il gradiente) ---- */
:root[data-accent="teal"]{   --accent:#0d9488; --accent-2:#14b8a6; --accent-strong:#0f766e; --accent-ring:rgba(13,148,136,.38); --accent-soft:rgba(13,148,136,.14); }
:root[data-accent="blue"]{   --accent:#2563eb; --accent-2:#3b82f6; --accent-strong:#1d4ed8; --accent-ring:rgba(37,99,235,.38); --accent-soft:rgba(37,99,235,.14); }
:root[data-accent="coral"]{  --accent:#e2574c; --accent-2:#f97362; --accent-strong:#c53f36; --accent-ring:rgba(226,87,76,.38); --accent-soft:rgba(226,87,76,.14); }
:root[data-accent="violet"]{ --accent:#7c3aed; --accent-2:#9061f9; --accent-strong:#6d28d9; --accent-ring:rgba(124,58,237,.38); --accent-soft:rgba(124,58,237,.14); }
:root[data-accent="amber"]{  --accent:#d97706; --accent-2:#f59e0b; --accent-strong:#b45309; --accent-ring:rgba(217,119,6,.38); --accent-soft:rgba(217,119,6,.14); }

/* ---- Tema chiaro ---- */
:root[data-theme="light"]{
  --bg: #eaeef4; --surface: #ffffff; --surface-2: #f2f4f9;
  --text: #10131a; --text-soft: #545b68; --text-mute: #8b92a0;
  --border: #e9ecf3; --border-strong: #d7dce5;
  --glass: rgba(255,255,255,.7); --glass-border: rgba(255,255,255,.6);
  --danger:#e11d48; --danger-soft:rgba(225,29,72,.11);
  --warn:#d97706; --ok:#16a34a;
  --u-green:#16a34a; --u-yellow:#ca8a04; --u-orange:#ea580c; --u-red:#e11d48;
}
/* ---- Tema scuro ---- */
:root[data-theme="dark"]{
  --bg: #0a0d13; --surface: #161b25; --surface-2: #1e2531;
  --text: #eef1f6; --text-soft: #aeb7c5; --text-mute: #798494;
  --border: #232b38; --border-strong: #323c4b;
  --glass: rgba(20,25,34,.68); --glass-border: rgba(255,255,255,.07);
  --danger:#fb7185; --danger-soft:rgba(251,113,133,.16);
  --warn:#fbbf24; --ok:#4ade80;
  --u-green:#4ade80; --u-yellow:#facc15; --u-orange:#fb923c; --u-red:#fb7185;
}

/* ===========================================================================
   2. RESET & BASE
   =========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size: var(--fs-base);
  line-height:1.5;
  color:var(--text);
  background:
    radial-gradient(1100px 620px at 108% -8%, var(--accent-soft), transparent 55%),
    radial-gradient(900px 520px at -10% 4%, var(--accent-soft), transparent 50%),
    var(--bg);
  background-attachment: fixed;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ margin:0 0 var(--sp-3); line-height:1.2; font-weight:750; letter-spacing:-0.02em; }
h1{ font-size:var(--fs-2xl); font-weight:800; letter-spacing:-0.03em; } h2{ font-size:var(--fs-xl); } h3{ font-size:var(--fs-lg); }
p{ margin:0 0 var(--sp-3); }
a{ color:var(--accent); }
:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:var(--radius-sm); }
img{ max-width:100%; }
[hidden]{ display:none !important; }

/* ===========================================================================
   3. UTILITY (tailwind-like scritte a mano)
   =========================================================================== */
.container{ max-width:1180px; margin:0 auto; padding:0 var(--sp-4); }
.flex{ display:flex; } .grid{ display:grid; }
.items-center{ align-items:center; } .items-start{ align-items:flex-start; } .items-end{ align-items:flex-end; }
.justify-between{ justify-content:space-between; } .justify-center{ justify-content:center; } .justify-end{ justify-content:flex-end; }
.flex-col{ flex-direction:column; } .flex-wrap{ flex-wrap:wrap; } .flex-1{ flex:1; }
.gap-1{ gap:var(--sp-1);} .gap-2{ gap:var(--sp-2);} .gap-3{ gap:var(--sp-3);} .gap-4{ gap:var(--sp-4);}
.mt-1{margin-top:var(--sp-1)}.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}.mt-4{margin-top:var(--sp-4)}
.mb-1{margin-bottom:var(--sp-1)}.mb-2{margin-bottom:var(--sp-2)}.mb-3{margin-bottom:var(--sp-3)}.mb-4{margin-bottom:var(--sp-4)}
.mb-0{margin-bottom:0}
.w-full{width:100%;}
.text-sm{font-size:var(--fs-sm)} .text-xs{font-size:var(--fs-xs)} .text-lg{font-size:var(--fs-lg)}
.text-soft{color:var(--text-soft)} .text-mute{color:var(--text-mute)}
.text-center{text-align:center} .text-right{text-align:right}
.font-bold{font-weight:700} .font-semi{font-weight:600}
.hidden{display:none}
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---- Card ---- */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--sp-5);
  box-shadow:var(--shadow-1); transition:box-shadow .2s ease, transform .2s ease; }
.card + .card{ margin-top:var(--sp-4); }
.card-pad-lg{ padding:var(--sp-5); }

/* ---- Bottoni ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
  font-size:var(--fs-sm); font-weight:600; line-height:1.1;
  padding:10px 18px; border-radius:var(--radius-btn); cursor:pointer;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  transition: background .18s, border-color .18s, transform .08s, box-shadow .18s, filter .18s;
  min-height:40px;
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent-grad); border-color:transparent; color:var(--accent-contrast);
  box-shadow:0 6px 18px -4px var(--accent-ring); }
.btn-primary:hover{ filter:brightness(1.06); box-shadow:0 8px 22px -4px var(--accent-ring); background:var(--accent-grad); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ background:var(--danger); border-color:transparent; color:#fff; box-shadow:0 6px 18px -6px var(--danger); }
.btn-danger:hover{ filter:brightness(1.05); }
.btn-sm{ padding:6px 12px; min-height:32px; font-size:var(--fs-xs); border-radius:10px; }
.btn-icon{ padding:8px; min-width:40px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ---- Chip / badge ---- */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
  font-size:var(--fs-xs); font-weight:600; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); font-family:inherit; }
.chip-accent{ background:var(--accent-soft); border-color:transparent; color:var(--accent-strong); }
:root[data-theme="dark"] .chip-accent{ color:var(--text); }
.badge{ display:inline-block; min-width:18px; text-align:center; padding:1px 7px; border-radius:999px;
  font-size:var(--fs-xs); font-weight:700; background:var(--accent); color:var(--accent-contrast); }

/* ---- Form ---- */
label{ font-size:var(--fs-sm); font-weight:600; color:var(--text-soft); display:block; margin-bottom:6px; }
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{
  width:100%; font-size:var(--fs-base); font-family:inherit; color:var(--text);
  background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
  padding:10px 13px; min-height:40px; transition:border-color .18s, box-shadow .18s, background .18s;
}
textarea{ min-height:80px; resize:vertical; }
input:focus-visible,select:focus-visible,textarea:focus-visible{ border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--accent-ring); }
.field{ margin-bottom:var(--sp-4); }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
.help{ font-size:var(--fs-xs); color:var(--text-mute); margin-top:4px; }

/* switch */
.switch{ position:relative; display:inline-flex; align-items:center; gap:10px; cursor:pointer; }
.switch input{ position:absolute; opacity:0; width:0; height:0; }
.switch .track{ width:44px; height:26px; border-radius:999px; background:var(--border-strong); transition:.2s; flex:none; }
.switch .thumb{ position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; box-shadow:var(--shadow-1); }
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked + .track + .thumb{ transform:translateX(18px); }
.switch input:focus-visible + .track{ box-shadow:var(--ring); }

/* segmented control (stile iOS) */
.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:4px; gap:2px; }
.seg button{ border:none; background:transparent; color:var(--text-soft); padding:7px 15px; border-radius:9px; font-weight:600; font-size:var(--fs-sm); cursor:pointer; transition:background .18s, color .18s, box-shadow .18s; }
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }

/* swatch */
.swatch-row{ display:flex; gap:10px; flex-wrap:wrap; }
.swatch{ width:38px; height:38px; border-radius:50%; border:2px solid var(--border); cursor:pointer; position:relative; }
.swatch[aria-pressed="true"]{ border-color:var(--text); box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent); }

/* ===========================================================================
   4. LAYOUT: header, nav, main, footer/tabbar
   =========================================================================== */
.app-header{ position:sticky; top:0; z-index:40; background:var(--glass);
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--glass-border); }
.app-header .container{ display:flex; align-items:center; gap:var(--sp-4); height:64px; }
.brand{ display:flex; align-items:center; gap:11px; font-weight:800; font-size:var(--fs-lg); letter-spacing:-0.02em; }
.brand .logo{ width:36px; height:36px; border-radius:11px; background:var(--accent-grad); color:var(--accent-contrast);
  display:grid; place-items:center; font-size:19px; box-shadow:0 4px 12px -2px var(--accent-ring); }
.top-nav{ display:flex; gap:3px; margin-left:auto; background:var(--surface-2); padding:4px; border-radius:14px; border:1px solid var(--border); }
.top-nav button{ border:none; background:transparent; color:var(--text-soft); font-weight:600; font-size:var(--fs-sm);
  padding:8px 14px; border-radius:10px; cursor:pointer; transition:background .18s, color .18s; }
.top-nav button:hover{ color:var(--text); }
.top-nav button[aria-current="page"]{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow-1); }
:root[data-theme="dark"] .top-nav button[aria-current="page"]{ color:var(--text); }
@media(max-width:820px){ .top-nav{ display:none; } }

main{ padding:var(--sp-5) 0 96px; }
.view{ animation:viewIn .22s ease; }
/* Entrata solo con scorrimento: nessuna opacità → la vista è SEMPRE visibile,
   anche se l'animazione non parte (scheda in background, reduced-motion). */
@keyframes viewIn{ from{ transform:translateY(8px) } to{ transform:none } }
@keyframes fade{ from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }
.view-head{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); margin-bottom:var(--sp-4); flex-wrap:wrap; }

/* tab bar mobile */
.tabbar{ position:fixed; bottom:0; left:0; right:0; z-index:40; background:var(--glass);
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid var(--glass-border); display:none; }
.tabbar .container{ display:flex; padding:0; }
.tabbar button{ flex:1; border:none; background:transparent; color:var(--text-mute); cursor:pointer;
  padding:8px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600;
  transition:color .18s; }
.tabbar button .ic{ display:grid; place-items:center; width:26px; height:26px; transition:transform .18s; }
.tabbar button .ic svg{ width:24px; height:24px; }
.nav-gear svg{ width:20px; height:20px; vertical-align:middle; }
.tabbar button[aria-current="page"]{ color:var(--accent); }
.tabbar button[aria-current="page"] .ic{ transform:translateY(-1px) scale(1.08); }
@media(max-width:820px){ .tabbar{ display:block; } }

/* footer */
.app-footer{ border-top:1px solid var(--border); padding:var(--sp-4) 0; color:var(--text-mute); font-size:var(--fs-xs); }

/* ===========================================================================
   5. COVER / ONBOARDING
   =========================================================================== */
.cover{ min-height:calc(100vh - 60px); display:grid; place-items:center; padding:var(--sp-6) var(--sp-4); }
.cover-inner{ max-width:560px; text-align:center; }
.cover .logo-big{ width:84px; height:84px; border-radius:24px; background:var(--accent-grad); color:var(--accent-contrast);
  display:grid; place-items:center; font-size:42px; margin:0 auto var(--sp-4); box-shadow:0 18px 40px -10px var(--accent-ring); }
.cover h1{ font-size:calc(2.4rem * var(--font-scale)); letter-spacing:-0.035em; }
.cover-actions{ display:grid; gap:var(--sp-3); margin-top:var(--sp-5); }
@media(min-width:520px){ .cover-actions{ grid-template-columns:repeat(3,1fr); } }

/* ===========================================================================
   6. MODALI & TOAST
   =========================================================================== */
.modal-backdrop{ position:fixed; inset:0; z-index:100; background:rgba(8,10,18,.45);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  display:flex; align-items:flex-end; justify-content:center; padding:0; animation:fade .18s; }
@media(min-width:640px){ .modal-backdrop{ align-items:center; padding:var(--sp-4); } }
.modal{ background:var(--surface); width:100%; max-width:600px; max-height:92vh; overflow:auto;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0; box-shadow:var(--shadow-2); border:1px solid var(--glass-border);
  animation:modalIn .24s cubic-bezier(.2,.8,.2,1); }
@keyframes modalIn{ from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1; transform:none} }
@media(min-width:640px){ .modal{ border-radius:var(--radius-lg); } }
.modal-lg{ max-width:820px; }
.modal-head{ position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--border);
  padding:var(--sp-4) var(--sp-5); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); z-index:2; }
.modal-head h2{ margin:0; font-size:var(--fs-lg); }
.modal-body{ padding:var(--sp-5); }
.modal-foot{ position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border);
  padding:var(--sp-3) var(--sp-5); display:flex; gap:var(--sp-2); justify-content:flex-end; }

.toast-wrap{ position:fixed; z-index:200; bottom:96px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; gap:8px; width:calc(100% - 32px); max-width:420px; pointer-events:none; }
@media(min-width:640px){ .toast-wrap{ bottom:24px; left:auto; right:24px; transform:none; align-items:flex-end; } }
.toast{ pointer-events:auto; background:var(--text); color:var(--bg); padding:12px 16px; border-radius:var(--radius);
  box-shadow:var(--shadow-2); font-size:var(--fs-sm); font-weight:500; display:flex; align-items:center; gap:10px;
  animation:toastIn .2s ease; max-width:100%; }
.toast.ok{ background:var(--ok); color:#04120a; }
.toast.err{ background:var(--danger); color:#fff; }
.toast.warn{ background:var(--warn); color:#1a1200; }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

/* settings list rows */
.set-group{ }
.set-group + .set-group{ margin-top:var(--sp-5); padding-top:var(--sp-5); border-top:1px solid var(--border); }
.set-group h3{ font-size:var(--fs-base); color:var(--accent-strong); }
:root[data-theme="dark"] .set-group h3{ color:var(--text); }
.set-row{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4); padding:var(--sp-2) 0; }
.set-row .set-label{ flex:1; }
.set-row .set-label small{ display:block; color:var(--text-mute); font-weight:400; font-size:var(--fs-xs); }

/* sortable list (reparti) */
.sortlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.sortlist li{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:6px 8px; }
.sortlist li .grip{ cursor:grab; color:var(--text-mute); font-size:16px; user-select:none; }
.sortlist li input{ border:none; background:transparent; min-height:auto; padding:4px 6px; }
.sortlist li.dragging{ opacity:.5; }
.sortlist li.dragover{ border-color:var(--accent); box-shadow:var(--ring); }

.placeholder-view{ text-align:center; padding:var(--sp-8) var(--sp-4); color:var(--text-mute); }
.placeholder-view .big{ font-size:52px; margin-bottom:var(--sp-3); }

kbd{ font-family:ui-monospace,monospace; font-size:.85em; background:var(--surface-2); border:1px solid var(--border);
  border-bottom-width:2px; border-radius:5px; padding:1px 6px; }
code.block{ display:block; white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:var(--sp-3); font-size:var(--fs-xs); font-family:ui-monospace,monospace; overflow:auto; }

/* ===========================================================================
   7. PLANNER
   =========================================================================== */
.week-nav{ display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; }
.week-label{ font-weight:700; font-size:var(--fs-base); min-width:0; }
.week-label small{ display:block; font-weight:500; color:var(--text-mute); font-size:var(--fs-xs); }

.planner-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
.planner-grid{
  display:grid;
  grid-template-columns:44px repeat(5, minmax(12ch,1fr));
  gap:6px; min-width:700px;
}
@media(max-width:640px){ .planner-grid{ grid-template-columns:36px repeat(5, minmax(9ch,1fr)); min-width:500px; } }

.pg-day{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:6px 8px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
.pg-day.is-today{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.pg-day .d-name{ font-weight:700; font-size:var(--fs-sm); }
.pg-day .d-name small{ display:block; font-weight:500; color:var(--text-mute); font-size:11px; }
.pg-day .d-people{ font-size:var(--fs-xs); color:var(--text-soft); white-space:nowrap; cursor:pointer; font-weight:600;
  border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:3px 9px; font-family:inherit; transition:border-color .15s,color .15s,background .15s; }
.pg-day .d-people:hover{ border-color:var(--accent); color:var(--text); }
.pg-day .d-people.is-set{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
:root[data-theme="dark"] .pg-day .d-people.is-set{ color:var(--text); }
.pg-day .d-menu-btn{ border:none; background:transparent; cursor:pointer; color:var(--text-mute); font-size:16px; padding:2px 4px; border-radius:6px; }
.pg-day .d-menu-btn:hover{ background:var(--surface); }
.pg-day.dragover{ outline:2px dashed var(--accent); outline-offset:2px; }
.d-letter{ display:none; }
@media(max-width:640px){ .pg-day .d-name .full{display:none;} .d-letter{display:inline;} .pg-day .d-people{display:none;} }

.pg-rowlabel{ display:flex; align-items:center; justify-content:center; }
.pg-rowlabel .rl-letter{ display:grid; place-items:center; width:30px; height:30px; border-radius:50%;
  background:var(--surface-2); border:1px solid var(--border); font-weight:800; font-size:var(--fs-sm);
  color:var(--text-soft); cursor:default; }
@media(max-width:640px){ .pg-rowlabel .rl-letter{ width:26px; height:26px; } }

.meal-cell{ display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:8px; min-height:58px; cursor:pointer; font:inherit; color:inherit; }
.meal-cell:hover{ border-color:var(--accent); background:var(--accent-soft); }
.meal-cell .m-title{ font-weight:600; font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meal-cell .m-sub{ font-size:11px; color:var(--text-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meal-cell.is-empty{ color:var(--text-mute); display:flex; align-items:center; justify-content:center; border-style:dashed; font-size:var(--fs-sm); }
.note-cell{ min-height:58px; }
.note-cell textarea{ min-height:58px; font-size:var(--fs-sm); resize:vertical; }

/* menu giorno */
.pop{ position:absolute; z-index:60; background:var(--surface); border:1px solid var(--border-strong);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-2); min-width:180px; padding:4px; }
.pop button{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:transparent;
  padding:8px 10px; border-radius:6px; cursor:pointer; color:var(--text); font-size:var(--fs-sm); }
.pop button:hover{ background:var(--surface-2); }
.pop .sep{ height:1px; background:var(--border); margin:4px 0; }
.pop small{ display:block; padding:4px 10px 2px; color:var(--text-mute); font-size:11px; }

/* autocomplete */
.ac-wrap{ position:relative; }
.ac-list{ position:absolute; z-index:70; left:0; right:0; top:100%; margin-top:4px; background:var(--surface);
  border:1px solid var(--border-strong); border-radius:var(--radius-sm); box-shadow:var(--shadow-2);
  max-height:240px; overflow:auto; }
.ac-item{ padding:9px 11px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.ac-item:hover,.ac-item.active{ background:var(--accent-soft); }
.ac-item .ac-meta{ font-size:var(--fs-xs); color:var(--text-mute); }
.ac-item.ac-create{ color:var(--accent-strong); font-weight:600; border-top:1px solid var(--border); }
:root[data-theme="dark"] .ac-item.ac-create{ color:var(--text); }

/* ingredienti checklist nella modale pasto */
.ing-list{ list-style:none; margin:0; padding:0; }
.ing-list li{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--border); }
.ing-list li:last-child{ border-bottom:none; }
.ing-name{ flex:1; font-size:var(--fs-sm); }
.ing-qty{ font-size:var(--fs-sm); color:var(--text-soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
.ing-have{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--text-mute); cursor:pointer; }
.ing-have input{ width:18px; height:18px; min-height:auto; }
li.has-it .ing-name, li.has-it .ing-qty{ text-decoration:line-through; opacity:.55; }
.qb-tag{ font-size:11px; color:var(--text-mute); font-style:italic; }

/* ===========================================================================
   8. RICETTE
   =========================================================================== */
.rec-toolbar{ display:flex; gap:var(--sp-2); flex-wrap:wrap; align-items:center; margin-bottom:var(--sp-4); }
.rec-toolbar .search{ flex:1; min-width:180px; }
.filterbar{ display:flex; gap:var(--sp-2); flex-wrap:wrap; align-items:center; margin-bottom:var(--sp-4); }
.rec-grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
.rec-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
  cursor:pointer; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-1); text-align:left;
  color:var(--text); font:inherit; }
.rec-card:hover{ border-color:var(--accent); }
.rec-card .rc-title{ font-weight:700; font-size:var(--fs-base); }
.rec-card .rc-meta{ font-size:var(--fs-xs); color:var(--text-mute); }
.rec-card .rc-tags{ display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.tag{ font-size:11px; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong); }
:root[data-theme="dark"] .tag{ color:var(--text); }
.empty-state{ text-align:center; padding:var(--sp-6); color:var(--text-mute); }

.serv-picker{ display:inline-flex; align-items:center; gap:8px; }
.serv-picker input{ width:70px; text-align:center; }
.step-view{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.step-num{ font-size:var(--fs-xs); color:var(--text-mute); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.step-text{ font-size:var(--fs-lg); margin:8px 0 16px; }
.step-list{ margin:0; padding-left:1.3em; }
.step-list li{ margin-bottom:6px; }

.ing-ed{ display:grid; grid-template-columns:1fr 72px 96px 1fr 36px; gap:6px; align-items:center; margin-bottom:6px; }
@media(max-width:560px){ .ing-ed{ grid-template-columns:1fr 58px 80px 36px; } .ing-ed .ie-rep{ grid-column:1 / -1; } }
.ing-ed input,.ing-ed select{ min-height:36px; padding:4px 8px; font-size:var(--fs-sm); }
.ing-ed .ie-del{ min-height:36px; }
.ed-head{ display:grid; grid-template-columns:1fr 72px 96px 1fr 36px; gap:6px; font-size:11px; color:var(--text-mute); font-weight:600; margin-bottom:4px; }
@media(max-width:560px){ .ed-head{ display:none; } }

/* ===========================================================================
   9. LISTA SPESA
   =========================================================================== */
.shop-add{ display:grid; grid-template-columns:1fr 80px 110px auto; gap:8px; align-items:end; }
@media(max-width:560px){ .shop-add{ grid-template-columns:1fr 1fr; } .shop-add .sa-btn{ grid-column:1 / -1; } }
.shop-add .field{ margin:0; }
.fav-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.fav-chip{ cursor:pointer; border:1px dashed var(--border-strong); background:transparent; }
.fav-chip:hover{ background:var(--accent-soft); border-style:solid; }

.rep-head{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:var(--fs-xs); color:var(--accent-strong);
  text-transform:uppercase; letter-spacing:.05em; margin:14px 0 6px; }
:root[data-theme="dark"] .rep-head{ color:var(--text-soft); }
.rep-head .rep-count{ color:var(--text-mute); font-weight:600; letter-spacing:0; text-transform:none; }
.shop-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:var(--surface); margin-bottom:6px; }
.shop-item.have-it{ opacity:.55; background:var(--surface-2); }
.shop-item.have-it .si-name{ text-decoration:line-through; }
.si-check{ width:20px; height:20px; min-height:auto; flex:none; }
.si-main{ flex:1; min-width:0; }
.si-name{ font-weight:600; font-size:var(--fs-sm); }
.si-badge{ font-size:11px; color:var(--text-mute); }
.si-badge button{ border:none; background:transparent; color:var(--accent-strong); cursor:pointer; font-size:11px; padding:0; text-decoration:underline; }
:root[data-theme="dark"] .si-badge button{ color:var(--text-soft); }
.si-qty{ font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700; font-size:var(--fs-sm); }
.si-unit-toggle{ border:1px solid var(--border-strong); background:var(--surface-2); border-radius:6px; cursor:pointer;
  font-size:12px; padding:2px 6px; color:var(--text-soft); }
.si-unit-toggle:hover{ border-color:var(--accent); }
.si-del{ min-height:auto; padding:4px 6px; }
.shop-summary{ display:flex; gap:12px; flex-wrap:wrap; color:var(--text-mute); font-size:var(--fs-sm); margin-bottom:8px; }

/* ===========================================================================
   10. CHECKLIST / SCADENZE / RICORRENZE
   =========================================================================== */
.cl-item{ display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:var(--surface); margin-bottom:8px; }
.cl-item.done{ opacity:.55; }
.cl-item.done .cl-title{ text-decoration:line-through; }
.cl-check{ width:20px; height:20px; min-height:auto; flex:none; }
.cl-main{ flex:1; min-width:0; }
.cl-title{ font-weight:600; font-size:var(--fs-sm); }
.cl-meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:4px; font-size:var(--fs-xs); color:var(--text-mute); }
.cl-actions{ display:flex; gap:2px; flex:none; }
.cl-actions button{ border:none; background:transparent; cursor:pointer; padding:6px 7px; border-radius:6px; color:var(--text-mute); font-size:15px; }
.cl-actions button:hover{ background:var(--surface-2); color:var(--text); }
.cl-select{ width:18px; height:18px; min-height:auto; flex:none; }

.cd{ font-weight:700; padding:2px 9px; border-radius:999px; font-size:11px; white-space:nowrap; }
.cd.red{ background:var(--danger-soft); color:var(--u-red); }
.cd.orange{ background:rgba(234,88,12,.16); color:var(--u-orange); }
.cd.yellow{ background:rgba(202,138,4,.18); color:var(--u-yellow); }
.cd.green{ background:rgba(22,163,74,.16); color:var(--u-green); }
.prio{ padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700; }
.prio.alta{ background:var(--danger-soft); color:var(--u-red); }
.prio.media{ background:rgba(234,88,12,.16); color:var(--u-orange); }
.prio.bassa{ background:var(--surface-2); color:var(--text-mute); }
.evt-type{ font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--text-mute); }

/* ===========================================================================
   11. OTTIMIZZAZIONE iPad / TOUCH  (target 44pt, tipografia comoda, safe-area)
   Riferimento: iPad Air 5 (A2604) — 820×1180 pt @2x
   =========================================================================== */
:root{ --tap:44px; }

/* --- Target di tocco ≥ 44pt (linee guida iPadOS) --- */
.btn{ min-height:var(--tap); }
.btn-sm{ min-height:36px; }
.btn-icon{ min-width:var(--tap); }
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{ min-height:var(--tap); }
.top-nav button{ min-height:40px; }
.seg button{ min-height:38px; }
/* checkbox/switch più grandi e comodi da toccare */
.si-check,.cl-check,.ing-have input,.si-select,.cl-select{ width:24px; height:24px; }
.switch .track{ width:50px; height:30px; }
.switch .thumb{ width:24px; height:24px; }
.switch input:checked + .track + .thumb{ transform:translateX(20px); }
.swatch{ width:44px; height:44px; }

/* --- Range tablet / iPad: tipografia ~17px e spaziatura più ariosa --- */
@media (min-width:768px) and (max-width:1200px){
  :root{
    --fs-xs:  calc(0.8125rem * var(--font-scale));
    --fs-sm:  calc(0.9375rem * var(--font-scale));
    --fs-base:calc(1.0625rem * var(--font-scale));   /* 17px, standard iOS */
    --fs-lg:  calc(1.1875rem * var(--font-scale));
    --fs-xl:  calc(1.5rem    * var(--font-scale));
    --fs-2xl: calc(1.875rem  * var(--font-scale));
  }
  .app-header .container{ height:64px; }
  .container{ padding:0 var(--sp-5); }
  .card{ padding:var(--sp-5); }
  .modal{ max-width:640px; }
  .modal-lg{ max-width:880px; }
  .rec-grid{ grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
}

/* --- iPad in portrait (≤820pt): tab bar in basso in stile nativo --- */
@media (max-width:820px){
  .tabbar button{ padding:11px 4px; font-size:11px; gap:3px; }
  .tabbar button .ic{ font-size:25px; }
  main{ padding-bottom:104px; }
  .modal-head h2{ font-size:var(--fs-lg); }
}

/* --- Safe-area (home indicator / bordi arrotondati iPad) --- */
@supports (padding:max(0px)){
  .app-header{ padding-top:env(safe-area-inset-top); }
  .app-header .container{ padding-left:max(var(--sp-4), env(safe-area-inset-left)); padding-right:max(var(--sp-4), env(safe-area-inset-right)); }
  .tabbar{ padding-bottom:env(safe-area-inset-bottom); }
  .toast-wrap{ bottom:calc(96px + env(safe-area-inset-bottom)); }
  @media(min-width:640px){ .toast-wrap{ bottom:calc(24px + env(safe-area-inset-bottom)); } }
}

/* Migliora lo scroll inerziale e disabilita l'evidenziazione blu al tocco */
*{ -webkit-tap-highlight-color:transparent; }
.planner-scroll,.modal{ -webkit-overflow-scrolling:touch; }

/* ===========================================================================
   12. RIFINITURE MODERNE  (hover, angoli coerenti, micro-interazioni)
   =========================================================================== */
.rec-card{ border-radius:var(--radius); }
.rec-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:transparent; }
.meal-cell{ border-radius:13px; transition:background .18s, border-color .18s, transform .12s; }
.meal-cell:active{ transform:scale(.99); }
.pg-day{ border-radius:13px; }
.shop-item,.cl-item{ border-radius:14px; transition:background .18s, opacity .18s; }
.set-group h3{ letter-spacing:-0.01em; }
.tag,.prio,.cd{ letter-spacing:.01em; }
code.block{ border-radius:12px; }
.pop{ border-radius:16px; padding:6px; }
.pop button{ border-radius:10px; }
.ac-list{ border-radius:14px; padding:4px; }
.ac-item{ border-radius:10px; }
.toast{ border-radius:14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.week-label{ letter-spacing:-0.01em; }
/* riduci il "salto" degli hover per chi preferisce meno animazioni */
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } .rec-card:hover{ transform:none; } }

/* print */
#print-area{ display:none; }
@media print{
  body.printing > *:not(#print-area){ display:none !important; }
  body.printing #print-area{ display:block !important; color:#000; }
  #print-area h1,#print-area h2,#print-area h3{ color:#000; }
  #print-area .p-day{ page-break-inside:avoid; border:1px solid #999; border-radius:8px; padding:10px; margin-bottom:10px; }
  #print-area table{ width:100%; border-collapse:collapse; }
  #print-area td,#print-area th{ border:1px solid #999; padding:6px; text-align:left; font-size:12px; vertical-align:top; }
}

/* ===========================================================================
   12. PLANNER iPad: barra settimana nell'header, griglia 7 giorni, layout affiancato,
       cella impegni, striscia scadenze, pannello spesa
   =========================================================================== */
.hdr-week{ display:flex; align-items:center; gap:6px; min-width:0; }
.hdr-week:empty{ display:none; }
.hdr-week .btn{ min-height:40px; }
.hdr-week .btn-icon{ min-width:40px; }
.hdr-week .week-label{ margin-left:4px; line-height:1.1; white-space:nowrap; cursor:pointer; }
.hdr-week input[type="date"]{ width:auto; min-height:36px; padding:4px 8px; font-size:var(--fs-xs); }
@media(max-width:1000px){ .hdr-week input[type="date"]{ display:none; } }
@media(max-width:520px){ .hdr-week .week-label small{ display:none; } .app-header .brand span:last-child{ display:none; } }
.chip-danger{ background:var(--danger-soft); border-color:transparent; color:var(--danger); }

/* striscia scadenze (statica, scorre a dito) */
.ticker{ display:flex; align-items:center; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap;
  padding:2px 0 8px; margin-bottom:var(--sp-2); scrollbar-width:none; }
.ticker::-webkit-scrollbar{ display:none; }
.ticker .tk-label{ flex:none; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-mute); }
.tk-chip{ cursor:pointer; min-height:32px; font-family:inherit; }
.tk-chip .tk-when{ color:var(--text-mute); font-weight:500; margin-left:4px; }
.tk-chip.red{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.tk-chip.orange{ background:rgba(234,88,12,.12); color:var(--u-orange); border-color:transparent; }
.tk-chip.yellow{ background:rgba(202,138,4,.14); color:var(--u-yellow); border-color:transparent; }

/* griglia: N giorni, riempie l'altezza disponibile */
.planner-grid{
  grid-template-columns:40px repeat(var(--days,7), minmax(0,1fr));
  grid-template-rows:auto minmax(96px,1fr) minmax(96px,1fr) minmax(150px,1.25fr);
  gap:8px; min-width:0; min-height:calc(100dvh - 300px);
}
@media(max-width:640px){ .planner-grid{ grid-template-columns:32px repeat(var(--days,7), minmax(9ch,1fr)); min-width:0; } }
.pg-day{ min-height:52px; align-items:center; }
.pg-day .d-name{ display:flex; align-items:baseline; gap:6px; }
.pg-day .d-wd, .pl-day .d-wd{ font-size:12px; font-weight:600; color:var(--text-soft); text-transform:uppercase; letter-spacing:.04em; }
.pg-day .d-num, .pl-day .d-num{ font-size:var(--fs-xl); font-weight:700; line-height:1; }
.pg-day.is-today .d-num, .pl-row.is-today .d-num{ color:var(--accent-strong); }
.pg-day .d-today{ padding:1px 8px; font-size:11px; }
.pg-rowlabel .rl-letter{ font-size:16px; }

/* cella pasto con chip persone */
.meal-wrap{ position:relative; height:100%; min-width:0; }
.meal-wrap .meal-cell{ height:100%; min-height:88px; padding:10px 10px 34px; }
.meal-wrap.compact .meal-cell{ min-height:64px; padding:8px 10px 8px; padding-right:62px; }
.meal-cell .m-title{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.25; }
.meal-wrap.compact .m-title{ -webkit-line-clamp:1; }
.m-people{ position:absolute; right:6px; bottom:6px; min-height:28px; padding:2px 9px; border-radius:999px; font-family:inherit;
  font-size:var(--fs-xs); font-weight:600; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border); cursor:pointer; }
.meal-wrap.compact .m-people{ top:50%; bottom:auto; transform:translateY(-50%); }
.m-people:hover{ border-color:var(--accent); color:var(--text); }
.m-people.is-set{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
.m-people.many{ font-weight:700; }
:root[data-theme="dark"] .m-people.is-set{ color:var(--text); }

/* cella impegni & note */
.imp-cell{ display:flex; flex-direction:column; gap:6px; height:100%; min-width:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; }
.imp-list{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.imp-row{ display:flex; align-items:center; gap:6px; min-height:32px; width:100%; border:none; background:transparent; padding:2px 4px; border-radius:6px; cursor:pointer; font:inherit; color:inherit; font-size:var(--fs-xs); text-align:left; min-width:0; }
.imp-row:hover{ background:var(--surface-2); }
.imp-row .imp-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.imp-row .chip{ padding:0 7px; font-size:11px; }
.imp-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-mute); flex:none; }
.imp-dot.plus{ background:var(--accent); } .imp-dot.minus{ background:var(--danger); }
.imp-add{ align-self:flex-start; border:1px dashed var(--border-strong); background:transparent; color:var(--text-mute); border-radius:8px; padding:4px 9px; min-height:30px; font:inherit; font-size:var(--fs-xs); cursor:pointer; }
.imp-add:hover{ border-color:var(--accent); color:var(--accent-strong); }
.imp-note{ flex:1; min-height:44px; font-size:var(--fs-xs); resize:none; padding:6px 8px; }
.imp-cell.compact{ padding:6px; gap:4px; justify-content:center; }
.imp-cell.compact .imp-row{ min-height:28px; }
.imp-notebtn{ border:none; background:transparent; text-align:left; font:inherit; font-size:var(--fs-xs); color:var(--text-soft); font-style:italic; padding:2px 4px; border-radius:6px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-height:28px; }
.imp-notebtn.is-empty{ color:var(--text-mute); font-style:normal; }
.imp-notebtn:hover{ background:var(--surface-2); }

/* layout C: righe + pannello spesa */
.planner-split{ display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:var(--sp-4); align-items:start; }
.pl-rows{ display:flex; flex-direction:column; gap:8px; min-height:calc(100dvh - 300px); }
.pl-row{ flex:1; display:grid; grid-template-columns:56px minmax(0,1fr) 180px; gap:8px; align-items:stretch; min-height:76px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px; }
.pl-row.is-today{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-soft); }
.pl-day{ display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:2px; padding-left:4px; position:relative; }
.pl-day .d-menu-btn{ position:absolute; left:2px; bottom:0; border:none; background:transparent; color:var(--text-mute); cursor:pointer; font-size:14px; padding:2px 4px; border-radius:6px; }
.pl-meals{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; min-width:0; }
.shop-panel{ position:sticky; top:80px; display:flex; flex-direction:column; gap:8px; padding:var(--sp-4); max-height:calc(100dvh - 100px); }
.shop-panel .sp-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.shop-panel .sp-title{ font-weight:700; font-size:var(--fs-base); }
.shop-panel .sp-tools{ display:flex; gap:6px; }
.shop-panel .sp-tools input{ flex:1; min-width:0; min-height:40px; }
.shop-panel .sp-list{ overflow:auto; flex:1; min-height:0; }
.shop-item.compact{ padding:5px 8px; gap:8px; }
.shop-item.compact .si-name{ font-size:var(--fs-xs); }
.shop-item.compact .si-badge{ display:none; }
@media(max-width:980px){ .planner-split{ grid-template-columns:1fr; } .shop-panel{ position:static; max-height:none; } .pl-rows{ min-height:0; } }
@media(max-width:640px){ .pl-row{ grid-template-columns:48px minmax(0,1fr); } .pl-row .imp-cell{ grid-column:1 / -1; } }

/* --- iPad: sfruttare tutta l'altezza --- */
.app-header .brand{ white-space:nowrap; }
@media(max-width:1200px){ .hdr-week input[type="date"]{ display:none; } }
@media(min-width:821px){ main{ padding-bottom:var(--sp-4); } }
.planner-head{ flex-wrap:nowrap; gap:var(--sp-3); margin-bottom:var(--sp-3); }
.planner-head .tk-today{ flex:none; min-height:32px; }
.planner-head .ticker{ flex:1; min-width:0; margin:0; padding:0; }
@media(max-width:820px){ .planner-head{ flex-wrap:wrap; } .planner-head .ticker{ order:3; flex-basis:100%; } }
.planner-grid{ min-height:calc(100dvh - 230px); }
.pl-rows{ min-height:calc(100dvh - 230px); }
.pl-row{ min-height:68px; }
.meal-wrap.compact .meal-cell{ min-height:52px; }
.imp-cell.compact{ gap:2px; }
.imp-cell.compact .imp-row{ min-height:24px; padding:0 4px; }
.imp-actions{ display:flex; align-items:center; gap:6px; min-width:0; }
.imp-actions .imp-add{ flex:none; min-height:26px; padding:2px 8px; }
.imp-actions .imp-notebtn{ flex:1; min-width:0; min-height:26px; }
.app-footer{ padding:var(--sp-3) 0; }

/* titoli impegni su due righe nella griglia (non nel compatto) */
.imp-cell:not(.compact) .imp-row{ align-items:flex-start; flex-wrap:wrap; }
.imp-cell:not(.compact) .imp-row .imp-dot{ margin-top:6px; }
.imp-cell:not(.compact) .imp-row .imp-title{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; flex:1 1 60%; }
.imp-cell:not(.compact) .imp-row .chip{ margin-left:13px; }

/* --- liste spesa esplicite, modalità supermercato, tastino carrello --- */
.m-cart{ position:absolute; left:6px; bottom:6px; min-height:28px; min-width:36px; padding:2px 8px; border-radius:999px; font-family:inherit;
  font-size:var(--fs-xs); font-weight:700; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border); cursor:pointer; }
.m-cart:hover{ border-color:var(--accent); color:var(--text); }
.m-cart.in{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
:root[data-theme="dark"] .m-cart.in{ color:var(--text); }
.meal-wrap.compact .meal-cell{ padding-right:104px; }
.meal-wrap.compact .m-cart{ left:auto; right:50px; bottom:auto; top:50%; transform:translateY(-50%); }
.shop-banner{ background:var(--accent-soft); color:var(--accent-strong); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:var(--sp-3); font-size:var(--fs-sm); }
.shop-banner.small{ padding:6px 10px; font-size:var(--fs-xs); margin-bottom:0; }
:root[data-theme="dark"] .shop-banner{ color:var(--text); }
.shop-item.shop-mode{ min-height:56px; padding:10px 12px; cursor:pointer; user-select:none; -webkit-user-select:none; }
.shop-item.shop-mode .si-check{ width:28px; height:28px; }
.shop-item.shop-mode .si-name{ font-size:var(--fs-base); }
.shop-item.shop-mode .si-qty{ font-size:var(--fs-base); font-weight:600; }
.shop-item.shop-mode.compact{ min-height:44px; padding:6px 8px; }
.shop-item.shop-mode.compact .si-name, .shop-item.shop-mode.compact .si-qty{ font-size:var(--fs-sm); }
.rep-head.sticky{ position:sticky; top:0; background:var(--bg); z-index:2; padding:6px 0; }
.shop-panel .rep-head.sticky{ background:var(--surface); }
.sp-empty{ text-align:center; padding:var(--sp-6) var(--sp-4); }
.sp-empty .big{ font-size:44px; margin-bottom:var(--sp-2); }
.sp-add-compact{ padding:var(--sp-3); }
.sp-archive summary{ cursor:pointer; font-weight:600; font-size:var(--fs-sm); color:var(--text-soft); }
.base-check{ max-height:min(60dvh, 520px); overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:4px 10px; }
.base-check .rep-head.sticky{ background:var(--surface); }
.bc-row{ display:flex; align-items:center; gap:10px; min-height:44px; border-bottom:1px solid var(--border); cursor:pointer; font-size:var(--fs-sm); }
.bc-row:last-child{ border-bottom:none; }
.bc-row input{ width:24px; height:24px; min-height:auto; flex:none; }
.bc-row .bc-name{ flex:1; font-weight:600; }
.bc-row.locked{ opacity:.75; cursor:default; }

/* --- telefono: agenda verticale --- */
.agenda{ display:flex; flex-direction:column; gap:10px; }
.agenda-day{ display:grid; grid-template-columns:54px minmax(0,1fr); gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; }
.agenda-day.is-today{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-soft); }
.agenda-day.is-today .d-num{ color:var(--accent-strong); }
.ag-date{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; position:relative; }
.ag-date .d-wd{ font-size:12px; font-weight:600; color:var(--text-soft); text-transform:uppercase; letter-spacing:.04em; }
.ag-date .d-num{ font-size:var(--fs-2xl); font-weight:700; line-height:1; }
.ag-date .chip{ padding:1px 7px; font-size:11px; }
.ag-date .d-menu-btn{ border:none; background:transparent; color:var(--text-mute); cursor:pointer; font-size:16px; padding:2px 4px; border-radius:6px; margin-top:auto; }
.ag-body{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.ag-body .meal-wrap.compact .meal-cell{ min-height:52px; }
@media(max-width:700px){
  .planner-head{ gap:8px; }
  .planner-head .tk-today{ order:1; } .planner-head > .flex{ order:2; margin-left:auto; }
  .view-head h1{ font-size:var(--fs-xl); }
  .shop-item.shop-mode{ min-height:60px; }
  .hdr-week .btn{ min-height:38px; padding:0 10px; } .hdr-week .btn-icon{ min-width:38px; }
}

.wk-weekend{ flex:none; }
.wk-weekend.is-on{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
:root[data-theme="dark"] .wk-weekend.is-on{ color:var(--text); }

/* ===========================================================================
   13. STILE «CARTE DA GIOCO»  (Impostazioni → Aspetto → Stile grafico)
   Carta avorio su tappeto colorato, elementi bianchi a spigoli vivi con bordo
   inchiostro 2px e ombra dura 3px (2px per i piccoli). Niente raggi, sfumature,
   trasparenze. Titoli serif rosa con ombra azzurra.
   =========================================================================== */
:root[data-style="carte"], :root[data-style="carte"][data-accent]{
  --ck-ink:#222222; --ck-avorio:#F7EFE2; --ck-rosa:#D6216F; --ck-azzurro:#36ADE0; --ck-macchia:#D6CFC2;
  --ck-tenue:#6E6458; --ck-barra:#DDD4C4; --ck-giallo:#EFD63A; --ck-verde:#3F9F4A; --ck-arancio:#E39A43;
  --ck-rosa-chiara:#F6D3E2; --ck-azzurro-chiaro:#D4ECF7; --ck-giallo-chiaro:#F9F2C9; --ck-verde-chiaro:#D6EBD8; --ck-arancio-chiaro:#F8E6D0;
  --radius:0; --radius-sm:0; --radius-lg:0; --radius-btn:0;
  --shadow-1:3px 3px 0 var(--ck-ink); --shadow-2:3px 3px 0 var(--ck-ink);
  --bg:var(--ck-avorio); --surface:#ffffff; --surface-2:var(--ck-avorio);
  --text:var(--ck-ink); --text-soft:var(--ck-tenue); --text-mute:var(--ck-tenue);
  --border:var(--ck-ink); --border-strong:var(--ck-ink);
  --glass:var(--ck-avorio); --glass-border:var(--ck-ink);
  --accent:var(--ck-azzurro); --accent-2:var(--ck-azzurro); --accent-strong:var(--ck-rosa); --accent-contrast:#ffffff;
  --accent-ring:var(--ck-azzurro); --accent-soft:var(--ck-azzurro-chiaro); --accent-grad:var(--ck-ink);
  --danger:var(--ck-rosa); --danger-soft:var(--ck-rosa-chiara); --warn:var(--ck-arancio); --ok:var(--ck-verde);
  --u-green:var(--ck-verde); --u-yellow:#9a7f00; --u-orange:var(--ck-arancio); --u-red:var(--ck-rosa);
}
:root[data-style="carte"]{ --ck-card:#ffffff; }
:root[data-style="carte"][data-theme="dark"] .meal-cell, :root[data-style="carte"][data-theme="dark"] .imp-cell, :root[data-style="carte"][data-theme="dark"] .shop-item, :root[data-style="carte"][data-theme="dark"] .card{ color:var(--text); }
:root[data-style="carte"][data-theme="dark"]{ --ck-avorio:#2a2622; --ck-macchia:#3a342e; --ck-tenue:#b8ae9e; --ck-card:#3a342e; --surface:#3a342e; --surface-2:#2a2622; --text:#f4ede0; --text-soft:#d8cfbf; --ck-ink:#111111; --border:#111111; --ck-azzurro-chiaro:#1f3a46; --ck-rosa-chiara:#4a2234; --ck-giallo-chiaro:#4a4320; --ck-verde-chiaro:#23402a; --ck-arancio-chiaro:#4a3320; }
/* tappeto rosa + carta avorio con doppio filetto bianco e macchie */
:root[data-style="carte"] html{ background:var(--ck-rosa); }
:root[data-style="carte"] body{ background:transparent; padding:2px 8px 6px; min-height:100dvh; }
:root[data-style="carte"] body::before{
  content:""; position:fixed; inset:2px 8px 6px; z-index:-1; background:var(--ck-avorio);
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 5px var(--ck-avorio), inset 0 0 0 6px rgba(255,255,255,.9);
  background-image:
    radial-gradient(ellipse 30px 25px at 16% 5%, var(--ck-macchia) 98%, transparent 100%),
    radial-gradient(ellipse 12px 10px at 24% 8.5%, var(--ck-macchia) 98%, transparent 100%),
    radial-gradient(ellipse 8px 7px at 9% 10%, var(--ck-macchia) 98%, transparent 100%),
    radial-gradient(ellipse 18px 15px at 80% 4%, var(--ck-macchia) 98%, transparent 100%),
    radial-gradient(ellipse 10px 8px at 71% 7.5%, var(--ck-macchia) 98%, transparent 100%),
    radial-gradient(ellipse 8px 7px at 90% 9.5%, var(--ck-macchia) 98%, transparent 100%),
    radial-gradient(ellipse 6px 5px at 62% 3.5%, var(--ck-macchia) 98%, transparent 100%),
    radial-gradient(ellipse 6px 5px at 33% 4.5%, var(--ck-macchia) 98%, transparent 100%);
}
:root[data-style="carte"] .app-header, :root[data-style="carte"] .tabbar{ background:var(--ck-avorio); backdrop-filter:none; -webkit-backdrop-filter:none; border-color:var(--ck-ink); }
:root[data-style="carte"] .app-header{ border-bottom:2px solid var(--ck-ink); }
:root[data-style="carte"] .tabbar{ border-top:2px solid var(--ck-ink); }
:root[data-style="carte"] .app-footer{ border-top:2px solid var(--ck-ink); color:var(--ck-tenue); }
/* titoli: serif nerissimo rosa con ombra azzurra netta */
:root[data-style="carte"] h1, :root[data-style="carte"] .brand span:last-child, :root[data-style="carte"] .sp-title, :root[data-style="carte"] .cover h1{
  font-family:"Iowan Old Style","Palatino","Georgia","Times New Roman",serif; font-weight:900; letter-spacing:0;
  color:var(--ck-rosa); text-shadow:2px 2px 0 var(--ck-azzurro); }
:root[data-style="carte"] h2, :root[data-style="carte"] h3{ font-family:"Iowan Old Style","Palatino","Georgia",serif; font-weight:900; letter-spacing:0; color:var(--ck-ink); }
:root[data-style="carte"] .set-group h3{ color:var(--ck-rosa); text-shadow:1px 1px 0 var(--ck-azzurro); }
/* etichette maiuscole */
:root[data-style="carte"] .sec, :root[data-style="carte"] .rep-head, :root[data-style="carte"] .ticker .tk-label, :root[data-style="carte"] .dname, :root[data-style="carte"] .d-wd, :root[data-style="carte"] .top-nav button, :root[data-style="carte"] .tabbar button{
  text-transform:uppercase; letter-spacing:.04em; font-weight:800; color:var(--ck-ink); }
:root[data-style="carte"] .rep-head{ background:var(--ck-azzurro); color:#fff; display:inline-flex; padding:3px 10px; box-shadow:2px 2px 0 var(--ck-ink); margin:10px 0 8px; }
:root[data-style="carte"] .rep-head .rep-count{ color:#fff; }
:root[data-style="carte"] .rep-head.sticky{ background:var(--ck-azzurro); }
/* il rilievo: bordo 2 + ombra dura 3 */
:root[data-style="carte"] .card, :root[data-style="carte"] .meal-cell, :root[data-style="carte"] .imp-cell, :root[data-style="carte"] .pg-day, :root[data-style="carte"] .pl-row, :root[data-style="carte"] .agenda-day, :root[data-style="carte"] .shop-item, :root[data-style="carte"] .rec-card, :root[data-style="carte"] .modal, :root[data-style="carte"] .pop, :root[data-style="carte"] .ac-list, :root[data-style="carte"] .shop-panel, :root[data-style="carte"] .empty-state, :root[data-style="carte"] .base-check{
  border:2px solid var(--ck-ink); border-radius:0; box-shadow:3px 3px 0 var(--ck-ink); background:var(--ck-card); }
:root[data-style="carte"] .pg-day, :root[data-style="carte"] .pl-row, :root[data-style="carte"] .agenda-day, :root[data-style="carte"] .imp-cell{ background:var(--ck-card); }
:root[data-style="carte"] .pg-day.is-today, :root[data-style="carte"] .pl-row.is-today, :root[data-style="carte"] .agenda-day.is-today{ background:var(--ck-azzurro-chiaro); box-shadow:3px 3px 0 var(--ck-ink); }
:root[data-style="carte"] .meal-cell.is-empty{ border-style:dashed; box-shadow:none; background:transparent; }
:root[data-style="carte"] .meal-cell:hover{ background:var(--ck-azzurro-chiaro); }
:root[data-style="carte"] .shop-item.have-it{ background:var(--ck-avorio); opacity:.6; box-shadow:none; }
:root[data-style="carte"] .pg-day.is-today .d-num, :root[data-style="carte"] .pl-row.is-today .d-num, :root[data-style="carte"] .agenda-day.is-today .d-num{ color:var(--ck-rosa); }
/* pulsanti */
:root[data-style="carte"] .btn{ border:2px solid var(--ck-ink); border-radius:0; background:var(--ck-card); color:var(--ck-ink); box-shadow:3px 3px 0 var(--ck-ink); font-weight:600; transition:none; }
:root[data-style="carte"] .btn:hover{ background:var(--ck-card); filter:none; }
:root[data-style="carte"] .btn:active{ transform:translate(3px,3px); box-shadow:none; }
:root[data-style="carte"] .btn-primary{ background:var(--ck-ink); color:#fff; text-transform:uppercase; letter-spacing:.06em; font-weight:800; box-shadow:3px 3px 0 var(--ck-azzurro); }
:root[data-style="carte"] .btn-primary:hover{ background:var(--ck-ink); box-shadow:3px 3px 0 var(--ck-azzurro); }
:root[data-style="carte"] .btn-danger{ background:var(--ck-rosa); color:#fff; box-shadow:3px 3px 0 var(--ck-ink); }
:root[data-style="carte"] .btn-ghost{ border-color:transparent; box-shadow:none; background:transparent; }
:root[data-style="carte"] .btn-ghost:hover{ background:var(--ck-avorio); }
:root[data-style="carte"] .btn-sm{ box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .btn-sm.btn-primary{ box-shadow:2px 2px 0 var(--ck-azzurro); }
:root[data-style="carte"] .btn:disabled{ opacity:.4; }
/* chip, badge, piccoli */
:root[data-style="carte"] .chip, :root[data-style="carte"] .m-people, :root[data-style="carte"] .m-cart, :root[data-style="carte"] .imp-add, :root[data-style="carte"] .imp-row .chip, :root[data-style="carte"] .tk-chip{
  border:2px solid var(--ck-ink); border-radius:0; box-shadow:2px 2px 0 var(--ck-ink); background:#fff; color:var(--ck-ink); font-weight:700; }
:root[data-style="carte"] .chip-accent, :root[data-style="carte"] .m-people.is-set, :root[data-style="carte"] .m-cart.in{ background:var(--ck-azzurro); color:#fff; }
:root[data-style="carte"] .chip-danger{ background:var(--ck-rosa); color:#fff; }
:root[data-style="carte"] .tk-chip.red{ background:var(--ck-rosa); color:#fff; }
:root[data-style="carte"] .tk-chip.orange{ background:var(--ck-arancio); color:var(--ck-ink); }
:root[data-style="carte"] .tk-chip.yellow{ background:var(--ck-giallo); color:var(--ck-ink); }
:root[data-style="carte"] .tk-chip .tk-when{ color:inherit; opacity:.85; }
:root[data-style="carte"] .wk-weekend.is-on{ background:var(--ck-azzurro); color:#fff; }
:root[data-style="carte"] .rl-letter{ border:2px solid var(--ck-ink); border-radius:0; background:var(--ck-card); box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .imp-dot{ border-radius:0; width:8px; height:8px; }
/* navigazione */
:root[data-style="carte"] .top-nav{ background:transparent; border:none; padding:0; gap:6px; }
:root[data-style="carte"] .top-nav button{ border:2px solid var(--ck-ink); border-radius:0; background:var(--ck-card); box-shadow:2px 2px 0 var(--ck-ink); padding:6px 12px; }
:root[data-style="carte"] .top-nav button[aria-current="page"]{ background:var(--ck-rosa); color:#fff; box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .tabbar button[aria-current="page"]{ color:var(--ck-rosa); }
:root[data-style="carte"] .brand .logo{ border-radius:0; border:2px solid var(--ck-ink); background:var(--ck-card); box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .seg{ background:transparent; border:none; padding:0; gap:6px; border-radius:0; }
:root[data-style="carte"] .seg button{ border:2px solid var(--ck-ink); border-radius:0; background:var(--ck-card); box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .seg button[aria-pressed="true"]{ background:var(--ck-azzurro); color:#fff; box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .swatch{ border-radius:0; border:2px solid var(--ck-ink); box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .swatch[aria-pressed="true"]{ box-shadow:2px 2px 0 var(--ck-ink), 0 0 0 3px #fff, 0 0 0 5px var(--ck-rosa); }
/* campi */
:root[data-style="carte"] input[type=text], :root[data-style="carte"] input[type=number], :root[data-style="carte"] input[type=time], :root[data-style="carte"] input[type=date], :root[data-style="carte"] input[type=search], :root[data-style="carte"] select, :root[data-style="carte"] textarea{
  border:2px solid var(--ck-ink); border-radius:0; background:#fff; box-shadow:3px 3px 0 var(--ck-ink); color:var(--ck-ink); }
:root[data-style="carte"] input:focus, :root[data-style="carte"] select:focus, :root[data-style="carte"] textarea:focus{ box-shadow:3px 3px 0 var(--ck-azzurro); outline:none; border-color:var(--ck-ink); }
:root[data-style="carte"] input[type=checkbox]{ accent-color:var(--ck-rosa); }
:root[data-style="carte"] .imp-note, :root[data-style="carte"] .note-cell textarea{ box-shadow:none; border-width:0 0 3px 0; background:transparent; }
/* modali e toast */
:root[data-style="carte"] .modal-backdrop{ background:rgba(34,34,34,.55); backdrop-filter:none; }
:root[data-style="carte"] .modal{ background:var(--ck-avorio); }
:root[data-style="carte"] .modal .card{ background:var(--ck-card); }
:root[data-style="carte"] .toast{ border:2px solid var(--ck-ink); border-radius:0; box-shadow:3px 3px 0 var(--ck-ink); background:var(--ck-card); color:var(--ck-ink); font-weight:700; }
:root[data-style="carte"] .toast.ok{ background:var(--ck-verde-chiaro); }
:root[data-style="carte"] .toast.err{ background:var(--ck-rosa); color:#fff; }
:root[data-style="carte"] .toast.warn{ background:var(--ck-giallo); color:var(--ck-ink); }
:root[data-style="carte"] .shop-banner{ background:var(--ck-giallo); color:var(--ck-ink); border:2px solid var(--ck-ink); box-shadow:3px 3px 0 var(--ck-ink); }
/* schede ricette: fascia colorata in alto, a rotazione (rosa, azzurro, giallo, verde, arancio) */
:root[data-style="carte"] .rec-card{ padding-top:16px; position:relative; transform:none; }
:root[data-style="carte"] .rec-card::before{ content:""; position:absolute; left:2px; right:2px; top:2px; height:8px; background:var(--ck-rosa); }

:root[data-style="carte"] .rec-card:nth-child(5n+3)::before{ background:var(--ck-giallo); }
:root[data-style="carte"] .rec-card:nth-child(5n+4)::before{ background:var(--ck-verde); }
:root[data-style="carte"] .rec-card:nth-child(5n+5)::before{ background:var(--ck-arancio); }
:root[data-style="carte"] .rec-card:hover{ transform:none; box-shadow:3px 3px 0 var(--ck-ink); }
/* numero del giorno: quadratino colorato a rotazione come i numeri delle carte */
:root[data-style="carte"] .pg-day .d-num, :root[data-style="carte"] .pl-day .d-num, :root[data-style="carte"] .ag-date .d-num{
  display:inline-grid; place-items:center; min-width:34px; height:34px; padding:0 6px; font-size:20px; color:#fff;
  background:var(--ck-rosa); box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .pg-day:nth-child(5n+3) .d-num, :root[data-style="carte"] .pl-row:nth-child(5n+2) .d-num, :root[data-style="carte"] .agenda-day:nth-child(5n+2) .d-num{ background:var(--ck-azzurro); }
:root[data-style="carte"] .pg-day:nth-child(5n+4) .d-num, :root[data-style="carte"] .pl-row:nth-child(5n+3) .d-num, :root[data-style="carte"] .agenda-day:nth-child(5n+3) .d-num{ background:var(--ck-giallo); color:var(--ck-ink); }
:root[data-style="carte"] .pg-day:nth-child(5n+5) .d-num, :root[data-style="carte"] .pl-row:nth-child(5n+4) .d-num, :root[data-style="carte"] .agenda-day:nth-child(5n+4) .d-num{ background:var(--ck-verde); }
:root[data-style="carte"] .pg-day:nth-child(5n+6) .d-num, :root[data-style="carte"] .pl-row:nth-child(5n+5) .d-num, :root[data-style="carte"] .agenda-day:nth-child(5n+5) .d-num{ background:var(--ck-arancio); color:var(--ck-ink); }
:root[data-style="carte"] .pg-day.is-today .d-num, :root[data-style="carte"] .pl-row.is-today .d-num, :root[data-style="carte"] .agenda-day.is-today .d-num{ color:#fff; outline:2px solid var(--ck-ink); outline-offset:-2px; }
/* varie */
:root[data-style="carte"] .set-group + .set-group{ border-top:2px solid var(--ck-ink); }
:root[data-style="carte"] .hdr-week .week-label{ font-family:"Iowan Old Style","Palatino","Georgia",serif; font-weight:900; }
:root[data-style="carte"] .planner-grid .pg-rowlabel .rl-letter{ font-size:16px; }
:root[data-style="carte"] .pl-day .d-num, :root[data-style="carte"] .ag-date .d-num, :root[data-style="carte"] .pg-day .d-num{ font-family:"Iowan Old Style","Palatino","Georgia",serif; font-weight:900; }
:root[data-style="carte"] *{ transition:none !important; }
:root[data-style="carte"] .ticker{ padding-right:4px; }
:root[data-style="carte"] .bc-row{ border-bottom:1px solid var(--ck-macchia); }

.chip .base-del{ border:none; background:transparent; color:var(--text-mute); cursor:pointer; padding:0 0 0 4px; font-size:12px; line-height:1; }
.chip .base-del:hover{ color:var(--danger); }

/* --- vado a fare la spesa / supermercati / quantità --- */
.sp-stage{ display:flex; flex-direction:column; align-items:stretch; gap:10px; margin-bottom:var(--sp-4); }
.btn-big{ min-height:56px; font-size:var(--fs-lg); width:100%; }
.sup-pick{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.sup-logo{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:4px 12px 4px 6px; border-radius:999px; border:2px solid var(--border); background:var(--surface); font:inherit; font-weight:700; color:var(--text-soft); cursor:pointer; }
.sup-logo .sup-emoji{ display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--sup,#888); color:#fff; font-size:16px; }
.sup-logo.on{ border-color:var(--sup,var(--accent)); color:var(--text); box-shadow:0 0 0 3px color-mix(in srgb, var(--sup,var(--accent)) 25%, transparent); }
.si-qty-btn{ display:inline-flex; flex-direction:column; align-items:flex-end; gap:1px; border:none; background:transparent; font:inherit; color:inherit; cursor:pointer; padding:4px 6px; border-radius:8px; min-height:36px; }
.si-qty-btn:hover{ background:var(--surface-2); }
.si-qty-btn.manual .si-qty{ color:var(--accent-strong); }
.si-qty{ font-weight:600; font-size:var(--fs-sm); white-space:nowrap; }
.si-conf, .si-nota{ font-size:11px; color:var(--text-mute); white-space:nowrap; }
.sup-map{ display:grid; gap:6px; }
.sup-map select{ flex:1; min-height:36px; }
.sup-card summary::-webkit-details-marker{ display:none; }
.sup-card .sup-emoji{ font-size:20px; }
:root[data-style="carte"] .sup-logo{ border-radius:0; border:2px solid var(--ck-ink); box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .sup-logo.on{ background:var(--ck-azzurro-chiaro); box-shadow:2px 2px 0 var(--ck-ink); }
:root[data-style="carte"] .sup-logo .sup-emoji{ border-radius:0; }

/* ===========================================================================
   14. STILI «MERCATO», «PASTELLO», «MONOSPAZIO», «FUMETTO»
   Ogni stile ridefinisce i token e poi ritocca i componenti che gli danno
   carattere: header, navigazione, celle del planner, finestre, menu, avvisi.
   =========================================================================== */

/* ---------- condivisi: regole sui componenti letti dai token ---------- */
:root[data-style="mercato"], :root[data-style="pastello"], :root[data-style="mono"], :root[data-style="fumetto"], :root[data-style="fumetto"][data-accent]{
  --glass:var(--surface); --glass-border:var(--border);
}
:root[data-style="mercato"] .app-header, :root[data-style="pastello"] .app-header, :root[data-style="mono"] .app-header, :root[data-style="fumetto"] .app-header,
:root[data-style="mercato"] .tabbar, :root[data-style="pastello"] .tabbar, :root[data-style="mono"] .tabbar, :root[data-style="fumetto"] .tabbar{ backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--surface); }
:root[data-style="mercato"] .modal-backdrop, :root[data-style="mono"] .modal-backdrop, :root[data-style="fumetto"] .modal-backdrop{ backdrop-filter:none; }

/* =========================== MERCATO (Banco frigo) =========================== */
:root[data-style="mercato"], :root[data-style="mercato"][data-accent]{
  --font-display:"Oswald","Arial Narrow",Impact,sans-serif; --font-body:"Nunito Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --bg:#dfe7ee; --surface:#ffffff; --surface-2:#f2f6f9; --text:#142033; --text-soft:#44536a; --text-mute:#5c6b80;
  --border:#bccad8; --border-strong:#142033;
  --accent:#ff6b57; --accent-2:#ff8a78; --accent-strong:#d94a37; --accent-contrast:#ffffff; --accent-ring:rgba(255,107,87,.4); --accent-soft:#ffe3de; --accent-grad:#142033;
  --danger:#d7263d; --danger-soft:#fde3e6; --warn:#e9a100; --ok:#17a673; --u-green:#17a673; --u-yellow:#b58600; --u-orange:#e07a2f; --u-red:#d7263d;
  --radius:8px; --radius-sm:8px; --radius-lg:10px; --radius-btn:6px; --shadow-1:none; --shadow-2:0 10px 30px rgba(20,32,51,.18);
}
:root[data-style="mercato"][data-theme="dark"]{ --bg:#0f1a2b; --surface:#16233a; --surface-2:#1f2e49; --text:#f2f6f9; --text-soft:#c3cddd; --text-mute:#9aa8bc; --border:#33456a; --border-strong:#f2f6f9; --accent-soft:#3a2a2a; --accent-grad:#f2f6f9; --accent-contrast:#142033; --danger-soft:#3a1a20; }
:root[data-style="mercato"] body{ font-family:var(--font-body); }
:root[data-style="mercato"] h1, :root[data-style="mercato"] h2, :root[data-style="mercato"] h3, :root[data-style="mercato"] .sp-title, :root[data-style="mercato"] .brand span:last-child, :root[data-style="mercato"] .hdr-week .week-label, :root[data-style="mercato"] .top-nav button, :root[data-style="mercato"] .tabbar button, :root[data-style="mercato"] .btn, :root[data-style="mercato"] .rep-head, :root[data-style="mercato"] .sec, :root[data-style="mercato"] .d-wd, :root[data-style="mercato"] .dname, :root[data-style="mercato"] .set-group h3, :root[data-style="mercato"] .modal-head h2{
  font-family:var(--font-display); font-weight:500; letter-spacing:.05em; text-transform:uppercase; }
:root[data-style="mercato"] h1{ font-size:calc(1.9rem * var(--font-scale)); font-weight:600; letter-spacing:.03em; }
:root[data-style="mercato"] .btn{ font-size:var(--fs-sm); border:1.5px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:6px; }
:root[data-style="mercato"] .btn:hover{ background:var(--surface-2); }
:root[data-style="mercato"] .btn-primary{ background:var(--text); color:var(--surface); border-color:var(--text); }
:root[data-style="mercato"] .btn-primary.btn-big, :root[data-style="mercato"] #wk-all, :root[data-style="mercato"] #sp-close, :root[data-style="mercato"] #sp-done{ background:var(--accent); border-color:var(--accent); color:#fff; }
:root[data-style="mercato"] .btn-ghost{ border-color:transparent; }
:root[data-style="mercato"] .btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
:root[data-style="mercato"] .chip{ border:1.5px dashed var(--border-strong); border-radius:6px; background:var(--surface); font-weight:800; }
:root[data-style="mercato"] .chip-accent{ border-style:solid; border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); }
:root[data-style="mercato"] .chip-danger{ border-style:solid; border-color:var(--danger); background:var(--danger-soft); color:var(--danger); }
:root[data-style="mercato"] .tk-chip{ border-style:solid; }
:root[data-style="mercato"] .top-nav{ background:transparent; border:none; padding:0; gap:6px; }
:root[data-style="mercato"] .top-nav button{ font-size:var(--fs-base); border-radius:6px; padding:6px 12px; }
:root[data-style="mercato"] .top-nav button[aria-current="page"]{ background:var(--text); color:var(--surface); box-shadow:none; }
:root[data-style="mercato"] .tabbar button[aria-current="page"]{ color:var(--accent-strong); }
:root[data-style="mercato"] .app-header{ border-bottom:2px solid var(--text); }
:root[data-style="mercato"] .tabbar{ border-top:2px solid var(--text); }
:root[data-style="mercato"] .brand .logo{ border-radius:6px; background:var(--text); color:var(--surface); }
/* planner */
:root[data-style="mercato"] .pg-day, :root[data-style="mercato"] .pl-row, :root[data-style="mercato"] .agenda-day{ background:transparent; border:none; border-bottom:2px dashed var(--border-strong); border-radius:0; box-shadow:none; }
:root[data-style="mercato"] .pl-row, :root[data-style="mercato"] .agenda-day{ border:1.5px solid var(--border); border-radius:8px; background:var(--surface); }
:root[data-style="mercato"] .pg-day.is-today{ border-bottom:3px solid var(--accent); box-shadow:none; }
:root[data-style="mercato"] .pl-row.is-today, :root[data-style="mercato"] .agenda-day.is-today{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--surface); }
:root[data-style="mercato"] .pg-day .d-num, :root[data-style="mercato"] .pl-day .d-num, :root[data-style="mercato"] .ag-date .d-num{ font-family:var(--font-display); font-weight:600; font-size:32px; }
:root[data-style="mercato"] .pg-day.is-today .d-num, :root[data-style="mercato"] .pl-row.is-today .d-num, :root[data-style="mercato"] .agenda-day.is-today .d-num{ color:var(--accent-strong); }
:root[data-style="mercato"] .pg-day .d-today{ background:var(--accent); color:#fff; border-radius:3px; }
:root[data-style="mercato"] .meal-cell, :root[data-style="mercato"] .imp-cell{ border:1.5px solid var(--border); border-radius:8px; }
:root[data-style="mercato"] .meal-cell.is-empty{ border-style:dashed; }
:root[data-style="mercato"] .meal-cell .m-title{ font-size:var(--fs-base); }
:root[data-style="mercato"] .m-people, :root[data-style="mercato"] .m-cart{ border-radius:6px; }
:root[data-style="mercato"] .m-people.many{ background:var(--accent); color:#fff; }

:root[data-style="mercato"] .imp-row .imp-title{ font-weight:700; }
:root[data-style="mercato"] .rl-letter{ border-radius:6px; background:transparent; border:none; }
/* spesa */
:root[data-style="mercato"] .rep-head{ font-size:var(--fs-base); color:var(--text); border-bottom:2px dashed var(--border-strong); padding-bottom:4px; margin:14px 0 8px; }
:root[data-style="mercato"] .shop-item{ border:1.5px solid var(--border); border-radius:8px; }
:root[data-style="mercato"] .shop-item.shop-mode .si-name{ font-family:var(--font-display); font-size:19px; letter-spacing:.02em; text-transform:none; }
:root[data-style="mercato"] .shop-banner{ background:var(--accent-soft); color:var(--accent-strong); border:1.5px solid var(--accent); }
:root[data-style="mercato"] .sup-logo{ border-radius:6px; }
/* finestre secondarie */
:root[data-style="mercato"] .modal{ border:2px solid var(--text); border-radius:10px; }
:root[data-style="mercato"] .modal-head{ border-bottom:2px dashed var(--border-strong); }
:root[data-style="mercato"] .modal-foot{ border-top:2px dashed var(--border-strong); }
:root[data-style="mercato"] .pop, :root[data-style="mercato"] .ac-list{ border:1.5px solid var(--text); border-radius:8px; }
:root[data-style="mercato"] .pop small, :root[data-style="mercato"] .sec{ font-family:var(--font-display); letter-spacing:.08em; text-transform:uppercase; }
:root[data-style="mercato"] .toast{ border-radius:6px; font-family:var(--font-display); letter-spacing:.03em; font-size:var(--fs-base); }
:root[data-style="mercato"] input[type=text], :root[data-style="mercato"] input[type=number], :root[data-style="mercato"] input[type=time], :root[data-style="mercato"] input[type=date], :root[data-style="mercato"] input[type=search], :root[data-style="mercato"] select, :root[data-style="mercato"] textarea{ border:1.5px solid var(--border-strong); border-radius:6px; background:var(--surface); }
:root[data-style="mercato"] .seg{ background:transparent; border:none; padding:0; gap:6px; border-radius:0; }
:root[data-style="mercato"] .seg button{ border:1.5px solid var(--border-strong); border-radius:6px; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.04em; }
:root[data-style="mercato"] .seg button[aria-pressed="true"]{ background:var(--text); color:var(--surface); box-shadow:none; }
:root[data-style="mercato"] .swatch{ border-radius:6px; }
:root[data-style="mercato"] .card{ border:1.5px solid var(--border); }
:root[data-style="mercato"] .set-group h3{ color:var(--text); border-bottom:2px dashed var(--border-strong); padding-bottom:4px; }
:root[data-style="mercato"] .rec-card{ border:1.5px solid var(--border); border-radius:8px; }
:root[data-style="mercato"] .rec-card .rc-title{ font-family:var(--font-display); font-size:19px; letter-spacing:.02em; }
:root[data-style="mercato"] .bc-row .bc-name{ font-size:var(--fs-base); }
:root[data-style="mercato"] .cd{ border-radius:4px; }

/* =========================== PASTELLO =========================== */
:root[data-style="pastello"], :root[data-style="pastello"][data-accent]{
  --font-display:"Quicksand","Avenir Next Rounded","Nunito",system-ui,sans-serif; --font-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --bg:#dfe6ee; --surface:#ffffff; --surface-2:#eef2f8; --text:#2a3340; --text-soft:#4f5b6c; --text-mute:#6f7a8a;
  --border:#e3e8ef; --border-strong:#c9d2de;
  --accent:#4f7fd9; --accent-2:#6d97e6; --accent-strong:#3b66bd; --accent-contrast:#ffffff; --accent-ring:rgba(79,127,217,.35); --accent-soft:#dfe8fb; --accent-grad:linear-gradient(135deg,#6d97e6,#4f7fd9);
  --danger:#e0657a; --danger-soft:#fde2e2; --warn:#f0a35c; --ok:#4bb087; --u-green:#4bb087; --u-yellow:#c9941e; --u-orange:#e8883f; --u-red:#e0657a;
  --radius:18px; --radius-sm:14px; --radius-lg:22px; --radius-btn:999px;
  --shadow-1:0 1px 2px rgba(42,51,64,.05), 0 6px 16px rgba(42,51,64,.06); --shadow-2:0 18px 44px rgba(42,51,64,.16);
  --p1:#fde2e2; --p2:#fff0c9; --p3:#dff3e6; --p4:#e5e0fb; --p5:#dbeefb; --p6:#ffe6d5; --p7:#e6f4f1;
}
:root[data-style="pastello"][data-theme="dark"]{ --bg:#1b1f27; --surface:#262c38; --surface-2:#2f3644; --text:#eef2f8; --text-soft:#c3cbd8; --text-mute:#97a1b2; --border:#3a4252; --border-strong:#4a5466; --accent-soft:#2c3b5c; --danger-soft:#4a2a30;
  --p1:#4a3038; --p2:#4a4330; --p3:#2f4a3a; --p4:#3b3650; --p5:#2f4152; --p6:#4a3a2f; --p7:#2f4544; }
:root[data-style="pastello"] body{ font-family:var(--font-body); }
:root[data-style="pastello"] h1, :root[data-style="pastello"] h2, :root[data-style="pastello"] h3, :root[data-style="pastello"] .brand span:last-child, :root[data-style="pastello"] .sp-title, :root[data-style="pastello"] .hdr-week .week-label, :root[data-style="pastello"] .modal-head h2, :root[data-style="pastello"] .set-group h3{ font-family:var(--font-display); font-weight:700; letter-spacing:-.01em; }
:root[data-style="pastello"] .btn{ border-color:var(--border); border-radius:999px; font-weight:800; }
:root[data-style="pastello"] .btn-primary{ background:var(--text); border-color:var(--text); color:var(--surface); }
:root[data-style="pastello"] .btn-primary:hover{ background:var(--text); filter:none; box-shadow:var(--shadow-1); }
